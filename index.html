<section class="sec" data-sec="task">
  <h3>과제: 진짜로 동작하는 타이머 완성하기</h3>
  <p><code>TimerViewModel</code>을 만들고 어제의 화면에 연결합니다. <code>TimerContent.kt</code>는 고치지 않습니다. 종료하면 공부한 시간을 알려 주는 결과 창을 띄웁니다(뭉 뽑기는 내일 이 자리에 넣습니다).</p>

  <h4>요구사항 체크리스트</h4>
  <ul class="checklist">
    <li><code>app/build.gradle.kts</code>에 lifecycle 라이브러리 2줄을 추가하고 Sync했다</li>
    <li><code>timer/TimerViewModel.kt</code>에 <code>data class TimerUiState(status, elapsedSeconds, finishedSeconds: Long?)</code>를 만들었다</li>
    <li><code>TimerViewModel</code>이 <code>_uiState</code>(private) / <code>uiState</code>(공개) 쌍을 가진다</li>
    <li><code>start()</code> · <code>pause()</code> · <code>finish()</code> · <code>dismissResult()</code>를 구현했다. 경과 시간은 <b>accumulated + (지금 − startedAt)</b>으로 계산한다</li>
    <li>실행 중에는 <code>viewModelScope.launch</code>로 0.5초마다 시계를 읽어 <code>elapsedSeconds</code>를 갱신하고, 일시정지/종료 때 그 코루틴을 취소한다</li>
    <li><code>SharedPreferences</code>에 <code>status</code>, <code>startedAt</code>, <code>accumulated</code>를 저장하고, ViewModel이 만들어질 때 복원한다</li>
    <li><code>TimerScreen</code>이 <code>viewModel()</code>과 <code>collectAsStateWithLifecycle()</code>을 사용한다</li>
    <li>종료하면 <code>AlertDialog</code>로 <code>resultMessage()</code>를 보여 주고, 확인을 누르면 닫힌다</li>
    <li>시험 통과: ① 회전 ② 홈으로 나갔다 1분 뒤 복귀 ③ 앱 종료 후 1분 뒤 재실행 — 모두 시간이 정확히 이어진다</li>
  </ul>

  <details class="hint"><summary>힌트 1 — ViewModel에서 저장소 쓰기</summary>
    <p><code>SharedPreferences</code>를 얻으려면 <code>Context</code>가 필요합니다. <code>class TimerViewModel(application: Application) : AndroidViewModel(application)</code>으로 만들면 <code>application.getSharedPreferences("timer", Context.MODE_PRIVATE)</code>를 쓸 수 있고, 화면에서는 그대로 <code>viewModel()</code>로 얻을 수 있습니다.</p>
  </details>
  <details class="hint"><summary>힌트 2 — 세 함수가 할 일</summary>
    <p><b>start</b>: <code>startedAt = 지금</code> → 저장 → 틱 코루틴 시작.<br>
    <b>pause</b>: 틱 취소 → <code>accumulated = 현재 경과 시간</code>, <code>startedAt = 0</code> → 저장 → 상태를 PAUSED로.<br>
    <b>finish</b>: 틱 취소 → 총 시간을 계산해 두고 → 두 값을 0으로 → 저장 → 상태를 <code>TimerUiState(finishedSeconds = 총시간)</code>으로 교체.</p>
  </details>
  <details class="hint"><summary>힌트 3 — 저장과 복원</summary>
    <p>저장: <code>prefs.edit { putString("status", status.name); putLong("startedAt", startedAt); … }</code> (<code>androidx.core.content.edit</code>를 import). 복원: <code>init { restore() }</code>에서 읽고, 저장된 상태가 RUNNING이면 <b>틱 코루틴만 다시 시작</b>하면 됩니다. 시작 시각이 그대로 있으니 경과 시간은 저절로 맞습니다. 문자열을 enum으로 되돌릴 때는 <code>TimerStatus.valueOf(문자열)</code>.</p>
  </details>
  <details class="hint"><summary>힌트 4 — 결과 창</summary>
    <p><code>val finished = uiState.finishedSeconds</code> 다음 <code>if (finished != null) { AlertDialog(onDismissRequest = …, title = { Text("…") }, text = { Text(resultMessage(finished)) }, confirmButton = { TextButton(onClick = …) { Text("확인") } }) }</code>. 닫을 때 <code>viewModel.dismissResult()</code>를 불러 <code>finishedSeconds</code>를 null로 되돌립니다.</p>
  </details>

  <details class="answer"><summary>모범 답안 보기</summary>
    <script type="text/plain" class="code" data-lang="kotlin" data-title="timer/TimerViewModel.kt (Day 4 버전)" data-path="app/src/main/java/com/example/mungtimer/timer/TimerViewModel.kt">
package com.example.mungtimer.timer

import android.app.Application
import android.content.Context
import androidx.core.content.edit
import androidx.lifecycle.AndroidViewModel
import androidx.lifecycle.viewModelScope
import kotlinx.coroutines.Job
import kotlinx.coroutines.delay
import kotlinx.coroutines.flow.MutableStateFlow
import kotlinx.coroutines.flow.StateFlow
import kotlinx.coroutines.flow.asStateFlow
import kotlinx.coroutines.flow.update
import kotlinx.coroutines.isActive
import kotlinx.coroutines.launch

// 저장할 때 쓰는 이름표들
private const val KEY_STATUS = "status"
private const val KEY_STARTED_AT = "startedAt"
private const val KEY_ACCUMULATED = "accumulated"

// 타이머 화면에 필요한 모든 값
data class TimerUiState(
    val status: TimerStatus = TimerStatus.IDLE,
    val elapsedSeconds: Long = 0,
    val finishedSeconds: Long? = null,      // 방금 종료한 공부 시간(초). null이면 결과 창을 띄우지 않는다
)

// AndroidViewModel: 저장소를 쓰기 위해 Application(앱 전체를 대표하는 객체)을 받는 ViewModel
class TimerViewModel(application: Application) : AndroidViewModel(application) {

    // 값 몇 개를 기기에 저장하는 작은 메모장
    private val prefs = application.getSharedPreferences("timer", Context.MODE_PRIVATE)

    private val _uiState = MutableStateFlow(TimerUiState())
    val uiState: StateFlow<TimerUiState> = _uiState.asStateFlow()

    private var startedAt = 0L          // 지금 구간을 시작한 시각(ms). 멈춰 있으면 0
    private var accumulated = 0L        // 이전 구간들에서 쌓인 시간(ms)
    private var tickJob: Job? = null    // 화면 갱신 코루틴의 리모컨

    init {
        restore()                       // ViewModel이 만들어질 때 저장된 타이머를 이어 간다
    }

    fun start() {
        if (_uiState.value.status == TimerStatus.RUNNING) return
        startedAt = System.currentTimeMillis()      // 시각을 적어 둔다
        save(TimerStatus.RUNNING)
        startTicking()
    }

    fun pause() {
        if (_uiState.value.status != TimerStatus.RUNNING) return
        tickJob?.cancel()
        accumulated = elapsedMillis()               // 지금까지의 시간을 쌓아 두고
        startedAt = 0L                              // 멈춤 표시
        save(TimerStatus.PAUSED)
        _uiState.update { it.copy(status = TimerStatus.PAUSED, elapsedSeconds = accumulated / 1000) }
    }

    fun finish() {
        if (_uiState.value.status == TimerStatus.IDLE) return
        tickJob?.cancel()
        val totalSeconds = elapsedMillis() / 1000   // 초기화하기 전에 총 시간을 먼저 구한다
        startedAt = 0L
        accumulated = 0L
        save(TimerStatus.IDLE)
        _uiState.update { TimerUiState(finishedSeconds = totalSeconds) }   // 처음 상태 + 결과
    }

    // 결과 창을 닫는다
    fun dismissResult() {
        _uiState.update { it.copy(finishedSeconds = null) }
    }

    // 경과 시간(ms) = 쌓인 시간 + (지금 − 시작 시각)
    private fun elapsedMillis(): Long {
        if (startedAt == 0L) return accumulated
        val runningPart = System.currentTimeMillis() - startedAt
        return accumulated + runningPart.coerceAtLeast(0L)   // 기기 시계가 뒤로 바뀌어도 음수는 되지 않게
    }

    // 0.5초마다 시계를 다시 읽어 화면 상태를 갱신한다. "세는" 것이 아니라 "읽는" 것!
    private fun startTicking() {
        tickJob?.cancel()
        tickJob = viewModelScope.launch {
            while (isActive) {
                _uiState.update {
                    it.copy(status = TimerStatus.RUNNING, elapsedSeconds = elapsedMillis() / 1000)
                }
                delay(500)
            }
        }
    }

    private fun save(status: TimerStatus) {
        prefs.edit {
            putString(KEY_STATUS, status.name)      // enum → "RUNNING" 같은 문자열
            putLong(KEY_STARTED_AT, startedAt)
            putLong(KEY_ACCUMULATED, accumulated)
        }
    }

    private fun restore() {
        val savedStatus = prefs.getString(KEY_STATUS, null) ?: return   // 저장된 적이 없으면 그대로 시작
        startedAt = prefs.getLong(KEY_STARTED_AT, 0L)
        accumulated = prefs.getLong(KEY_ACCUMULATED, 0L)

        when (TimerStatus.valueOf(savedStatus)) {   // 문자열 → enum
            TimerStatus.RUNNING -> startTicking()   // 시작 시각이 그대로라 경과 시간은 저절로 맞는다
            TimerStatus.PAUSED -> _uiState.update {
                it.copy(status = TimerStatus.PAUSED, elapsedSeconds = accumulated / 1000)
            }
            TimerStatus.IDLE -> Unit                // 할 일 없음
        }
    }
}

  var MUNG_SVG =

    '<ellipse cx="60" cy="108" rx="34" ry="6" fill="#3D2C3A" opacity=".1"/>' +

    '<circle cx="43" cy="62" r="6" fill="#3D2C3A"/><circle cx="77" cy="62" r="6" fill="#3D2C3A"/>' +
    '<circle cx="45" cy="60" r="2" fill="#fff"/><circle cx="79" cy="60" r="2" fill="#fff"/>' +
    '<ellipse cx="31" cy="75" rx="8" ry="5" fill="#FF5E7E" opacity=".45"/><ellipse cx="89" cy="75" rx="8" ry="5" fill="#FF5E7E" opacity=".45"/>' +
    '<path d="M52 75c4 6 12 6 16 0" stroke="#3D2C3A" stroke-width="4" stroke-linecap="round" fill="none"/></svg>';

  /* ------------------------------------------------------------------
   * 4. 문법 강조 (외부 라이브러리 없이 직접 구현)
   * ------------------------------------------------------------------ */
  function tok(cls, text) {
    if (!text) return '';
    /* 여러 줄 토큰은 줄마다 span을 나눠야 줄 단위 래핑이 깨지지 않습니다 */
    return text.split('\n').map(function (part) {
      return part ? '<span class="tk-' + cls + '">' + esc(part) + '</span>' : '';
    }).join('\n');
  }

  var KOTLIN_KEYWORDS = {};
  ('package import fun val var if else when for while do return class object interface enum data sealed open ' +
   'override private public internal protected in is as null true false this super try catch finally throw ' +
   'suspend companion const lateinit by init constructor typealias break continue abstract annotation inline ' +
   'vararg out where get set').split(' ').forEach(function (word) { KOTLIN_KEYWORDS[word] = true; });

  function highlightString(text) {
    var out = '', last = 0, match;
    var re = /\$\{[^}]*\}|\$[A-Za-z_]\w*/g;
    while ((match = re.exec(text))) {
      out += tok('s', text.slice(last, match.index)) + tok('i', match[0]);
      last = re.lastIndex;
    }
    return out + tok('s', text.slice(last));
  }

  function highlightKotlin(src) {
    var re = /(\/\/[^\n]*)|(\/\*[\s\S]*?\*\/)|("""[\s\S]*?""")|("(?:\\.|[^"\\\n])*")|('(?:\\.|[^'\\\n])+')|(@[A-Za-z_][\w]*)|(\b0[xX][0-9a-fA-F_]+[uUL]*\b|\b\d[\d_]*(?:\.\d[\d_]*)?(?:[eE][+-]?\d+)?[fFuUL]*\b)|([A-Za-z_][A-Za-z0-9_]*)/g;
    var out = '', last = 0, match, prevWord = '';
    while ((match = re.exec(src))) {
      out += esc(src.slice(last, match.index));
      var text = match[0];
      if (match[1] || match[2]) out += tok('c', text);
      else if (match[3] || match[4]) out += highlightString(text);
      else if (match[5]) out += tok('s', text);
      else if (match[6]) out += tok('a', text);
      else if (match[7]) out += tok('n', text);
      else {
        if (KOTLIN_KEYWORDS[text] === true) out += tok('k', text);
        else if (/^[A-Z]/.test(text)) out += tok('t', text);
        else if (prevWord === 'fun' || src.charAt(re.lastIndex) === '(') out += tok('f', text);
        else out += esc(text);
        prevWord = text;
      }
      last = re.lastIndex;
    }
    return out + esc(src.slice(last));
  }

  function highlightXml(src) {
    var re = /(<!--[\s\S]*?-->)|(<\?xml|\?>|<\/?[\w:.\-]+|\/?>)|("[^"]*")|([\w:.\-]+)(?==)/g;
    var out = '', last = 0, match;
    while ((match = re.exec(src))) {
      out += esc(src.slice(last, match.index));
      if (match[1]) out += tok('c', match[0]);
      else if (match[2]) out += tok('g', match[0]);
      else if (match[3]) out += tok('s', match[0]);
      else out += tok('b', match[0]);
      last = re.lastIndex;
    }
    return out + esc(src.slice(last));
  }

  /* TOML · properties · 셸 명령처럼 '#' 주석을 쓰는 설정 파일 */
  function highlightConf(src) {
    var re = /(#[^\n]*)|("(?:\\.|[^"\\\n])*")|(^[ \t]*\[[^\]\n]+\])|(^[ \t]*[\w.\-]+)(?=[ \t]*=)/gm;
    var out = '', last = 0, match;
    while ((match = re.exec(src))) {
      out += esc(src.slice(last, match.index));
      if (match[1]) out += tok('c', match[0]);
      else if (match[2]) out += tok('s', match[0]);
      else if (match[3]) out += tok('k', match[0]);
      else out += tok('b', match[0]);
      last = re.lastIndex;
    }
    return out + esc(src.slice(last));
  }

  /* Firestore 보안 규칙 · JSON */
  var RULES_KEYWORDS = {};
  ('service match allow if function return let true false null read write get list create update delete ' +
   'rules_version in is').split(' ').forEach(function (word) { RULES_KEYWORDS[word] = true; });

  function highlightRules(src) {
    var re = /(\/\/[^\n]*)|(\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)/g;

      else if (match[4]) out += tok('n', text);
      else if (RULES_KEYWORDS[text] === true) out += tok('k', text);
      else if (src.charAt(re.lastIndex) === '(') out += tok('f', text);
      else out += esc(text);
      last = re.lastIndex;
    }
    return out + esc(src.slice(last));
  }

  var LANG_LABEL = { kotlin: 'Kotlin', kts: 'Gradle (Kotlin)', xml: 'XML', toml: 'TOML', conf: '설정', rules: 'Firestore Rules', json: 'JSON', shell: '터미널', text: '', output: '실행 결과' };

  function highlight(src, lang) {
    if (lang === 'kotlin' || lang === 'kts') return highlightKotlin(src);
    if (lang === 'xml') return highlightXml(src);
    if (lang === 'toml' || lang === 'conf' || lang === 'shell') return highlightConf(src);

    return esc(src);
  }

  /* "3,5-7" → {3:true,5:true,6:true,7:true} */
  function parseLineSet(spec) {
    var set = {};
    if (!spec) return set;
    spec.split(',').forEach(function (part) {
      var range = part.trim().split('-');
      var from = parseInt(range[0], 10), to = parseInt(range[range.length - 1], 10);
      if (isNaN(from) || isNaN(to)) return;
      for (var n = from; n <= to; n++) set[n] = true;
    });
    return set;
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    /* file:// 로 열었거나 오래된 브라우저 → 임시 textarea로 복사 */
    return new Promise(function (resolve, reject) {
      var area = document.createElement('textarea');
      area.value = text;
      area.setAttribute('readonly', '');
      area.style.position = 'fixed';
      area.style.top = '-1000px';
      document.body.appendChild(area);
      area.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(area);
      if (ok) resolve(); else reject(new Error('copy failed'));
    });
  }

  function buildCodeBlock(source) {
    var lang = source.getAttribute('data-lang') || 'kotlin';
    var title = source.getAttribute('data-title') || '';
    var raw = source.textContent.replace(/^\n/, '').replace(/\s+$/, '');
    var marked = parseLineSet(source.getAttribute('data-hl'));

    var figure = el('figure', 'code-block' + (lang === 'output' ? ' is-output' : ''));
    var bar = el('figcaption', 'code-bar');
    bar.appendChild(el('span', 'code-dots', '<i></i><i></i><i></i>'));
    var titleNode = el('span', 'code-title');
    titleNode.textContent = title || (lang === 'output' ? '실행 결과' : '');
    bar.appendChild(titleNode);
    var langNode = el('span', 'code-lang');
    langNode.textContent = title && LANG_LABEL[lang] !== undefined ? LANG_LABEL[lang] : (lang === 'output' ? '' : (LANG_LABEL[lang] || lang));
    bar.appendChild(langNode);
    var button = el('button', 'copy-btn');
    button.type = 'button';
    button.textContent = '복사';
    button.setAttribute('aria-label', '코드 복사');
    button.addEventListener('click', function () {
      copyText(raw).then(function () {
        button.textContent = '복사됨!';
        button.classList.add('is-ok');
        setTimeout(function () { button.textContent = '복사'; button.classList.remove('is-ok'); }, 1500);
      }).catch(function () {
        toast('복사하지 못했어요. 직접 드래그해서 복사해 주세요.');
      });
    });
    bar.appendChild(button);
    figure.appendChild(bar);

    var lines = highlight(raw, lang).split('\n').map(function (line, index) {
      return '<span class="ln' + (marked[index + 1] ? ' hl' : '') + '">' + (line || ' ') + '</span>';
    });
    var pre = el('pre');
    pre.setAttribute('tabindex', '0');
    pre.appendChild(el('code', '', lines.join('')));
    figure.appendChild(pre);
    return figure;
  }

  function renderCodeBlocks(root) {
    $all('script.code', root).forEach(function (source) {
      source.parentNode.replaceChild(buildCodeBlock(source), source);
    });
  }

  /* ------------------------------------------------------------------
   * 5. 퀴즈
   * ------------------------------------------------------------------ */
  function quizCount(pageId) {
    var template = templateOf(pageId);

  }
  function quizScore(pageId) {
    var answers = state.quiz[pageId] || {}, score = 0;
    Object.keys(answers).forEach(function (key) { if (answers[key] && answers[key].ok) score++; });
    return score;
  }
  function normalizeAnswer(text) {
    return String(text).replace(/\s+/g, ' ').trim();
  }

  function renderQuiz(root, pageId) {
    var section = $('.sec[data-sec="quiz"]', root);
    if (!section) return;
    var questions = $all('.q', section);
    if (!questions.length) return;

    var top = el('div', 'quiz-top');

    top.appendChild(scoreNode);
    top.appendChild(resetButton);
    questions[0].parentNode.insertBefore(top, questions[0]);

    function updateScore() {
      var answered = Object.keys(state.quiz[pageId] || {}).length;
      scoreNode.innerHTML = '점수 <span>' + quizScore(pageId) + ' / ' + questions.length + '</span>' +
        (answered === questions.length ? ' · 모두 풀었어요 🎉' : '');

      function record(ok, pick) {
        if (!state.quiz[pageId]) state.quiz[pageId] = {};
        state.quiz[pageId][index] = { ok: ok, pick: pick };
        saveState();
        updateScore();

      if (type === 'fill') {
        var accepted = answerSpec.split('||').map(normalizeAnswer);
        var form = el('form', 'q-fill');
        var input = el('input');
        input.type = 'text';
        input.setAttribute('autocomplete', 'off');
        input.setAttribute('autocapitalize', 'off');
        input.setAttribute('spellcheck', 'false');
        input.placeholder = '빈칸에 들어갈 코드를 입력';
        input.setAttribute('aria-label', titleNode ? titleNode.textContent : '빈칸 답 입력');
        var submit = el('button', 'btn');
        submit.type = 'submit';
        submit.textContent = '확인';
        form.appendChild(input);
        form.appendChild(submit);

        var showFill = function (ok, value) {
          input.value = value;
          input.disabled = true;
          submit.disabled = true;
          input.classList.add(ok ? 'is-correct' : 'is-wrong');
          verdict.textContent = ok ? '정답이에요! 🎉' : '아쉬워요 😢  정답: ' + accepted[0];

        };
        form.addEventListener('submit', function (event) {
          event.preventDefault();
          var value = normalizeAnswer(input.value);
          if (!value) { input.focus(); return; }
          var ok = accepted.indexOf(value) !== -1;
          showFill(ok, value);
          record(ok, value);
        });
        var savedFill = state.quiz[pageId] && state.quiz[pageId][index];
        if (savedFill) showFill(savedFill.ok, savedFill.pick);
      } else {
        var correctIndex = parseInt(answerSpec, 10) - 1;
        var list = $('.q-options', question);
        var buttons = $all('li', list).map(function (item, optionIndex) {
          var button = el('button', 'q-opt');
          button.type = 'button';
          var mark = el('span', 'mark');
          mark.textContent = String(optionIndex + 1);
          var label = el('span');
          while (item.firstChild) label.appendChild(item.firstChild);
          button.appendChild(mark);
          button.appendChild(label);
          item.appendChild(button);
          return button;
        });
        var showChoice = function (pick) {
          buttons.forEach(function (button, optionIndex) {
            button.disabled = true;
            if (optionIndex === correctIndex) {
              button.classList.add('is-correct');
              $('.mark', button).textContent = '✓';
            } else if (optionIndex === pick) {
              button.classList.add('is-wrong');
              $('.mark', button).textContent = '✕';
            }
          });
          var ok = pick === correctIndex;
          verdict.textContent = ok ? '정답이에요! 🎉' : '아쉬워요 😢  정답은 ' + (correctIndex + 1) + '번';
          result.className = 'q-result show ' + (ok ? 'ok' : 'bad');
        };
        buttons.forEach(function (button, optionIndex) {
          button.addEventListener('click', function () {
            showChoice(optionIndex);
            record(optionIndex === correctIndex, optionIndex);
          });
        });
        var savedChoice = state.quiz[pageId] && state.quiz[pageId][index];
        if (savedChoice) showChoice(savedChoice.pick);
      }
    });

    updateScore();
  }

  /* ------------------------------------------------------------------
   * 6. 과제 체크리스트 · 접어두기
   * ------------------------------------------------------------------ */
  function renderChecklists(root, pageId) {
    $all('ul.checklist', root).forEach(function (list, listIndex) {
      $all('li', list).forEach(function (item, itemIndex) {
        var key = pageId + ':' + listIndex + ':' + itemIndex;
        var label = el('label', 'check-item');
        var box = el('input');
        box.type = 'checkbox';
        box.checked = !!state.checks[key];
        var text = el('span');
        while (item.firstChild) text.appendChild(item.firstChild);
        label.appendChild(box);
        label.appendChild(text);
        item.appendChild(label);
        box.addEventListener('change', function () {
          if (box.checked) state.checks[key] = true; else delete state.checks[key];
          saveState();
        });
      });
    });
  }

  function wrapDetails(root) {
    $all('details', root).forEach(function (details) {
      var body = el('div', 'details-body');
      var nodes = Array.prototype.slice.call(details.childNodes);
      nodes.forEach(function (node) {
        if (node.nodeType === 1 && node.tagName === 'SUMMARY') return;
        body.appendChild(node);
      });
      details.appendChild(body);
    });
  }

  /* ------------------------------------------------------------------
   * 7. 뭉 뽑기 시뮬레이터 (Day 5 개념 설명용)
   *    앱의 확률표와 똑같은 숫자를 사용합니다.
   * ------------------------------------------------------------------ */
  var GACHA_TABLE = [
    { from: 180, label: '180분 이상', rates: [25, 40, 25, 10] },
    { from: 120, label: '120~179분', rates: [40, 37, 17, 6] },
    { from: 60, label: '60~119분', rates: [55, 32, 10, 3] },
    { from: 30, label: '30~59분', rates: [70, 25, 4, 1] }
  ];
  var GRADE_NAMES = ['일반', '희귀', '영웅', '전설'];
  var GRADE_CLASS = ['', 'rare', 'epic', 'legend'];

  function gachaRow(minutes) {
    for (var i = 0; i < GACHA_TABLE.length; i++) if (minutes >= GACHA_TABLE[i].from) return GACHA_TABLE[i];
    return null;
  }
  function gachaDraw(rates) {
    var roll = Math.floor(Math.random() * 100), sum = 0;
    for (var i = 0; i < rates.length; i++) { sum += rates[i]; if (roll < sum) return i; }
    return 0;
  }

  function renderGachaSim(root) {
    $all('[data-widget="gacha"]', root).forEach(function (box) {
      box.innerHTML =
        '<div class="sim-row"><label for="simMin"><b>공부 시간</b></label>' +
        '<input id="simMin" type="range" min="0" max="240" step="5" value="45">' +
        '<b id="simMinText"></b></div>' +
        '<div class="sim-row"><button class="btn" type="button" id="simOne">뭉 1번 뽑기</button>' +
        '<button class="btn alt" type="button" id="simMany">1,000번 뽑아 비율 보기</button></div>' +
        '<div class="sim-result" id="simResult" aria-live="polite"></div>' +
        '<div class="sim-out" id="simOut"></div>';
      var range = $('#simMin', box), text = $('#simMinText', box), out = $('#simOut', box), result = $('#simResult', box);

      function showRates(counts, total) {
        var row = gachaRow(parseInt(range.value, 10));
        out.innerHTML = '';
        if (!row) return;
        row.rates.forEach(function (rate, index) {
          var actual = counts ? ' → 실제 ' + (counts[index] / total * 100).toFixed(1) + '%' : '';
          out.appendChild(el('div', 'sim-cell',
            '<span class="grade ' + GRADE_CLASS[index] + '">' + GRADE_NAMES[index] + '</span><b>' + rate + '%</b><small>' + actual + '</small>'));
        });
      }
      function refresh() {
        var minutes = parseInt(range.value, 10), row = gachaRow(minutes);
        text.textContent = minutes + '분' + (row ? ' (' + row.label + ' 구간)' : ' (30분 미만)');
        result.textContent = row ? '' : '30분 미만이라 뭉이 나오지 않아요. 조금만 더 힘내요! 💪';
        $('#simOne', box).disabled = !row;
        $('#simMany', box).disabled = !row;
        showRates(null, 0);
      }
      range.addEventListener('input', refresh);
      $('#simOne', box).addEventListener('click', function () {
        var row = gachaRow(parseInt(range.value, 10));
        if (!row) return;
        var grade = gachaDraw(row.rates);
        result.innerHTML = '🎉 <span class="grade ' + GRADE_CLASS[grade] + '">' + GRADE_NAMES[grade] + '</span> 등급 뭉이 나왔어요!';
      });
      $('#simMany', box).addEventListener('click', function () {
        var row = gachaRow(parseInt(range.value, 10));
        if (!row) return;
        var counts = [0, 0, 0, 0], total = 1000;
        for (var i = 0; i < total; i++) counts[gachaDraw(row.rates)]++;
        result.textContent = '1,000번 뽑은 결과예요. 설계한 확률과 비슷하게 나오는지 보세요.';
        showRates(counts, total);
      });
      refresh();
    });
  }

  /* ------------------------------------------------------------------
   * 8. 메뉴 · 전체 진행률
   * ------------------------------------------------------------------ */
  var currentId = null;

  function doneCount() {
    var count = 0;
    for (var day = 1; day <= DAY_COUNT; day++) if (state.done['day' + day]) count++;
    return count;
  }

  function renderNav() {
    var nav = $('#nav');
    nav.innerHTML = '';
    var totalScore = 0, totalQuestions = 0;
    PAGES.forEach(function (page) {
      var count = quizCount(page.id), score = quizScore(page.id);
      totalScore += score;
      totalQuestions += count;
      var link = el('a', 'nav-item' + (state.done[page.id] ? ' is-done' : ''));
      link.href = '#' + page.id;
      if (page.id === currentId) link.setAttribute('aria-current', 'page');
      var kicker = page.day ? 'DAY ' + page.day : page.kicker;
      var shortTitle = page.day ? 'Day ' + page.day : page.short;
      link.innerHTML =
        '<span class="nav-emoji" aria-hidden="true">' + page.emoji + '</span>' +
        '<span><span class="nav-kicker">' + kicker + '</span>' +
        '<span class="nav-title"><span class="long"><br>' + esc(page.title) + '</span><span class="short">' + shortTitle + '</span></span></span>' +
        (page.day
          ? '<span class="nav-meta"><span class="nav-check" aria-hidden="true">✓</span><span>퀴즈 ' + score + '/' + count + '</span></span>'
          : '<span class="nav-meta"></span>');
      if (page.day) link.setAttribute('aria-label', 'Day ' + page.day + ' ' + page.title + (state.done[page.id] ? ' (완료)' : ''));
      nav.appendChild(link);
    });
    var done = doneCount();
    $('#totalDays').textContent = done + ' / ' + DAY_COUNT;
    $('#totalQuiz').textContent = totalScore + ' / ' + totalQuestions;
    $('#totalBar').style.width = (done / DAY_COUNT * 100) + '%';
    $('#totalBarWrap').setAttribute('aria-valuenow', String(done));
    $('#mobileProgress').textContent = done + '/' + DAY_COUNT + '일 · 퀴즈 ' + totalScore + '/' + totalQuestions;
    var active = $('.nav-item[aria-current="page"]', nav);
    if (active && nav.scrollWidth > nav.clientWidth) {
      nav.scrollLeft = active.offsetLeft - (nav.clientWidth - active.offsetWidth) / 2;
    }
  }

  /* ------------------------------------------------------------------
   * 9. 페이지 그리기
   * ------------------------------------------------------------------ */
  function buildHero(page) {
    var hero = el('header', 'hero');
    var left = el('div');
    left.appendChild(el('div', 'hero-kicker', page.day ? 'DAY ' + page.day + ' / ' + DAY_COUNT : '뭉타이머 7일 완성'));
    var title = el('h1');
    title.textContent = page.emoji + ' ' + page.title;
    left.appendChild(title);
    var desc = el('p');
    desc.textContent = page.desc;
    left.appendChild(desc);
    if (page.day) {
      var chips = el('div', 'hero-chips');
      chips.appendChild(el('span', 'chip' + (state.done[page.id] ? ' is-on' : ''), state.done[page.id] ? '✓ 완료한 일차' : '아직 진행 중'));
      chips.appendChild(el('span', 'chip', '퀴즈 ' + quizCount(page.id) + '문제'));
      left.appendChild(chips);
    }
    hero.appendChild(left);
    hero.insertAdjacentHTML('beforeend', MUNG_SVG);
    return hero;
  }

  function decorateSections(root, page) {
    var navBar = el('nav', 'sec-nav');
    navBar.setAttribute('aria-label', '이 페이지의 섹션');
    var step = 0;
    $all('.sec', root).forEach(function (section) {
      var key = section.getAttribute('data-sec');
      var info = SECTIONS[key] || { icon: section.getAttribute('data-icon') || '📌', label: section.getAttribute('data-title') || '' };
      step++;
      section.id = page.id + '-' + (key || 'sec' + step);
      var head = el('div', 'sec-head');
      head.appendChild(el('div', 'sec-num', info.icon));
      var titleBox = el('div');
      if (page.day) titleBox.appendChild(el('div', 'sec-step', 'STEP ' + step + ' / ' + SECTION_ORDER.length));
      var heading = el('h2');
      heading.textContent = info.label;
      titleBox.appendChild(heading);
      head.appendChild(titleBox);
      section.insertBefore(head, section.firstChild);

      var link = el('a');
      link.href = '#' + page.id + '/' + (key || 'sec' + step);
      link.textContent = info.icon + ' ' + info.label;
      link.addEventListener('click', function (event) {
        event.preventDefault();
        section.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      navBar.appendChild(link);
    });
    return navBar;
  }

  function buildDoneBox(page) {
    var box = el('div', 'done-box');
    var text = el('p');
    var button = el('button', 'btn');
    button.type = 'button';
    function refresh() {
      var done = !!state.done[page.id];
      text.innerHTML = done
        ? '<b>Day ' + page.day + ' 완료!</b> 뭉이 박수를 치고 있어요 👏'
        : '퀴즈와 과제를 끝냈다면 완료로 표시해 주세요.';
      button.textContent = done ? '완료 취소' : '✓ Day ' + page.day + ' 완료로 표시';
      button.className = done ? 'btn alt' : 'btn';
    }
    button.addEventListener('click', function () {
      if (state.done[page.id]) delete state.done[page.id]; else state.done[page.id] = true;
      saveState();
      refresh();
      renderNav();
      var chip = $('.hero-chips .chip');
      if (chip) {
        chip.className = 'chip' + (state.done[page.id] ? ' is-on' : '');
        chip.textContent = state.done[page.id] ? '✓ 완료한 일차' : '아직 진행 중';
      }
      if (state.done[page.id]) toast('Day ' + page.day + ' 완료! 수고했어요 🎉');
    });
    refresh();
    box.appendChild(text);
    box.appendChild(button);
    return box;
  }

  function buildPager(page) {
    var index = PAGES.indexOf(page);
    var pager = el('nav', 'pager');
    pager.setAttribute('aria-label', '이전/다음 페이지');
    var prev = PAGES[index - 1], next = PAGES[index + 1];
    function label(target) { return (target.day ? 'Day ' + target.day + ' · ' : '') + target.title; }
    var prevLink = el('a', 'prev');
    if (prev) { prevLink.href = '#' + prev.id; prevLink.innerHTML = '<small>← 이전</small>' + esc(label(prev)); } else prevLink.hidden = true;
    var nextLink = el('a', 'next');
    if (next) { nextLink.href = '#' + next.id; nextLink.innerHTML = '<small>다음 →</small>' + esc(label(next)); } else nextLink.hidden = true;
    pager.appendChild(prevLink);
    pager.appendChild(nextLink);
    return pager;
  }

  function showPage(id, sectionKey) {
    var page = pageById(id) || PAGES[0];
    var template = templateOf(page.id);
    var container = $('#page');
    currentId = page.id;
    container.innerHTML = '';

    var content = document.createDocumentFragment();
    if (template) content.appendChild(template.content.cloneNode(true));
    var holder = el('div');
    holder.appendChild(content);

    wrapDetails(holder);
    var sectionNav = decorateSections(holder, page);
    renderCodeBlocks(holder);
    renderChecklists(holder, page.id);

    container.appendChild(buildHero(page));
    container.appendChild(sectionNav);
    while (holder.firstChild) container.appendChild(holder.firstChild);
    renderQuiz(container, page.id);
    renderGachaSim(container);
    if (page.day) container.appendChild(buildDoneBox(page));
    container.appendChild(buildPager(page));

    state.last = page.id;
    saveState();
    renderNav();
    document.title = (page.day ? 'Day ' + page.day + ' ' : '') + page.title + ' · 뭉타이머 7일 완성';

    var target = sectionKey ? document.getElementById(page.id + '-' + sectionKey) : null;
    if (target) target.scrollIntoView({ block: 'start' });
    else window.scrollTo(0, 0);
  }

  /* 주소의 #day3 또는 #day3/quiz 형태를 읽어 페이지를 고릅니다 */
  function route() {
    var hash = decodeURIComponent(window.location.hash.replace(/^#/, ''));
    var parts = hash.split('/');
    var id = pageById(parts[0]) ? parts[0] : (pageById(state.last) ? state.last : 'prep');
    if (id === currentId && !parts[1]) { window.scrollTo(0, 0); return; }
    showPage(id, parts[1]);
  }

  /* ------------------------------------------------------------------
   * 10. 테마 전환 · 초기화 버튼
   * ------------------------------------------------------------------ */
  function applyTheme() {
    if (state.theme === 'light' || state.theme === 'dark') {
      document.documentElement.setAttribute('data-theme', state.theme);
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
  }

  document.addEventListener('click', function (event) {
    var trigger = event.target.closest ? event.target.closest('[data-action]') : null;
    if (!trigger) return;
    var action = trigger.getAttribute('data-action');
    if (action === 'theme') {
      var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var now = state.theme || (systemDark ? 'dark' : 'light');
      state.theme = now === 'dark' ? 'light' : 'dark';
      saveState();
      applyTheme();
    } else if (action === 'reset') {
      if (window.confirm('완료 표시, 퀴즈 점수, 과제 체크를 모두 지울까요?')) {
        var theme = state.theme;
        state = defaultState();
        state.theme = theme;
        state.last = currentId || 'prep';
        saveState();
        showPage(state.last);
        toast('진행률을 초기화했어요.');
      }
    }
  });

  applyTheme();
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
