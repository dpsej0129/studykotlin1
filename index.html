<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뭉타이머 7일 완성 · 코틀린 안드로이드 학습 노트</title>
<meta name="description" content="코틀린과 Jetpack Compose를 7일 동안 배워 공부 타이머 앱 '뭉타이머'를 직접 만드는 학습용 웹사이트">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 8c14 0 24 10 24 24S46 56 32 56 8 46 8 32 18 8 32 8z' fill='%23FF8FA3'/%3E%3Ccircle cx='24' cy='30' r='3.4' fill='%233D2C3A'/%3E%3Ccircle cx='40' cy='30' r='3.4' fill='%233D2C3A'/%3E%3Cpath d='M27 39c3 3 7 3 10 0' stroke='%233D2C3A' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<!--
  ============================================================
  뭉타이머 7일 완성 — 단일 파일 학습 사이트
  ------------------------------------------------------------
  이 파일 하나만 브라우저로 열면 됩니다. (서버/인터넷 불필요)

  파일 구조 (위에서 아래 순서)
    1) <style>            : 디자인(CSS)
    2) 앱 껍데기 HTML      : 사이드바 + 본문 영역
    3) <template> 9개      : 페이지별 콘텐츠 데이터
         page-prep  : 시작하기 전에
         page-day1 ~ page-day7 : 각 일차
       각 Day 템플릿은 6개 섹션으로 구성됩니다.
         data-sec="goal"    오늘의 목표
         data-sec="concept" 개념 설명
         data-sec="example" 예제 코드
         data-sec="studio"  안드로이드 스튜디오 사용법
         data-sec="quiz"    복습 퀴즈
         data-sec="task"    오늘의 과제
    4) <script>           : 동작(JS) — 메뉴, 문법 강조, 복사, 퀴즈, 진행률 저장

  코드 블록은 type="text/plain" class="code" 인 script 태그 안에
  "있는 그대로" 들어 있어서, 소스에서 바로 읽고 고칠 수 있습니다.
  코드 블록에 붙은 속성의 뜻:
    data-lang   문법 강조에 쓰는 언어 (kotlin, kts, xml, rules, output …)
    data-title  코드 블록 위에 보이는 파일 이름
    data-hl     초록색으로 강조할 줄 번호 (예: "3,5-7")
    data-path   안드로이드 프로젝트에서 이 코드가 들어갈 파일 위치
    data-run    순수 코틀린 예제의 이름표 (data-for 는 그 예제의 실행 결과)
  ============================================================
-->
<style>
/* ---------- 1. 색상 토큰 (뭉 테마) ---------- */
:root {
  --bg: #FFF7EF;
  --bg-deco: #FFEFE2;
  --surface: #FFFFFF;
  --surface-2: #FFF1E6;
  --surface-3: #FDE7EC;
  --ink: #3D2C3A;
  --ink-soft: #6E5967;
  --ink-faint: #9C8794;
  --line: #F2DCCF;
  --primary: #FF8FA3;
  --primary-strong: #F0607F;
  --primary-ink: #C02D55;
  --on-primary: #4A1626;
  --mint: #7FD8BE;
  --mint-ink: #1E7A61;
  --lav: #B9A6F5;
  --lav-ink: #5B45B0;
  --sun: #FFD166;
  --sun-ink: #8A5A00;
  --sky: #8EC5FF;
  --sky-ink: #1F5FA8;
  --ok: #2E9E78;
  --ok-bg: #E2F7EE;
  --bad: #D9486A;
  --bad-bg: #FDE6EB;
  --g-common: #8FA79B;
  --g-rare: #4F9FF0;
  --g-epic: #9B6DF0;
  --g-legend: #F0A92B;
  --code-bg: #2A2233;
  --code-bar: #362C41;
  --code-ink: #F3ECF6;
  --code-line: #463A52;
  --shadow: 0 6px 22px rgba(160, 96, 110, .12);
  --radius: 20px;
  --radius-sm: 12px;
  --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "D2Coding", "Cascadia Code", Consolas, "Liberation Mono", monospace;
  --sidebar-w: 292px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1D1721;
    --bg-deco: #251D2A;
    --surface: #2A212F;
    --surface-2: #33283A;
    --surface-3: #3B2A38;
    --ink: #F6EDF3;
    --ink-soft: #CDBBC9;
    --ink-faint: #9F8D9C;
    --line: #45384C;
    --primary: #FF8FA3;
    --primary-strong: #FF7C94;
    --primary-ink: #FFA3B5;
    --on-primary: #4A1626;
    --mint-ink: #8FE3CA;
    --lav-ink: #CBBCFA;
    --sun-ink: #FFD98A;
    --sky-ink: #A9D3FF;
    --ok: #6FD9B2;
    --ok-bg: #1F3A31;
    --bad: #FF8FA6;
    --bad-bg: #43232D;
    --code-bg: #17121C;
    --code-bar: #221B29;
    --code-line: #382E42;
    --shadow: 0 6px 22px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1D1721;
  --bg-deco: #251D2A;
  --surface: #2A212F;
  --surface-2: #33283A;
  --surface-3: #3B2A38;
  --ink: #F6EDF3;
  --ink-soft: #CDBBC9;
  --ink-faint: #9F8D9C;
  --line: #45384C;
  --primary: #FF8FA3;
  --primary-strong: #FF7C94;
  --primary-ink: #FFA3B5;
  --on-primary: #4A1626;
  --mint-ink: #8FE3CA;
  --lav-ink: #CBBCFA;
  --sun-ink: #FFD98A;
  --sky-ink: #A9D3FF;
  --ok: #6FD9B2;
  --ok-bg: #1F3A31;
  --bad: #FF8FA6;
  --bad-bg: #43232D;
  --code-bg: #17121C;
  --code-bar: #221B29;
  --code-line: #382E42;
  --shadow: 0 6px 22px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

/* ---------- 2. 기본 ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { animation: none !important; transition: none !important; }
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16.5px;
  line-height: 1.78;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
h1, h2, h3, h4 { font-family: var(--font-round); line-height: 1.35; text-wrap: balance; margin: 0; }
p { margin: 0 0 .9em; }
a { color: var(--primary-ink); text-underline-offset: 3px; }
img, svg { max-width: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--lav); outline-offset: 2px; border-radius: 6px; }
kbd {
  font-family: var(--font-mono); font-size: .82em;
  background: var(--surface); border: 1px solid var(--line); border-bottom-width: 3px;
  border-radius: 7px; padding: .08em .45em; white-space: nowrap;
}
code {
  font-family: var(--font-mono); font-size: .88em;
  background: var(--surface-2); color: var(--primary-ink);
  padding: .12em .42em; border-radius: 7px;
}
strong { font-weight: 700; }
hr { border: 0; border-top: 2px dashed var(--line); margin: 28px 0; }

/* ---------- 3. 레이아웃 ---------- */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto;
  padding: 22px 16px 20px; background: var(--bg-deco); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 16px;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 4px 6px; }
.brand svg { width: 52px; height: 52px; flex: none; }
.brand-title { font-family: var(--font-round); font-weight: 800; font-size: 1.22rem; line-height: 1.25; }
.brand-sub { font-size: .8rem; color: var(--ink-soft); }
.total {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 12px 14px; font-size: .86rem; color: var(--ink-soft);
}
.total-row { display: flex; justify-content: space-between; gap: 8px; }
.total-row b { color: var(--ink); font-variant-numeric: tabular-nums; }
.bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin: 8px 0 8px; }
.bar > i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--primary), var(--sun)); transition: width .35s ease; }
.nav { display: flex; flex-direction: column; gap: 6px; }
.nav-item {
  display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; align-items: center; gap: 10px;
  width: 100%; text-align: left; border: 1px solid transparent; background: transparent;
  border-radius: 14px; padding: 9px 10px; text-decoration: none; color: var(--ink);
}
.nav-item:hover { background: var(--surface); }
.nav-item[aria-current="page"] { background: var(--surface); border-color: var(--primary); box-shadow: var(--shadow); }
.nav-emoji {
  width: 38px; height: 38px; display: grid; place-items: center; font-size: 1.2rem;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
}
.nav-item[aria-current="page"] .nav-emoji { background: var(--surface-3); border-color: transparent; }
.nav-kicker { font-size: .72rem; font-weight: 700; color: var(--primary-ink); letter-spacing: .04em; }
.nav-title { font-size: .9rem; font-weight: 600; line-height: 1.3; }
.nav-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: .72rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.nav-check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: .7rem; color: transparent; }
.nav-item.is-done .nav-check { background: var(--mint); border-color: var(--mint); color: #114434; }
.side-foot { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.ghost-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 99px;
  padding: 6px 12px; font-size: .8rem; color: var(--ink-soft);
}
.ghost-btn:hover { border-color: var(--primary); color: var(--ink); }

.main { min-width: 0; padding: 28px clamp(16px, 4vw, 48px) 80px; }
.page { max-width: 860px; margin: 0 auto; }

/* ---------- 4. 히어로 ---------- */
.hero {
  position: relative; overflow: hidden;
  background: linear-gradient(135deg, var(--surface-3), var(--surface-2));
  border: 1px solid var(--line); border-radius: 28px; padding: 28px 28px 24px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: center;
}
.hero-kicker { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: .82rem; letter-spacing: .08em; color: var(--primary-ink); }
.hero h1 { font-size: clamp(1.55rem, 3.6vw, 2.15rem); font-weight: 800; margin: 6px 0 8px; }
.hero p { margin: 0; color: var(--ink-soft); }
.hero-mung { width: 118px; height: 118px; flex: none; }
.hero-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 3px 12px; font-size: .8rem; color: var(--ink-soft); }
.chip.is-on { background: var(--ok-bg); border-color: transparent; color: var(--ok); font-weight: 700; }

.sec-nav {
  position: sticky; top: 0; z-index: 5; margin: 16px -6px 6px; padding: 8px 6px;
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  background: linear-gradient(var(--bg) 78%, transparent);
}
.sec-nav::-webkit-scrollbar { display: none; }
.sec-nav a {
  flex: none; text-decoration: none; font-size: .84rem; font-weight: 600; color: var(--ink-soft);
  background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 5px 13px;
}
.sec-nav a:hover { border-color: var(--primary); color: var(--ink); }

/* ---------- 5. 섹션 카드 ---------- */
.sec {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 26px clamp(16px, 3.4vw, 30px) 22px; margin-top: 20px; box-shadow: var(--shadow);
  scroll-margin-top: 64px;
}
.sec-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.sec-num {
  width: 44px; height: 44px; flex: none; display: grid; place-items: center; font-size: 1.3rem;
  border-radius: 14px; background: var(--surface-3);
}
.sec[data-sec="concept"] .sec-num { background: color-mix(in srgb, var(--lav) 30%, var(--surface)); }
.sec[data-sec="example"] .sec-num { background: color-mix(in srgb, var(--sky) 30%, var(--surface)); }
.sec[data-sec="studio"] .sec-num { background: color-mix(in srgb, var(--mint) 32%, var(--surface)); }
.sec[data-sec="quiz"] .sec-num { background: color-mix(in srgb, var(--sun) 38%, var(--surface)); }
.sec-step { font-size: .74rem; font-weight: 800; letter-spacing: .08em; color: var(--ink-faint); }
.sec-head h2 { font-size: 1.32rem; font-weight: 800; }
.sec h3 { font-size: 1.08rem; font-weight: 800; margin: 26px 0 10px; padding-left: 12px; border-left: 5px solid var(--primary); border-radius: 3px; }
.sec h3:first-child { margin-top: 4px; }
.sec h4 { font-size: .98rem; font-weight: 800; margin: 18px 0 6px; }
.sec ul, .sec ol { padding-left: 1.35em; margin: 0 0 1em; }
.sec li { margin: .28em 0; }
.sec li::marker { color: var(--primary-strong); font-weight: 700; }

/* 연결 카드: 최종 앱의 어느 부분인가 */
.link-app {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start;
  background: var(--surface-2); border-radius: 16px; padding: 14px 16px; margin: 14px 0 4px;
}
.link-app .ico { font-size: 1.5rem; line-height: 1.2; }
.link-app > div > b:first-child { display: block; font-family: var(--font-round); }

/* 콜아웃 */
.note { border-radius: 16px; padding: 13px 16px 13px 46px; margin: 14px 0; position: relative; background: var(--surface-2); font-size: .95rem; }
.note::before { content: "💡"; position: absolute; left: 14px; top: 11px; font-size: 1.15rem; }
.note > :last-child { margin-bottom: 0; }
.note.warn { background: color-mix(in srgb, var(--sun) 24%, var(--surface)); }
.note.warn::before { content: "⚠️"; }
.note.honest { background: color-mix(in srgb, var(--lav) 22%, var(--surface)); }
.note.honest::before { content: "🤝"; }
.note.analogy { background: color-mix(in srgb, var(--mint) 22%, var(--surface)); }
.note.analogy::before { content: "🧸"; }
.note.bug { background: var(--bad-bg); }
.note.bug::before { content: "🐞"; }
.note b:first-child { font-family: var(--font-round); }

/* 표 */
.table-wrap { overflow-x: auto; margin: 12px 0 16px; border: 1px solid var(--line); border-radius: 14px; }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--surface-2); font-family: var(--font-round); font-weight: 800; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.grade { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; white-space: nowrap; }
.grade::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--g-common); }
.grade.rare::before { background: var(--g-rare); }
.grade.epic::before { background: var(--g-epic); }
.grade.legend::before { background: var(--g-legend); }

/* 단계 목록 (안드로이드 스튜디오 사용법) */
ol.steps { list-style: none; counter-reset: step; padding: 0; margin: 10px 0 16px; }
ol.steps > li { counter-increment: step; position: relative; padding: 2px 0 12px 44px; margin: 0; }
ol.steps > li::before {
  content: counter(step); position: absolute; left: 0; top: 0; width: 30px; height: 30px;
  display: grid; place-items: center; border-radius: 50%; background: var(--mint); color: #114434;
  font-weight: 800; font-size: .86rem; font-family: var(--font-round);
}
ol.steps > li::after { content: ""; position: absolute; left: 14px; top: 34px; bottom: 2px; width: 2px; background: var(--line); }
ol.steps > li:last-child::after { display: none; }
.menu-path { font-weight: 700; color: var(--mint-ink); }

/* 접어두기 */
details { border: 1px solid var(--line); border-radius: 14px; margin: 10px 0; background: var(--surface); }
details > summary { list-style: none; cursor: pointer; padding: 11px 16px; font-weight: 700; font-family: var(--font-round); display: flex; align-items: center; gap: 10px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "▸"; color: var(--primary-strong); transition: transform .2s; }
details[open] > summary::before { transform: rotate(90deg); }
details > .details-body { padding: 2px 16px 14px; }
details.hint { background: color-mix(in srgb, var(--sun) 14%, var(--surface)); }
details.answer { background: color-mix(in srgb, var(--mint) 12%, var(--surface)); }
details.answer > summary::after { content: "먼저 스스로 풀어 본 뒤에 열어 보세요"; font-weight: 500; font-size: .78rem; color: var(--ink-faint); margin-left: auto; font-family: var(--font); }

/* ---------- 6. 코드 블록 ---------- */
.code-block { margin: 14px 0 18px; border-radius: 16px; overflow: hidden; background: var(--code-bg); border: 1px solid var(--code-line); }
.code-bar { display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 14px; background: var(--code-bar); color: #CDBFD6; font-size: .78rem; }
.code-dots { display: inline-flex; gap: 5px; }
.code-dots i { width: 9px; height: 9px; border-radius: 50%; background: #FF8FA3; }
.code-dots i:nth-child(2) { background: #FFD166; }
.code-dots i:nth-child(3) { background: #7FD8BE; }
.code-title { font-family: var(--font-mono); color: #F3ECF6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.code-lang { margin-left: auto; text-transform: uppercase; letter-spacing: .08em; font-size: .68rem; color: #A898B3; flex: none; }
.copy-btn { flex: none; border: 1px solid #5A4B68; background: #43364F; color: #F3ECF6; border-radius: 9px; padding: 3px 11px; font-size: .78rem; }
.copy-btn:hover { background: #55456A; }
.copy-btn.is-ok { background: var(--mint); border-color: var(--mint); color: #114434; font-weight: 700; }
.code-block pre { margin: 0; padding: 14px 0; overflow-x: auto; color: var(--code-ink); font-family: var(--font-mono); font-size: .84rem; line-height: 1.68; tab-size: 4; }
.code-block code { display: block; background: none; color: inherit; padding: 0; font-size: inherit; border-radius: 0; min-width: max-content; }
.code-block .ln { display: block; padding: 0 16px; min-height: 1.68em; }
.code-block .ln.hl { background: rgba(127, 216, 190, .16); box-shadow: inset 3px 0 0 var(--mint); }
.code-block.is-output { background: #201A27; }
.code-block.is-output pre { color: #D9F5E8; }
.tk-c { color: #9F90AC; font-style: italic; }
.tk-k { color: #FF9DB4; font-weight: 600; }
.tk-s { color: #BEE8A4; }
.tk-i { color: #FFD98A; }
.tk-n { color: #FFC978; }
.tk-t { color: #93D5FF; }
.tk-f { color: #CDBBFF; }
.tk-a { color: #FFD166; }
.tk-g { color: #FF9DB4; }
.tk-b { color: #93D5FF; }

/* ---------- 7. 퀴즈 ---------- */
.quiz-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.quiz-score { font-family: var(--font-round); font-weight: 800; font-size: 1.05rem; }
.quiz-score span { color: var(--primary-ink); font-variant-numeric: tabular-nums; }
.q { border: 1px solid var(--line); border-radius: 16px; padding: 16px 16px 12px; margin: 14px 0; background: var(--surface); }
.q-head { display: flex; gap: 10px; align-items: baseline; }
.q-no { flex: none; font-family: var(--font-round); font-weight: 800; color: var(--primary-ink); }

<section class="sec" data-sec="goal">
  <p>오늘은 코틀린이라는 언어의 <b>가장 기본이 되는 문장들</b>을 배웁니다. 안드로이드는 잠시 잊고, 브라우저에서 코드를 실행하며 문법에만 집중합니다.</p>
  <h3>오늘이 끝나면 할 수 있는 것</h3>
  <ul>
    <li><code>val</code>과 <code>var</code>로 값을 저장하고, <code>Int</code> · <code>Long</code> · <code>Boolean</code> · <code>String</code> 타입을 구분할 수 있다.</li>
    <li><code>if</code> / <code>when</code>으로 상황에 따라 다르게 동작하게 만들 수 있다.</li>
    <li><code>for</code> / <code>while</code>로 반복할 수 있다.</li>
    <li>재료(매개변수)를 받아 결과를 돌려주는 <b>함수</b>를 만들 수 있다.</li>
    <li>"값이 없을 수도 있음"을 뜻하는 <b>null</b>을 안전하게 다룰 수 있다.</li>
  </ul>
  <div class="link-app">
    <div class="ico">🔗</div>

<section class="sec" data-sec="concept">
  <h3>1. 프로그램은 <code>main</code>에서 시작한다</h3>
  <p>코틀린 프로그램은 <code>fun main()</code>이라는 함수의 중괄호 <code>{ }</code> 안을 위에서 아래로 한 줄씩 실행합니다. <code>println("글자")</code>는 화면에 한 줄을 출력하는 명령입니다.</p>

  <h3>2. 변수: <code>val</code>과 <code>var</code></h3>
  <div class="note analogy"><b>비유 — 이름표가 붙은 상자.</b> 변수는 값을 담아 두는 상자입니다. <code>val</code>은 값을 넣고 <b>뚜껑을 테이프로 붙여 버린 상자</b>(다시 못 바꿈), <code>var</code>는 <b>언제든 열어서 내용물을 바꿀 수 있는 상자</b>입니다.</div>
  <ul>
    <li><code>val goalMinutes = 30</code> → 목표 시간은 바뀌지 않으니 <code>val</code></li>
    <li><code>var studyMinutes = 0</code> → 공부 시간은 계속 늘어나니 <code>var</code></li>
  </ul>
  <p>코틀린의 습관: <b>일단 <code>val</code>로 쓰고, 바꿔야 할 때만 <code>var</code>로 고친다.</b> 바뀌지 않는 값이 많을수록 버그가 줄어듭니다.</p>

  <h3>3. 타입: 상자에 담을 수 있는 것의 종류</h3>
  <div class="table-wrap"><table>
    <tr><th>타입</th><th>담는 것</th><th>예</th><th>뭉타이머에서</th></tr>
    <tr><td><code>Int</code></td><td>정수 (약 ±21억)</td><td><code>30</code></td><td>공부한 분, 확률(%)</td></tr>
    <tr><td><code>Long</code></td><td>아주 큰 정수</td><td><code>1731200000000L</code></td><td>시각(밀리초), 공부한 초</td></tr>
    <tr><td><code>Double</code></td><td>소수</td><td><code>0.5</code></td><td>진행률</td></tr>
    <tr><td><code>Boolean</code></td><td>참/거짓</td><td><code>true</code></td><td>타이머가 실행 중인가</td></tr>
    <tr><td><code>String</code></td><td>글자들</td><td><code>"콩뭉"</code></td><td>뭉 이름, 닉네임</td></tr>
  </table></div>
  <p>타입은 <code>val name: String = "콩뭉"</code>처럼 적지만, 값을 보면 알 수 있을 때는 생략해도 코틀린이 알아서 정합니다(<b>타입 추론</b>). 한 번 정해진 타입은 바뀌지 않습니다. <code>Int</code> 상자에 글자를 넣으려 하면 실행하기도 전에 빨간 줄로 알려 줍니다.</p>
  <p><b>문자열 템플릿</b>: 문자열 안에 <code>$변수이름</code>을 쓰면 그 자리에 값이 들어갑니다. 계산식이나, 변수 바로 뒤에 한글이 붙는 경우에는 <code>${ }</code>로 감쌉니다. 예: <code>"${minutes}분"</code></p>

  <h3>4. 조건문: <code>if</code>와 <code>when</code></h3>
  <div class="note analogy"><b>비유 — 갈림길.</b> <code>if</code>는 "조건이 맞으면 왼쪽 길, 아니면 오른쪽 길"인 두 갈래 길입니다. <code>when</code>은 여러 방향이 적힌 <b>표지판</b>입니다. 위에서부터 읽다가 처음 맞는 방향 하나로만 갑니다.</div>
  <p>코틀린의 <code>if</code>와 <code>when</code>은 <b>값을 만들어 내는 식</b>이기도 합니다. 그래서 <code>val text = if (minutes &gt;= 30) "가능" else "불가능"</code>처럼 결과를 바로 변수에 담을 수 있습니다.</p>

  <h3>5. 반복문: <code>for</code>와 <code>while</code></h3>
  <ul>
    <li><code>for (i in 1..5)</code> : 1부터 5까지(5 포함) 차례로 반복. 횟수가 정해져 있을 때.</li>
    <li><code>0 until 3</code>은 0, 1, 2 (끝 숫자 제외), <code>10 downTo 0 step 5</code>는 10, 5, 0.</li>
    <li><code>while (조건)</code> : 조건이 참인 <b>동안</b> 계속 반복. 몇 번 돌지 모를 때.</li>
  </ul>
  <div class="note warn">조건이 영원히 참이면 프로그램이 끝나지 않습니다(무한 반복). <code>while</code> 안에서는 조건을 언젠가 거짓으로 만드는 코드가 꼭 있어야 합니다.</div>

  <h3>6. 함수: 이름 붙인 작은 기계</h3>
  <div class="note analogy"><b>비유 — 자판기.</b> 동전(매개변수)을 넣으면 음료(반환값)가 나옵니다. 안에서 무슨 일이 일어나는지 몰라도 이름만 알면 몇 번이든 쓸 수 있습니다.</div>
  <script type="text/plain" class="code" data-lang="kotlin" data-title="함수의 모양">
//  ①이름     ②재료(매개변수): 타입   ③결과 타입
fun toMinutes(seconds: Long):        Long {
    return seconds / 60               // ④ return 뒤의 값이 결과로 나간다
}
  </script>
  <ul>
    <li>한 줄로 끝나는 함수는 <code>fun canGetMung(minutes: Long): Boolean = minutes &gt;= 30</code>처럼 <code>=</code>로 줄여 씁니다.</li>
    <li>매개변수에 <b>기본값</b>을 줄 수 있습니다: <code>fun cheer(name: String = "뭉")</code></li>
    <li>부를 때 <code>cheer(times = 3)</code>처럼 <b>이름을 붙여</b> 넘길 수 있습니다. Day 3의 Compose 코드에서 매일 보게 됩니다.</li>
  </ul>

  <h3>7. null 안전성: "없을 수도 있음"을 타입으로 표시하기</h3>
  <p><code>null</code>은 "값이 없음"입니다. 값이 없는 것을 있는 것처럼 쓰면 앱이 갑자기 꺼집니다. 코틀린은 이것을 막으려고 <b>null이 될 수 있는 타입과 없는 타입을 구분</b>합니다.</p>
  <div class="note analogy"><b>비유 — "비어 있을 수 있음" 스티커.</b> <code>String</code> 상자에는 반드시 글자가 들어 있습니다. <code>String?</code>(물음표)는 "비어 있을 수 있음" 스티커가 붙은 상자입니다. 스티커가 붙은 상자는 <b>열어 보기 전에 확인</b>하지 않으면 코틀린이 사용을 허락하지 않습니다.</div>
  <div class="table-wrap"><table>
    <tr><th>도구</th><th>뜻</th><th>예</th></tr>
    <tr><td><code>?.</code> 안전 호출</td><td>null이 아니면 실행, null이면 그냥 null</td><td><code>mung?.length</code></td></tr>
    <tr><td><code>?:</code> 엘비스 연산자</td><td>null이면 오른쪽 값을 대신 사용</td><td><code>mung ?: "없음"</code></td></tr>
    <tr><td><code>if (x != null)</code></td><td>검사한 뒤에는 일반 타입처럼 사용</td><td><code>if (mung != null) mung.length</code></td></tr>
    <tr><td><code>!!</code></td><td>"절대 null 아님"이라고 우김. null이면 앱이 죽음</td><td>되도록 쓰지 않기</td></tr>
  </table></div>
</section>

  <h3>예제 2. 조건문 <code>if</code> / <code>when</code></h3>
  <script type="text/plain" class="code" data-lang="kotlin" data-title="Ex2.kt" data-run="d1_ex2">
fun main() {
    val studyMinutes = 75

    // if - else if - else : 위에서부터 검사해서 처음 맞는 곳 하나만 실행
    if (studyMinutes < 30) {
        println("아직 뭉이 나오지 않아요.")
    } else if (studyMinutes < 60) {
        println("뭉이 나올 수 있어요!")
    } else {
        println("오래 공부했네요. 좋은 뭉이 나올지도?")
    }

    // if는 값을 만들기도 한다 → 결과를 변수에 바로 담기
    val canGetMung = if (studyMinutes >= 30) "가능" else "불가능"
    println("뭉 뽑기: $canGetMung")

    // when { 조건 -> 값 } : 갈래가 많을 때 if보다 읽기 쉽다
    val bracket = when {
        studyMinutes < 30 -> "뽑기 불가"
        studyMinutes < 60 -> "30분 구간"
        studyMinutes < 120 -> "60분 구간"
        studyMinutes < 180 -> "120분 구간"
        else -> "180분 구간"              // 위에서 하나도 안 맞을 때
    }
    println("확률표 구간: $bracket")

    // when (값) { 후보 -> 결과 } : 값이 무엇과 같은지로 고르기
    val grade = "희귀"
    val stars = when (grade) {
        "일반" -> "★"
        "희귀" -> "★★"
        "영웅" -> "★★★"
        "전설" -> "★★★★"
        else -> "?"
    }
    println("$grade 등급 $stars")

    // 비교: == != < <= > >=   논리: &&(그리고) ||(또는) !(아니다)
    val isWeekend = false
    if (studyMinutes >= 60 && !isWeekend) {
        println("평일에 1시간 이상! 대단해요.")
    }
}
  </script>

  <h3>예제 3. 반복문 <code>for</code> / <code>while</code></h3>
  <script type="text/plain" class="code" data-lang="kotlin" data-title="Ex3.kt" data-run="d1_ex3">
fun main() {
    // 1..3 : 1부터 3까지 (3 포함)
    for (day in 1..3) {
        println("Day $day 공부 완료!")
    }

    // until : 끝 숫자는 포함하지 않는다 → 0, 1, 2
    for (index in 0 until 3) {
        println("인덱스 $index")
    }

    // downTo + step : 10부터 0까지 5씩 줄이기
    for (second in 10 downTo 0 step 5) {
        println("카운트다운 $second")
    }

    // 반복하며 값을 쌓기: 하루 40분씩 7일
    var totalMinutes = 0
    for (day in 1..7) {
        totalMinutes += 40
    }
    // 나누기(/)는 몫, 나머지(%)는 나눈 나머지
    println("일주일 합계: ${totalMinutes}분 = ${totalMinutes / 60}시간 ${totalMinutes % 60}분")

    // while : 조건이 참인 동안 계속
    var remaining = 30          // 뭉까지 남은 분
    var sessions = 0            // 공부한 횟수
    while (remaining > 0) {
        remaining -= 12         // 한 번에 12분씩 공부 → 언젠가 0 이하가 되어 반복이 끝난다
        sessions++              // 1 증가 (sessions = sessions + 1)
    }
    println("12분씩 ${sessions}번 공부하면 30분을 넘겨요.")
}

  <h3>예제 4. 함수</h3>
  <script type="text/plain" class="code" data-lang="kotlin" data-title="Ex4.kt" data-run="d1_ex4">
// fun 이름(재료: 타입): 결과타입 { ... }
fun toMinutes(seconds: Long): Long {
    return seconds / 60
}

// 한 줄짜리 함수는 = 로 줄여 쓴다 (단일 식 함수)
fun canGetMung(studyMinutes: Long): Boolean = studyMinutes >= 30

// 매개변수 기본값: 넘기지 않으면 name은 "뭉", times는 1
fun cheer(name: String = "뭉", times: Int = 1): String {
    return "$name 화이팅" + "!".repeat(times)    // "!"를 times번 이어 붙인다
}

// 돌려줄 값이 없는 함수는 결과 타입을 생략한다
fun printLine() {
    println("--------------------")
}

fun main() {
    val minutes = toMinutes(2700)               // 2700초 → 45분
    println("공부 시간: ${minutes}분")
    println("뭉 뽑기 가능? ${canGetMung(minutes)}")
    printLine()
    println(cheer())                            // 기본값 사용
    println(cheer("지우", 2))                   // 순서대로 전달
    println(cheer(times = 3))                   // 이름을 붙여 원하는 것만 전달
}
  </script>

  <h3>예제 5. null 안전성</h3>
  <script type="text/plain" class="code" data-lang="kotlin" data-title="Ex5.kt" data-run="d1_ex5">
// 30분 미만이면 뭉이 없다 → "없음"을 null로 표현하고, 결과 타입에 ? 를 붙인다
fun drawMungName(studyMinutes: Int): String? {
    if (studyMinutes < 30) return null
    return "콩뭉"
}

fun main() {
    val a: String = "콩뭉"
    // val wrong: String = null     // 컴파일 오류! String에는 null을 담을 수 없다
    val b: String? = null           // String? = "문자열 또는 null"
    println("$a / $b")

    val mung: String? = drawMungName(45)
    val nothing: String? = drawMungName(10)

    // ?. (안전 호출): null이 아니면 실행, null이면 그냥 null
    println(mung?.length)
    println(nothing?.length)

    // ?: (엘비스 연산자): 왼쪽이 null이면 오른쪽 값을 대신 사용
    println(mung ?: "뭉이 나오지 않았어요")
    println(nothing ?: "뭉이 나오지 않았어요")

    // null 검사를 통과한 중괄호 안에서는 일반 String처럼 쓸 수 있다 (스마트 캐스트)
    if (mung != null) {
        println("${mung}을 얻었어요! 이름은 ${mung.length}글자")
    }

    // !! : "절대 null 아님!" 이라고 우기기. 실제로 null이면 앱이 죽는다 → 되도록 쓰지 않는다
    // println(nothing!!.length)    // 주석을 풀고 실행하면 NullPointerException
}
  </script>
  <script type="text/plain" class="code" data-lang="output" data-for="d1_ex5">
콩뭉 / null
2
null
콩뭉
뭉이 나오지 않았어요
콩뭉을 얻었어요! 이름은 2글자
  </script>

<section class="sec" data-sec="task">
  <h3>과제: 타이머의 "두뇌" 만들기</h3>
  <p>타이머 화면에 필요한 계산을 순수 코틀린 함수로 먼저 만듭니다. Kotlin Playground에서 작성하고, 완성한 코드는 <b>메모장 등에 저장</b>해 두세요. Day 3에서 앱에 그대로 옮깁니다.</p>

  <h4>요구사항 체크리스트</h4>
  <ul class="checklist">
    <li><code>formatTime(totalSeconds: Long): String</code> — 초를 <code>"HH:MM:SS"</code> 형태로 바꾼다. 예: 75 → <code>"00:01:15"</code>, 3661 → <code>"01:01:01"</code></li>
    <li><code>canGetMung(studySeconds: Long): Boolean</code> — 30분(1800초) 이상이면 <code>true</code></li>
    <li><code>minutesUntilMung(studySeconds: Long): Long?</code> — 뭉까지 남은 분을 돌려준다. 이미 30분을 넘겼으면 <code>null</code>. 1초라도 남았으면 올림해서 1분</li>
    <li><code>resultMessage(studySeconds: Long): String</code> — 30분 이상이면 축하 메시지, 미만이면 "N분만 더 하면…" 안내 메시지</li>
    <li><code>main()</code>에서 <code>for</code>문으로 0분, 10분, 20분, 30분, 40분을 넣어 결과를 출력해 확인한다</li>
    <li>경계값 확인: 29분 59초는 "1분만 더", 30분 0초는 축하 메시지가 나온다</li>
  </ul>

  <details class="hint"><summary>힌트 1 — 시·분·초 나누기</summary>
    <p>1시간은 3600초입니다. <code>시 = 전체초 / 3600</code>, <code>분 = (전체초 % 3600) / 60</code>, <code>초 = 전체초 % 60</code>. 정수끼리 나누면 소수점 아래는 버려집니다.</p>
  </details>
  <details class="hint"><summary>힌트 2 — 7을 "07"로 만들기</summary>
    <p><code>7.toString().padStart(2, '0')</code>은 "글자 수가 2가 될 때까지 앞을 '0'으로 채워라"는 뜻입니다. 이 한 줄을 <code>twoDigits()</code>라는 작은 함수로 만들어 세 번 재사용해 보세요.</p>
  </details>
  <details class="hint"><summary>힌트 3 — 올림과 null 다루기</summary>
    <p>남은 초를 분으로 올림하려면 <code>(남은초 + 59) / 60</code>을 쓰면 됩니다. <code>resultMessage</code>에서는 <code>minutesUntilMung()</code>의 결과가 <code>null</code>인지 <code>if</code>로 검사해 두 메시지 중 하나를 고르세요.</p>
  </details>

  <details class="answer"><summary>모범 답안 보기</summary>
    <script type="text/plain" class="code" data-lang="kotlin" data-title="Day1Task.kt" data-run="d1_task">
// 뭉을 뽑을 수 있는 최소 공부 시간(초). const val = 프로그램 전체에서 쓰는 고정된 값(상수)
const val MIN_SECONDS_FOR_MUNG = 30 * 60L

// 한 자리 숫자 앞에 0을 붙여 두 자리로: 7 → "07"
fun twoDigits(number: Long): String = number.toString().padStart(2, '0')

// 초 → "HH:MM:SS"
fun formatTime(totalSeconds: Long): String {
    val hours = totalSeconds / 3600
    val minutes = (totalSeconds % 3600) / 60
    val seconds = totalSeconds % 60
    return "${twoDigits(hours)}:${twoDigits(minutes)}:${twoDigits(seconds)}"
}

// 30분 이상 공부했는가?
fun canGetMung(studySeconds: Long): Boolean = studySeconds >= MIN_SECONDS_FOR_MUNG

// 뭉까지 남은 시간(분). 이미 넘겼으면 null
fun minutesUntilMung(studySeconds: Long): Long? {
    if (canGetMung(studySeconds)) return null
    val remainingSeconds = MIN_SECONDS_FOR_MUNG - studySeconds
    return (remainingSeconds + 59) / 60          // 올림: 1초만 남아도 1분
}

// 종료했을 때 보여 줄 메시지
fun resultMessage(studySeconds: Long): String {
    val remaining = minutesUntilMung(studySeconds)
    return if (remaining == null) {
        "${formatTime(studySeconds)} 공부 완료! 뭉이 나와요 🎉"
    } else {
        "${formatTime(studySeconds)} 공부했어요. ${remaining}분만 더 하면 뭉을 만날 수 있어요!"
    }
}

fun main() {
    println(formatTime(0))
    println(formatTime(75))
    println(formatTime(3661))

    for (minutes in 0..40 step 10) {
        println(resultMessage(minutes * 60L))
    }

    println(resultMessage(29 * 60L + 59))        // 경계값: 29분 59초
}

<section class="sec" data-sec="concept">
  <h3>1. 클래스와 객체</h3>
  <div class="note analogy"><b>비유 — 붕어빵 틀과 붕어빵.</b> <code>class</code>는 <b>틀(설계도)</b>이고, 그 틀로 찍어 낸 실제 붕어빵 하나하나가 <b>객체</b>입니다. 틀은 하나지만 붕어빵은 몇 개든 만들 수 있고, 붕어빵마다 속(값)은 다를 수 있습니다.</div>
  <ul>
    <li><b>프로퍼티</b>: 객체가 가진 값. (타이머의 "지금까지 흐른 초")</li>

    <li><b>생성자</b>: 객체를 만들 때 받는 값. <code>class StudyTimer(val owner: String)</code>의 괄호 부분.</li>
  </ul>

  <h3>2. <code>data class</code>: 값을 담는 상자 전용 클래스</h3>
  <p>앱에서 만드는 클래스의 대부분은 "값 몇 개를 묶어 다니는 것"이 목적입니다. 앞에 <code>data</code>를 붙이면 코틀린이 유용한 기능을 자동으로 만들어 줍니다.</p>

  </table></div>

  <h3>3. <code>enum class</code>: 정해진 보기 중 하나</h3>
  <div class="note analogy"><b>비유 — 신호등.</b> 신호등 색은 빨강·노랑·초록 셋뿐입니다. "보라색"은 존재할 수 없습니다. 뭉 등급도 일반·희귀·영웅·전설 넷뿐입니다.</div>

  <h3>4. <code>object</code>: 딱 하나만 있는 객체</h3>
  <p>"전체 뭉 목록"은 앱에 하나만 있으면 됩니다. <code>object MungCatalog { … }</code>로 만들면 따로 생성하지 않고 <code>MungCatalog.all</code>처럼 이름으로 바로 씁니다.</p>

  <h3>5. 컬렉션: <code>List</code>와 <code>Map</code></h3>
  <div class="table-wrap"><table>

  <p><code>listOf</code> / <code>mapOf</code>는 <b>읽기 전용</b>입니다. 넣고 빼야 한다면 <code>mutableListOf</code> / <code>mutableMapOf</code>를 씁니다. <code>val</code>/<code>var</code>와 같은 습관: <b>일단 읽기 전용으로, 필요할 때만 mutable.</b></p>

  <div class="note analogy"><b>비유 — 심부름 쪽지.</b> 목록에게 "이 쪽지에 적힌 대로 골라 줘" 하고 건네는 쪽지가 람다입니다. <code>members.filter { it.todayMinutes &gt; 0 }</code>는 "멤버 한 명 한 명에게 '오늘 공부했나요?'를 물어서 '예'인 사람만 남겨 줘"라는 뜻입니다.</div>

// 등급은 딱 4가지. 각 등급이 자기만의 값(label, stars)을 가질 수 있다

fun cheerFor(grade: MungGrade): String = when (grade) {

    MungGrade.EPIC -> "대단해요, 영웅 뭉!"
    MungGrade.LEGENDARY -> "전설의 뭉이 나타났다!!"

  <h3>예제 3. 컬렉션 <code>List</code> / <code>Map</code></h3>
  <script type="text/plain" class="code" data-lang="kotlin" data-title="Ex3.kt" data-run="d2_ex3">
fun main() {
    // List: 순서가 있는 목록. listOf로 만들면 읽기 전용
    val week = listOf(40, 0, 95, 30, 120, 15, 60)       // 월~일 공부한 분
    println(week.size)                      // 개수
    println(week[0])                        // 0번째(첫 번째) 값
    println(week.last())                    // 마지막 값
    println(week.sum())                     // 합계
    println(week.max())                     // 가장 큰 값
    println(0 in week)                      // 0이 들어 있는가?

    // 위치(index)와 값을 함께 꺼내며 반복
    for ((index, minutes) in week.withIndex()) {
        if (minutes >= 60) println("${index}번째 날: ${minutes}분 👍")
    }

    // MutableList: 넣고 뺄 수 있는 목록
    val owned = mutableListOf("콩뭉")
    owned.add("딸기뭉")
    owned.add("콩뭉")                       // 같은 값이 또 들어가도 된다
    println(owned)
    owned.remove("콩뭉")                    // 처음 만나는 "콩뭉" 하나만 뺀다
    println(owned)

    // Map: 열쇠(key) → 값(value). "A to B"는 한 쌍을 만든다
    val rates = mapOf("일반" to 70, "희귀" to 25, "영웅" to 4, "전설" to 1)
    println(rates["희귀"])                  // 열쇠로 값 꺼내기
    println(rates["신화"])                  // 없는 열쇠 → null
    println(rates["신화"] ?: 0)             // 그래서 ?: 와 함께 쓴다
    for ((grade, percent) in rates) {
        println("$grade: $percent%")
    }
    println(rates.values.sum())             // 값만 모아서 합계

    // MutableMap: 뭉 이름별로 몇 마리인지 세기
    val counts = mutableMapOf<String, Int>()
    for (name in listOf("콩뭉", "딸기뭉", "콩뭉")) {
        counts[name] = (counts[name] ?: 0) + 1
    }
    println(counts)
}

data class Member(val name: String, val todayMinutes: Int, val mungCount: Int)

fun main() {
    val members = listOf(
        Member("지우", 190, 7),
        Member("민서", 45, 2),
        Member("하준", 0, 0),
        Member("서연", 125, 5),
    )

    // 람다: 이름 없는 작은 함수. { 재료 -> 결과 }  변수에 담아 둘 수도 있다

    println(isHardWorker(members[0]))

    // filter: 조건이 true인 것만 남긴다
    val studied = members.filter { member -> member.todayMinutes > 0 }
    println(studied.size)

    // 재료가 하나뿐이면 이름을 생략하고 it 이라고 부른다
    val hardWorkers = members.filter { it.todayMinutes >= 60 }

    // map: 하나하나를 다른 값으로 바꾼 새 목록
    println(hardWorkers.map { it.name })

    // sortedByDescending: 기준이 큰 것부터 정렬 → 랭킹
    val ranking = members.sortedByDescending { it.todayMinutes }
    for ((index, member) in ranking.withIndex()) {
        println("${index + 1}위 ${member.name} ${member.todayMinutes}분")
    }

    // 점(.)으로 이어 붙이면 위에서 아래로 차례차례 가공된다
    val topNames = members
        .filter { it.todayMinutes > 0 }             // 공부한 사람만
        .sortedByDescending { it.todayMinutes }     // 많이 한 순서로
        .take(2)                                    // 앞에서 2명
        .map { it.name }                            // 이름만
    println(topNames)

    println(members.sumOf { it.todayMinutes })              // 모두 더하기
    println(members.count { it.mungCount == 0 })            // 조건에 맞는 개수
    println(members.maxByOrNull { it.mungCount }?.name)     // 뭉이 가장 많은 사람
    println(members.firstOrNull { it.name == "없는사람" })  // 못 찾으면 null
    println(members.any { it.todayMinutes >= 180 })         // 한 명이라도 있는가
}
  </script>

  <h3>예제 5. <code>object</code>와 랜덤 (뭉 뽑기 미리보기)</h3>
  <script type="text/plain" class="code" data-lang="kotlin" data-title="Ex5.kt" data-run="d2_ex5">
import kotlin.random.Random

enum class Grade { COMMON, RARE }
data class Mung(val name: String, val grade: Grade)

// object: 프로그램에 딱 하나만 있는 객체. 만들지 않고 이름으로 바로 쓴다
object Catalog {
    val all = listOf(
        Mung("콩뭉", Grade.COMMON),
        Mung("구름뭉", Grade.COMMON),
        Mung("딸기뭉", Grade.RARE),
        Mung("달뭉", Grade.RARE),
    )

    fun byGrade(grade: Grade): List<Mung> = all.filter { it.grade == grade }
}

fun main() {
    println(Catalog.all.size)
    println(Catalog.byGrade(Grade.RARE).map { it.name })

    // groupBy: 기준별로 묶어서 Map<기준, 목록> 으로
    val grouped = Catalog.all.groupBy { it.grade }
    println(grouped[Grade.COMMON]?.size)

    // random(): 목록에서 아무거나 하나
    val picked = Catalog.byGrade(Grade.RARE).random()
    println("뽑힌 뭉: ${picked.name}")

    // Random.nextInt(100): 0 이상 100 미만의 정수 하나 → 확률 계산의 기본 (Day 5에서 사용)
    val roll = Random.nextInt(100)
    println(if (roll < 25) "25% 확률에 당첨!" else "다음 기회에…")
}
  </script>

다음 기회에…          ← (랜덤)
  </script>

<section class="sec" data-sec="task">
  <h3>과제: 뭉 데이터 모델 설계하기</h3>
  <p>앱에 들어갈 뭉의 등급, 뭉 한 마리의 정보, 전체 뭉 목록을 만듭니다. <b>MungTimer 프로젝트의 <code>model</code> 패키지에 파일 3개</b>를 만드세요. 로직 확인은 Kotlin Playground에서 합니다.</p>

  <h4>요구사항 체크리스트</h4>
  <ul class="checklist">
    <li><code>MungGrade.kt</code> — <code>enum class MungGrade</code>: <code>COMMON</code>(일반) · <code>RARE</code>(희귀) · <code>EPIC</code>(영웅) · <code>LEGENDARY</code>(전설). 각 등급은 <code>label: String</code>(한글 이름), <code>stars: Int</code>(별 개수), <code>colorHex: Long</code>(등급 색)을 가진다</li>
    <li><code>Mung.kt</code> — <code>data class Mung</code>: <code>id: Int</code>, <code>name: String</code>, <code>emoji: String</code>, <code>grade: MungGrade</code>, <code>description: String</code></li>
    <li><code>MungCatalog.kt</code> — <code>object MungCatalog</code>: 전체 뭉 목록 <code>all</code>을 가진다. 최소 12종 (일반 5, 희귀 4, 영웅 2, 전설 1), <code>id</code>는 서로 달라야 한다</li>
    <li><code>MungCatalog.byGrade(grade)</code> — 해당 등급의 뭉 목록을 돌려준다 (<code>filter</code>)</li>
    <li><code>MungCatalog.findById(id)</code> — id가 같은 뭉을 돌려주고, 없으면 <code>null</code> (<code>firstOrNull</code>)</li>
    <li><code>MungCatalog.randomOf(grade)</code> — 해당 등급에서 랜덤으로 한 마리 (<code>random()</code>)</li>
    <li>안드로이드 스튜디오에서 망치 🔨 로 빌드했을 때 <code>BUILD SUCCESSFUL</code>이 나온다</li>
  </ul>

  <details class="hint"><summary>힌트 1 — 값을 가진 enum</summary>
    <p>예제 2처럼 <code>enum class MungGrade(val label: String, val stars: Int, val colorHex: Long)</code>로 선언하고, 각 항목 뒤 괄호에 값을 적습니다. 색은 <code>0xFF8FA79B</code>처럼 16진수로 적습니다(맨 앞 <code>FF</code>는 불투명, 뒤 6자리가 색). 이 숫자는 Int 범위를 넘기 때문에 타입이 <code>Long</code>입니다.</p>

    <li>에뮬레이터나 실제 폰에서 앱을 실행할 수 있다.</li>

    <li><code>Column</code> · <code>Row</code> · <code>Box</code>와 <code>Modifier</code>로 원하는 배치를 만들 수 있다.</li>
    <li><code>remember</code>와 <code>mutableStateOf</code>로 "값이 바뀌면 화면도 바뀌게" 할 수 있다.</li>
    <li>Logcat에서 내가 남긴 로그를 찾아볼 수 있다.</li>
  </ul>
  <div class="link-app">
    <div class="ico">🔗</div>
    <div><b>최종 앱과의 연결</b>
    오늘 만드는 <code>TimerContent</code>는 최종 앱의 <b>타이머 화면 그 자체</b>입니다. Day 1의 <code>formatTime()</code>과 Day 2에서 배운 <code>enum</code>(타이머 상태)이 여기서 만납니다. 내일은 이 화면을 한 글자도 고치지 않고, 뒤에 진짜 타이머(ViewModel)만 연결합니다.</div>

<section class="sec" data-sec="concept">
  <h3>1. 안드로이드 프로젝트 둘러보기</h3>
  <p>마법사가 만들어 준 파일 중 지금 알아야 할 것은 다섯 개뿐입니다.</p>
  <div class="table-wrap"><table>
    <tr><th>파일</th><th>역할</th><th>비유</th></tr>
    <tr><td><code>MainActivity.kt</code></td><td>앱을 켜면 가장 먼저 실행되는 화면. <code>setContent { }</code> 안에 Compose 화면을 넣는다</td><td>그림을 거는 <b>액자</b></td></tr>
    <tr><td><code>ui/theme/</code> (Color, Theme, Type)</td><td>앱 전체의 색과 글꼴</td><td>인테리어 규칙</td></tr>
    <tr><td><code>AndroidManifest.xml</code></td><td>앱 이름, 아이콘, 화면 목록, 권한을 적은 신고서</td><td>앱의 주민등록등본</td></tr>
    <tr><td><code>build.gradle.kts</code> (Module :app)</td><td>앱 설정과, 가져다 쓸 라이브러리 목록</td><td>재료 주문서</td></tr>
    <tr><td><code>gradle/libs.versions.toml</code></td><td>라이브러리 버전 숫자를 모아 둔 표</td><td>재료 가격표</td></tr>
  </table></div>

  <h3>2. Compose는 "화면 = 함수(상태)"</h3>
  <div class="note analogy"><b>비유 — 엑셀 수식.</b> 엑셀에서 C1 칸에 <code>=A1+B1</code>을 적어 두면, A1이 바뀔 때 C1을 직접 고치지 않아도 알아서 바뀝니다. Compose도 같습니다. "경과 시간이 이 값이면 화면은 이렇게 생겼다"를 함수로 <b>선언</b>해 두면, 값(상태)이 바뀔 때 Compose가 알아서 화면을 다시 그립니다. "텍스트를 찾아서 글자를 바꿔라" 같은 명령은 쓰지 않습니다.</div>

  <h3>3. 컴포저블 함수</h3>
  <p><code>@Composable</code>이 붙은 함수가 화면의 조각입니다. 규칙은 세 가지입니다.</p>
  <ul>
    <li>이름은 <b>대문자</b>로 시작한다 (<code>TimerScreen</code>). 일반 함수와 구분하기 위한 약속입니다.</li>
    <li>값을 돌려주지 않는다. "그리는 것"이 일입니다.</li>
    <li>다른 <code>@Composable</code> 함수 안에서만 부를 수 있다. 작은 조각을 조립해 큰 화면을 만듭니다.</li>
  </ul>

  <h3>4. 배치 3총사: <code>Column</code> · <code>Row</code> · <code>Box</code></h3>
  <div class="cards">
    <div class="card"><div class="ico">⬇️</div><b>Column</b><p>안의 것들을 <b>세로</b>로 쌓는다. 타이머 화면 전체.</p></div>
    <div class="card"><div class="ico">➡️</div><b>Row</b><p>안의 것들을 <b>가로</b>로 나란히. 버튼 두 개.</p></div>
    <div class="card"><div class="ico">🥞</div><b>Box</b><p>안의 것들을 <b>겹쳐</b> 놓는다. 동그라미 위에 이모지.</p></div>
  </div>
  <p>정렬은 두 방향으로 나눠 지정합니다. <code>Column</code>이라면 쌓는 방향(세로)은 <code>verticalArrangement</code>, 그 반대 방향(가로)은 <code>horizontalAlignment</code>입니다.</p>

  <h3>5. <code>Modifier</code>: 크기 · 여백 · 배경 · 클릭</h3>
  <p>모든 컴포저블은 <code>modifier</code>를 받습니다. 점(.)으로 이어 붙이며, <b>적은 순서대로</b> 적용됩니다.</p>
  <script type="text/plain" class="code" data-lang="kotlin" data-title="Modifier는 순서가 중요하다">
Modifier
    .padding(16.dp)            // ① 바깥에 16dp 여백을 두고
    .background(Color.Yellow)  // ② 그 안쪽을 노랗게 칠한다  → 여백은 투명

Modifier
    .background(Color.Yellow)  // ① 먼저 전체를 노랗게 칠하고
    .padding(16.dp)            // ② 그 안에 16dp 여백을 둔다 → 여백도 노란색
  </script>
  <p>크기 단위는 <code>dp</code>(화면 밀도와 무관한 길이), 글자 크기는 <code>sp</code>(사용자의 글자 크기 설정을 따름)를 씁니다.</p>

  <h3>6. 상태(State)와 재구성(Recomposition)</h3>
  <p>화면에서 <b>바뀔 수 있는 값</b>을 상태라고 합니다. 일반 변수는 값이 바뀌어도 Compose가 모릅니다. Compose가 지켜보게 하려면 두 가지가 필요합니다.</p>
  <div class="table-wrap"><table>
    <tr><th>도구</th><th>하는 일</th></tr>
    <tr><td><code>mutableStateOf(값)</code></td><td>Compose가 <b>지켜보는 상자</b>를 만든다. 내용이 바뀌면 이 값을 읽는 컴포저블을 다시 그린다(재구성)</td></tr>
    <tr><td><code>remember { }</code></td><td>다시 그려질 때 상자를 새로 만들지 않고 <b>기억</b>해 둔다. 없으면 그릴 때마다 초기값으로 돌아간다</td></tr>
  </table></div>
  <p><code>var count by remember { mutableIntStateOf(0) }</code>처럼 <code>by</code>를 쓰면 <code>count</code>를 보통 변수처럼 읽고 쓸 수 있습니다.</p>
  <div class="note warn"><code>remember</code>는 화면을 <b>회전</b>하거나 앱이 종료되면 잊어버립니다. 그래서 타이머의 시간 같은 중요한 값은 내일 배우는 <b>ViewModel</b>에 둡니다.</div>

  <h3>7. 상태 끌어올리기 (State Hoisting)</h3>
  <div class="note analogy"><b>비유 — TV와 리모컨.</b> TV(화면)는 "지금 몇 번 채널인지"를 받아서 보여 주기만 하고, 버튼이 눌리면 "눌렸어요"라고 알리기만 합니다. 채널을 실제로 바꾸는 결정은 TV 밖에서 합니다.</div>
  <p>화면을 그리는 컴포저블은 <b>값을 매개변수로 받고</b>, 버튼이 눌리면 <b>람다(<code>onStart: () -&gt; Unit</code>)를 불러 알리기만</b> 하도록 만듭니다. 상태는 그 위(부모)에서 가집니다. 이렇게 만들면 ① Preview에서 원하는 값으로 쉽게 그려 볼 수 있고, ② 내일 ViewModel로 바꿀 때 화면 코드를 고칠 필요가 없습니다.</p>
</section>

  <h3>예제 2. 배치와 Modifier — 뭉 카드 만들기</h3>

package com.example.mungtimer.practice

@Composable
fun MungCard(mung: Mung, modifier: Modifier = Modifier) {
    Row(                                                    // 가로로 나란히: [동그라미] [글자들]
        modifier = modifier
            .fillMaxWidth()                                 // 가로를 꽉 채우고
            .clip(RoundedCornerShape(16.dp))                // 모서리를 둥글게 자른 다음
            .background(MaterialTheme.colorScheme.surfaceVariant)   // 배경을 칠하고
            .padding(16.dp),                                // 안쪽에 여백을 둔다 (순서 중요!)
        verticalAlignment = Alignment.CenterVertically,     // Row의 반대 방향(세로) 가운데 정렬
    ) {
        Box(                                                // 겹치기: 색 동그라미 위에 이모지
            modifier = Modifier
                .size(56.dp)
                .clip(CircleShape)
                .background(Color(mung.grade.colorHex)),    // Day 2에서 넣어 둔 등급 색
            contentAlignment = Alignment.Center,
        ) {
            Text(text = mung.emoji, fontSize = 28.sp)
        }
        Spacer(modifier = Modifier.width(12.dp))            // 빈 공간 12dp
        Column {                                            // 세로로 쌓기: 이름 / 설명
            Text(text = mung.name, fontWeight = FontWeight.Bold, fontSize = 18.sp)
            Text(
                text = "${mung.grade.label} · ${mung.description}",
                style = MaterialTheme.typography.bodyMedium,
            )
        }
    }
}

@Preview(showBackground = true)
@Composable
private fun MungCardPreview() {
    MungTimerTheme {
        Column(
            modifier = Modifier.padding(16.dp),
            verticalArrangement = Arrangement.spacedBy(8.dp),   // 자식들 사이를 8dp씩 띄우기
        ) {
            // 목록의 앞 3개를 꺼내 카드로 그린다. 컴포저블 안에서도 for문을 쓸 수 있다
            for (mung in MungCatalog.all.take(3)) {
                MungCard(mung = mung)
            }
            MungCard(mung = MungCatalog.all.last())             // 전설 등급
        }
    }
}

  <h3>예제 3. 상태 — 누르면 바뀌는 화면, 그리고 Logcat</h3>

package com.example.mungtimer.practice

import android.util.Log
import androidx.compose.foundation.layout.Arrangement
import androidx.compose.foundation.layout.Column
import androidx.compose.foundation.layout.Row
import androidx.compose.foundation.layout.padding
import androidx.compose.material3.Button
import androidx.compose.material3.OutlinedButton
import androidx.compose.material3.Text
import androidx.compose.runtime.Composable
import androidx.compose.runtime.getValue
import androidx.compose.runtime.mutableIntStateOf
import androidx.compose.runtime.remember
import androidx.compose.runtime.setValue
import androidx.compose.ui.Alignment
import androidx.compose.ui.Modifier

import androidx.compose.ui.unit.dp
import androidx.compose.ui.unit.sp
import com.example.mungtimer.ui.theme.MungTimerTheme

@Composable
fun StudyCounter(modifier: Modifier = Modifier) {
    // mutableIntStateOf(0): Compose가 지켜보는 Int 상자 (초기값 0)
    // remember { }       : 다시 그려져도 상자를 새로 만들지 않고 기억
    // by                 : minutes를 보통 변수처럼 읽고 쓰게 해 준다
    var minutes by remember { mutableIntStateOf(0) }

    Column(
        modifier = modifier.padding(24.dp),
        horizontalAlignment = Alignment.CenterHorizontally,
    ) {
        Text(text = "${minutes}분", fontSize = 48.sp)       // minutes가 바뀌면 이 Text가 다시 그려진다
        Text(text = if (minutes >= 30) "뭉이 나올 수 있어요! 🎉" else "30분까지 ${30 - minutes}분")

        Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
            Button(onClick = {                               // onClick: 눌렸을 때 실행할 람다
                minutes += 10                                // 상태를 바꾸기만 하면 화면은 알아서 바뀐다
                Log.d("MungTimer", "10분 추가 → 현재 ${minutes}분")   // Logcat에 기록 남기기
            }) {
                Text("+10분")                                // 버튼 안에 들어갈 내용도 컴포저블
            }
            OutlinedButton(onClick = { minutes = 0 }) {
                Text("초기화")
            }
        }
    }
}

@Preview(showBackground = true)
@Composable
private fun StudyCounterPreview() {
    MungTimerTheme { StudyCounter() }
}
  </script>
  <div class="note"><b>실험:</b> <code>remember { … }</code>를 지우고 <code>var minutes by mutableIntStateOf(0)</code>로 바꾸려 하면 안드로이드 스튜디오가 빨간 줄로 막습니다. 다시 그려질 때마다 0으로 돌아가 버리기 때문입니다. Preview 위의 <b>Interactive Mode</b>(손가락 아이콘)를 켜면 Preview 안에서 버튼을 눌러 볼 수 있습니다.</div>

  <h3>예제 4. 상태 끌어올리기 — 그리는 함수와 상태를 가진 함수 나누기</h3>
  <script type="text/plain" class="code" data-lang="kotlin" data-title="practice/Ex4Hoisting.kt" data-path="app/src/main/java/com/example/mungtimer/practice/Ex4Hoisting.kt">
package com.example.mungtimer.practice

import androidx.compose.foundation.layout.Column
import androidx.compose.foundation.layout.padding
import androidx.compose.material3.Button
import androidx.compose.material3.Text
import androidx.compose.runtime.Composable
import androidx.compose.runtime.getValue
import androidx.compose.runtime.mutableStateOf
import androidx.compose.runtime.remember
import androidx.compose.runtime.setValue
import androidx.compose.ui.Alignment
import androidx.compose.ui.Modifier
import androidx.compose.ui.tooling.preview.Preview
import androidx.compose.ui.unit.dp
import androidx.compose.ui.unit.sp
import com.example.mungtimer.ui.theme.MungTimerTheme

// ① 그리기만 하는 함수 (상태 없음): 값은 받고, 눌리면 알리기만 한다
@Composable
fun SleepyMung(
    isAwake: Boolean,                    // 그릴 값
    onToggle: () -> Unit,                // "눌렸어요"를 알릴 람다. () -> Unit = 재료도 결과도 없는 함수
    modifier: Modifier = Modifier,
) {
    Column(
        modifier = modifier.padding(24.dp),
        horizontalAlignment = Alignment.CenterHorizontally,
    ) {
        Text(text = if (isAwake) "🌱" else "😴", fontSize = 64.sp)
        Text(text = if (isAwake) "뭉이 깨어났어요" else "뭉이 자고 있어요")
        Button(onClick = onToggle) {     // 눌리면 받은 람다를 그대로 부른다
            Text(if (isAwake) "재우기" else "깨우기")
        }
    }
}

// ② 상태를 가진 함수: 상태를 만들고, ①에 값과 람다를 내려 준다
@Composable
fun SleepyMungScreen(modifier: Modifier = Modifier) {
    var isAwake by remember { mutableStateOf(false) }
    SleepyMung(
        isAwake = isAwake,
        onToggle = { isAwake = !isAwake },   // 상태를 바꾸는 결정은 여기서
        modifier = modifier,
    )
}

// ①은 상태가 없으므로, 원하는 값을 넣어 여러 모습을 한꺼번에 미리 볼 수 있다
@Preview(showBackground = true)
@Composable
private fun SleepyMungAwakePreview() {
    MungTimerTheme { SleepyMung(isAwake = true, onToggle = {}) }
}

@Preview(showBackground = true)
@Composable
private fun SleepyMungAsleepPreview() {
    MungTimerTheme { SleepyMung(isAwake = false, onToggle = {}) }
}
  </script>

  <h3>A. 에뮬레이터 만들고 앱 실행하기</h3>
  <ol class="steps">
    <li>오른쪽 도구 모음의 <b>Device Manager</b>(폰 모양 아이콘)를 엽니다. 안 보이면 <kbd>Shift</kbd> 두 번 → "Device Manager" 검색.</li>
    <li><b>+</b> 버튼 → <span class="menu-path">Create Virtual Device</span> → 목록에서 <b>Pixel</b> 시리즈 중 <b>Play Store 아이콘(▶)이 표시된 기기</b>를 고르고 <b>Next</b>. (Day 6의 Firebase는 Google Play 서비스가 있는 기기에서 동작합니다.)</li>
    <li>시스템 이미지는 추천으로 선택된 최신 버전을 그대로 두고(이름에 <b>Google Play</b>가 들어간 것) 필요하면 내려받은 뒤 <b>Finish</b>.</li>
    <li>위쪽 툴바의 기기 선택 칸에 방금 만든 기기가 보이면, 옆의 <b>Run ▶</b>(초록 삼각형)를 누릅니다. 단축키는 <kbd>Shift</kbd>+<kbd>F10</kbd> (macOS <kbd>Ctrl</kbd>+<kbd>R</kbd>).</li>
    <li>에뮬레이터가 켜지고 "Hello Android!"가 보이면 성공입니다. 첫 실행은 몇 분 걸릴 수 있습니다.</li>
  </ol>

  <h3>B. 실제 폰에서 실행하기 (권장)</h3>
  <ol class="steps">
    <li>폰에서 <span class="menu-path">설정 → 휴대전화 정보 → 소프트웨어 정보</span>의 <b>빌드번호를 7번</b> 연속으로 누릅니다. "개발자 모드가 켜졌습니다"가 뜹니다. (제조사마다 메뉴 이름이 조금 다릅니다.)</li>
    <li><span class="menu-path">설정 → 개발자 옵션 → USB 디버깅</span>을 켭니다.</li>
    <li>USB 케이블로 컴퓨터와 연결하고, 폰에 뜨는 "USB 디버깅을 허용하시겠습니까?"에서 <b>허용</b>.</li>
    <li>툴바의 기기 선택 칸에 내 폰 이름이 나타나면 <b>Run ▶</b>.</li>
  </ol>
  <div class="note warn"><b>폰이 목록에 안 보이면</b> — ① 충전 전용 케이블이 아닌지(데이터 케이블인지) ② 폰의 USB 연결 방식이 "파일 전송"인지 ③ Windows라면 제조사 USB 드라이버(삼성: Samsung USB Driver)가 설치됐는지 확인하세요.</div>

  <h3>C. Compose Preview 보기</h3>
  <ol class="steps">
    <li><code>@Preview</code>가 있는 파일을 열고, 편집기 오른쪽 위의 보기 전환 버튼에서 <b>Split</b>(코드와 미리보기를 나란히)을 고릅니다.</li>
    <li>미리보기가 "Out of date"라고 나오면 <b>Build &amp; Refresh</b>를 누르거나 <kbd>Ctrl</kbd>+<kbd>F9</kbd>로 빌드합니다.</li>
    <li>Preview 위에 마우스를 올리면 나오는 <b>Interactive Mode</b>를 켜면 클릭까지 시험할 수 있습니다. 끌 때는 같은 버튼을 다시 누릅니다.</li>
  </ol>
  <div class="note">Preview는 화면 <b>모양</b>을 빨리 확인하는 도구입니다. 실제 동작은 반드시 Run ▶으로 기기에서 확인하세요.</div>

  <h3>D. Logcat으로 로그 보기</h3>
  <p><code>println</code> 대신 안드로이드에서는 <code>Log.d("태그", "메시지")</code>로 기록을 남기고 <b>Logcat</b> 창에서 봅니다. 앱이 죽었을 때 이유가 적히는 곳도 Logcat입니다.</p>
  <ol class="steps">
    <li>아래쪽 도구 창에서 <b>Logcat</b>(고양이 아이콘)을 엽니다. 앱이 실행 중이어야 로그가 흐릅니다.</li>
    <li>위쪽 검색 칸에 <code>package:mine tag:MungTimer</code>를 입력합니다. "내 앱이 남긴 것 중 태그가 MungTimer인 것만" 보겠다는 뜻입니다.</li>
    <li>예제 3을 <code>MainActivity</code>에 잠깐 연결해(아래 과제 참고) 실행하고 <b>+10분</b>을 누르면 <code>10분 추가 → 현재 10분</code>이 찍힙니다.</li>
    <li>앱이 갑자기 꺼지면 검색 칸을 <code>package:mine level:error</code>로 바꾸세요. 빨간 글씨의 <b>첫 줄</b>(예: <code>NullPointerException</code>)과, 파란색 링크로 표시된 <b>내 파일 이름:줄 번호</b>가 원인입니다.</li>
  </ol>

  <div class="q" data-type="mc" data-answer="3">
    <p class="q-title"><code>mutableStateOf</code>로 만든 상태의 값이 바뀌면 일어나는 일은?</p>
    <ul class="q-options">
      <li>앱 전체가 다시 시작된다</li>
      <li>아무 일도 없고, 직접 화면을 고치는 코드를 써야 한다</li>
      <li>그 상태를 읽는 컴포저블이 자동으로 다시 실행되어 화면이 갱신된다 (재구성)</li>
      <li>Activity가 새로 만들어진다</li>
    </ul>
    <div class="q-explain"><p>이것을 <b>재구성(Recomposition)</b>이라고 합니다. Compose는 바뀐 상태를 읽는 부분만 골라서 다시 그립니다.</p></div>

package com.example.mungtimer.timer

// 타이머가 있을 수 있는 세 가지 상태
enum class TimerStatus {
    IDLE,       // 대기: 아직 시작 안 함
    RUNNING,    // 실행 중
    PAUSED,     // 일시정지

    <script type="text/plain" class="code" data-lang="kotlin" data-title="timer/TimeUtils.kt" data-path="app/src/main/java/com/example/mungtimer/timer/TimeUtils.kt">
package com.example.mungtimer.timer

// 뭉을 뽑을 수 있는 최소 공부 시간(초).
// 테스트할 때는 30 * 60L 을 10L 로 바꾸면 10초 만에 뭉 뽑기를 확인할 수 있다 (끝나면 꼭 되돌리기!)
const val MIN_SECONDS_FOR_MUNG = 30 * 60L

// 한 자리 숫자 앞에 0을 붙여 두 자리로: 7 → "07"
fun twoDigits(number: Long): String = number.toString().padStart(2, '0')

// 초 → "HH:MM:SS"
fun formatTime(totalSeconds: Long): String {
    val hours = totalSeconds / 3600
    val minutes = (totalSeconds % 3600) / 60
    val seconds = totalSeconds % 60
    return "${twoDigits(hours)}:${twoDigits(minutes)}:${twoDigits(seconds)}"
}

// 30분 이상 공부했는가?
fun canGetMung(studySeconds: Long): Boolean = studySeconds >= MIN_SECONDS_FOR_MUNG

// 뭉까지 남은 시간(분). 이미 넘겼으면 null
fun minutesUntilMung(studySeconds: Long): Long? {
    if (canGetMung(studySeconds)) return null
    val remainingSeconds = MIN_SECONDS_FOR_MUNG - studySeconds
    return (remainingSeconds + 59) / 60
}

// 종료했을 때 보여 줄 메시지 (내일 결과 창에서 사용)
fun resultMessage(studySeconds: Long): String {
    val remaining = minutesUntilMung(studySeconds)
    return if (remaining == null) {
        "${formatTime(studySeconds)} 공부 완료! 뭉이 나와요 🎉"
    } else {
        "${formatTime(studySeconds)} 공부했어요. ${remaining}분만 더 하면 뭉을 만날 수 있어요!"
    }
}

import androidx.compose.foundation.background

import androidx.compose.foundation.layout.fillMaxWidth

import com.example.mungtimer.ui.theme.MungTimerTheme

// 그리기만 하는 화면 (상태 없음): 값은 받고, 눌리면 알리기만 한다
@Composable
fun TimerContent(
    status: TimerStatus,
    elapsedSeconds: Long,
    onStart: () -> Unit,
    onPause: () -> Unit,
    onFinish: () -> Unit,
    modifier: Modifier = Modifier,
) {
    Column(
        modifier = modifier
            .fillMaxSize()
            .verticalScroll(rememberScrollState())  // 화면이 낮을 때(가로 모드, 작은 폰)는 스크롤해서 볼 수 있게
            .padding(24.dp),
        verticalArrangement = Arrangement.Center,
        horizontalAlignment = Alignment.CenterHorizontally,
    ) {
        // 뭉 얼굴: 동그란 배경 위에 이모지
        Box(
            modifier = Modifier
                .size(140.dp)
                .clip(CircleShape)
                .background(MaterialTheme.colorScheme.primaryContainer),
            contentAlignment = Alignment.Center,
        ) {
            Text(text = if (status == TimerStatus.RUNNING) "🌱" else "😴", fontSize = 64.sp)
        }
        Spacer(modifier = Modifier.height(24.dp))

        Text(text = statusMessage(status), style = MaterialTheme.typography.titleMedium)
        Spacer(modifier = Modifier.height(8.dp))

        // 큰 시간 표시. Monospace = 모든 숫자의 폭이 같아서 시간이 흘러도 글자가 흔들리지 않는다
        Text(
            text = formatTime(elapsedSeconds),
            fontSize = 56.sp,
            fontWeight = FontWeight.Bold,
            fontFamily = FontFamily.Monospace,
        )
        Spacer(modifier = Modifier.height(16.dp))

        MungProgress(elapsedSeconds = elapsedSeconds)
        Spacer(modifier = Modifier.height(32.dp))

        TimerButtons(status = status, onStart = onStart, onPause = onPause, onFinish = onFinish)
    }
}

// 상태에 맞는 한 줄 문구
fun statusMessage(status: TimerStatus): String = when (status) {
    TimerStatus.IDLE -> "뭉이 기다리고 있어요"
    TimerStatus.RUNNING -> "뭉과 함께 공부 중…"
    TimerStatus.PAUSED -> "잠깐 쉬는 중"
}

// 30분까지의 진행 막대 + 안내 문구
@Composable
fun MungProgress(elapsedSeconds: Long, modifier: Modifier = Modifier) {
    val remainingMinutes = minutesUntilMung(elapsedSeconds)
    val progress = (elapsedSeconds.toFloat() / MIN_SECONDS_FOR_MUNG).coerceIn(0f, 1f)

    Column(
        modifier = modifier.fillMaxWidth(),
        horizontalAlignment = Alignment.CenterHorizontally,
    ) {
        LinearProgressIndicator(
            progress = { progress },
            modifier = Modifier.fillMaxWidth(),
        )
        Spacer(modifier = Modifier.height(8.dp))
        Text(
            text = if (remainingMinutes == null) {
                "30분을 넘겼어요! 종료하면 뭉이 나와요 🎉"
            } else {
                "뭉까지 ${remainingMinutes}분 남았어요"
            },
            style = MaterialTheme.typography.bodyMedium,
        )
    }
}

// 상태에 따라 달라지는 버튼들
@Composable
fun TimerButtons(
    status: TimerStatus,
    onStart: () -> Unit,
    onPause: () -> Unit,
    onFinish: () -> Unit,
    modifier: Modifier = Modifier,
) {
    Row(
        modifier = modifier,
        horizontalArrangement = Arrangement.spacedBy(12.dp),
    ) {
        when (status) {
            TimerStatus.IDLE -> {
                Button(onClick = onStart) { Text("시작") }
            }
            TimerStatus.RUNNING -> {
                OutlinedButton(onClick = onPause) { Text("일시정지") }
                Button(onClick = onFinish) { Text("종료") }
            }
            TimerStatus.PAUSED -> {
                OutlinedButton(onClick = onStart) { Text("계속하기") }
                Button(onClick = onFinish) { Text("종료") }
            }
        }
    }
}

package com.example.mungtimer.timer

import androidx.compose.runtime.Composable
import androidx.compose.runtime.getValue
import androidx.compose.runtime.mutableLongStateOf
import androidx.compose.runtime.mutableStateOf

// 상태를 가진 화면 (Day 3 임시 버전: 내일 ViewModel로 교체)
@Composable
fun TimerScreen(modifier: Modifier = Modifier) {
    var status by remember { mutableStateOf(TimerStatus.IDLE) }
    var elapsedSeconds by remember { mutableLongStateOf(0L) }

    TimerContent(
        status = status,
        elapsedSeconds = elapsedSeconds,
        onStart = {
            status = TimerStatus.RUNNING
            elapsedSeconds += 600           // 임시: 누를 때마다 10분이 지난 것처럼
        },
        onPause = { status = TimerStatus.PAUSED },
        onFinish = {
            status = TimerStatus.IDLE
            elapsedSeconds = 0
        },
        modifier = modifier,
    )
}

    명세 1번 <b>"공부 타이머: 시작 / 일시정지 / 종료, 백그라운드에서도 시간 유지"</b>를 오늘 완성합니다. 오늘 만드는 <code>TimerViewModel</code>의 <code>finish()</code>는 내일 뭉 뽑기가 시작되는 지점이 됩니다.</div>
  </div>

<section class="sec" data-sec="concept">
  <h3>1. 왜 <code>remember</code>만으로는 안 될까</h3>
  <p>화면을 회전하면 안드로이드는 Activity를 <b>부수고 새로 만듭니다</b>. 그 안의 Compose 화면도, <code>remember</code>로 기억하던 값도 함께 사라집니다. 타이머 시간처럼 중요한 값은 화면보다 오래 사는 곳에 두어야 합니다. 그곳이 <b>ViewModel</b>입니다.</p>
  <div class="note analogy"><b>비유 — 식당의 홀과 주방.</b> 화면(Compose)은 손님이 보는 <b>홀</b>, ViewModel은 <b>주방</b>입니다. 홀 인테리어를 바꾸느라(화면 회전) 테이블을 전부 치웠다 다시 놓아도, 주방에서 끓이던 국은 그대로입니다. 홀은 주문(버튼 클릭)을 주방에 전달하고, 주방이 내놓은 음식(상태)을 그대로 보여 주기만 합니다.</div>

  <h3>2. 간단한 MVVM과 단방향 흐름</h3>
  <div class="table-wrap"><table>
    <tr><th>역할</th><th>뭉타이머에서</th><th>하는 일</th></tr>
    <tr><td><b>V</b>iew (화면)</td><td><code>TimerScreen</code>, <code>TimerContent</code></td><td>상태를 그린다. 눌리면 ViewModel의 함수를 부른다</td></tr>
    <tr><td><b>V</b>iew<b>M</b>odel</td><td><code>TimerViewModel</code></td><td>상태를 갖고, 바꾸는 규칙(시작/정지/종료)을 안다</td></tr>
    <tr><td><b>M</b>odel (데이터)</td><td><code>TimerUiState</code>, 내일의 Room, 모레의 Firebase</td><td>데이터 그 자체와 저장</td></tr>
  </table></div>
  <p>흐름은 항상 한 방향입니다. <b>이벤트는 위로</b>(화면 → <code>viewModel.start()</code>), <b>상태는 아래로</b>(ViewModel → <code>uiState</code> → 화면). 화면이 상태를 직접 고치는 일은 없습니다. 그래서 버그가 생기면 "상태를 바꾸는 곳"인 ViewModel만 보면 됩니다.</p>

  <h3>3. <code>StateFlow</code>: 항상 최신 값을 들고 있는 전광판</h3>
  <div class="note analogy"><b>비유 — 역의 전광판.</b> 전광판에는 항상 <b>최신 정보 하나</b>가 떠 있습니다. 늦게 온 사람도 보는 순간 지금 값을 알 수 있고, 내용이 바뀌면 보고 있던 모두가 바뀐 것을 봅니다.</div>
  <script type="text/plain" class="code" data-lang="kotlin" data-title="ViewModel의 정해진 모양">
// 쓰기용: ViewModel 안에서만 (private). 이름 앞에 밑줄을 붙이는 것이 관례
private val _uiState = MutableStateFlow(TimerUiState())

// 읽기용: 밖(화면)에 공개. 화면은 읽을 수만 있고 고칠 수 없다
val uiState: StateFlow<TimerUiState> = _uiState.asStateFlow()

// 값 바꾸기: 지금 값(it)의 복사본을 만들어 교체한다 (Day 2의 copy)
_uiState.update { it.copy(elapsedSeconds = 10) }
  </script>
  <p>화면에서는 <code>val uiState by viewModel.uiState.collectAsStateWithLifecycle()</code> 한 줄로 구독합니다. 전광판 내용이 바뀌면 Compose가 화면을 다시 그립니다.</p>

  <h3>4. 코루틴: 기다리는 동안 자리를 비켜 주는 일꾼</h3>
  <p>안드로이드 앱의 화면은 <b>메인 스레드</b> 하나가 그립니다. 여기서 "1초 기다려"를 평범하게 하면(<code>Thread.sleep</code>) 그 1초 동안 화면 전체가 얼어붙습니다. 코루틴의 <code>delay(1000)</code>은 다릅니다.</p>
  <div class="note analogy"><b>비유 — 진동벨.</b> 카페에서 주문하고 계산대 앞을 막고 서서 기다리는 것이 <code>Thread.sleep</code>, 진동벨을 받고 자리에 가 있다가 울리면 받으러 오는 것이 <code>delay</code>입니다. 기다리는 동안 계산대(메인 스레드)는 다른 손님(화면 그리기, 터치)을 받을 수 있습니다.</div>
  <div class="table-wrap"><table>
    <tr><th>용어</th><th>뜻</th></tr>
    <tr><td><code>suspend fun</code></td><td>"중간에 잠깐 멈췄다 이어서 할 수 있는 함수". <code>delay</code>, 내일의 DB 저장, 모레의 서버 요청이 모두 suspend 함수</td></tr>
    <tr><td><code>launch { }</code></td><td>코루틴 하나를 시작한다. suspend 함수는 코루틴 안에서만 부를 수 있다</td></tr>
    <tr><td><code>viewModelScope</code></td><td>ViewModel에 딸린 코루틴 놀이터. ViewModel이 사라지면 그 안의 코루틴도 <b>자동으로 취소</b>된다</td></tr>
    <tr><td><code>Job</code></td><td><code>launch</code>가 돌려주는 "리모컨". <code>job.cancel()</code>로 멈출 수 있다</td></tr>
  </table></div>

  <h3>5. 정확한 타이머의 비밀: 세지 말고, 시계를 봐라</h3>
  <p>가장 먼저 떠오르는 방법은 "1초마다 <code>seconds++</code>"입니다. 하지만 이 방식은 <b>틀립니다</b>.</p>
  <div class="table-wrap"><table>
    <tr><th></th><th>❌ 1초마다 숫자 세기</th><th>✅ 시작 시각 기록하기</th></tr>
    <tr><td>원리</td><td><code>delay(1000)</code> 후 <code>seconds++</code></td><td><code>지금 시각 − 시작 시각</code>을 계산</td></tr>
    <tr><td>앱이 백그라운드로 가면</td><td>코루틴이 늦게 돌거나 멈춰서 시간이 덜 세어진다</td><td>영향 없음. 돌아와서 시계를 다시 보면 된다</td></tr>
    <tr><td>앱이 종료되면</td><td>세던 숫자가 사라진다</td><td>시작 시각만 저장해 두면 다시 계산할 수 있다</td></tr>
    <tr><td>오차</td><td><code>delay</code>는 "최소 1초"라 조금씩 밀린다</td><td>누적 오차 없음</td></tr>
  </table></div>
  <div class="note analogy"><b>비유 — 마라톤 기록.</b> 심판은 42km 동안 "하나, 둘, 셋…" 세지 않습니다. 출발 시각을 적어 두고, 결승선에서 시계를 봅니다. 중간에 심판이 졸았어도 기록은 정확합니다.</div>
  <p>일시정지가 있으므로 값 두 개를 관리합니다.</p>
  <ul>
    <li><code>accumulated</code> : 이전 구간들에서 <b>쌓인 시간</b> (일시정지할 때 더해 둔다)</li>
    <li><code>startedAt</code> : 지금 구간을 <b>시작한 시각</b> (멈춰 있으면 0)</li>
    <li><b>경과 시간 = accumulated + (지금 시각 − startedAt)</b></li>
  </ul>
  <p>코루틴은 시간을 "세는" 일이 아니라, 0.5초마다 <b>시계를 다시 읽어 화면을 갱신</b>하는 일만 합니다. 코루틴이 잠깐 멈춰도 다음에 읽을 때 정확한 값이 나옵니다.</p>

  <h3>6. 앱이 꺼져도 이어지게: <code>SharedPreferences</code></h3>
  <p>ViewModel도 앱(프로세스)이 종료되면 사라집니다. 그래서 <code>status</code>, <code>startedAt</code>, <code>accumulated</code> 세 값을 기기에 저장합니다. 값 몇 개를 저장하는 데는 <code>SharedPreferences</code>(이름표가 붙은 작은 메모장)가 가장 간단합니다. 앱을 다시 켜면 ViewModel이 만들어질 때 이 값을 읽어 타이머를 이어 갑니다.</p>
  <div class="note honest"><b>솔직한 한계 두 가지.</b> ① 이 방식은 <b>시간은 정확히 유지</b>하지만, 앱 밖(알림창)에 타이머를 보여 주지는 않습니다. 그러려면 포그라운드 서비스가 필요하고 7일 범위를 넘습니다. ② 기기의 시계를 기준으로 하므로 사용자가 시계를 앞으로 돌리면 공부 시간이 늘어납니다. 친구끼리 쓰는 앱이라 허용했습니다. 참고로 구글은 새 프로젝트에 <code>DataStore</code>를 권장하지만, 값 3개를 저장하는 지금은 배울 것이 적은 <code>SharedPreferences</code>가 더 적합합니다(지원이 중단된 API가 아닙니다).</div>
</section>

<section class="sec" data-sec="example">
  <p>예제 1~3은 순수 코틀린이라 <a href="https://play.kotlinlang.org" target="_blank" rel="noopener">Kotlin Playground</a>에서 실행합니다(코루틴 라이브러리가 들어 있습니다). 예제 4는 안드로이드 스튜디오의 <code>practice</code> 패키지에 만듭니다.</p>

  <h3>예제 1. 코루틴 — <code>launch</code>와 <code>delay</code></h3>
  <script type="text/plain" class="code" data-lang="kotlin" data-title="Ex1.kt" data-run="d4_ex1">
import kotlinx.coroutines.delay
import kotlinx.coroutines.launch
import kotlinx.coroutines.runBlocking

// runBlocking: main에서 코루틴을 쓰기 위한 연습용 울타리 (안드로이드에서는 viewModelScope를 쓴다)
fun main() = runBlocking {
    // launch: 새 코루틴을 시작하고 "리모컨(Job)"을 돌려준다
    val ticker = launch {
        var count = 0
        while (true) {                 // 취소될 때까지 반복
            delay(1000)                // 1초 기다린다 (기다리는 동안 다른 코루틴이 일할 수 있다)
            count++
            println("째깍 $count")
        }
    }

    println("타이머를 시작했어요")     // launch 안의 코드보다 먼저 출력된다!
    delay(3500)                        // 3.5초 동안 ticker가 일하게 둔다
    ticker.cancel()                    // 리모컨으로 멈추기 (일시정지/종료 버튼의 원리)
    println("타이머를 멈췄어요")
}
  </script>
  <script type="text/plain" class="code" data-lang="output" data-for="d4_ex1">
타이머를 시작했어요
째깍 1
째깍 2
째깍 3
타이머를 멈췄어요
  </script>
  <div class="note"><code>while (true)</code>인데도 프로그램이 끝나는 이유: <code>delay</code>는 기다리는 도중 취소 신호를 받으면 그 자리에서 코루틴을 끝냅니다. 그래서 <code>ticker.cancel()</code> 한 줄로 반복이 멈춥니다.</div>

  <h3>예제 2. <code>StateFlow</code> — 값이 바뀌면 구독자에게 알려 준다</h3>
  <script type="text/plain" class="code" data-lang="kotlin" data-title="Ex2.kt" data-run="d4_ex2">
import kotlinx.coroutines.delay
import kotlinx.coroutines.flow.MutableStateFlow
import kotlinx.coroutines.flow.update
import kotlinx.coroutines.launch
import kotlinx.coroutines.runBlocking

data class CounterState(val count: Int = 0, val label: String = "대기")

fun main() = runBlocking {
    // 전광판 만들기: 처음 값은 CounterState()
    val state = MutableStateFlow(CounterState())

    // 구독자(화면 역할): 값이 바뀔 때마다 블록이 실행된다. 구독을 시작하는 순간의 값도 바로 받는다
    val screen = launch {
        state.collect { current -> println("화면 갱신: $current") }
    }

    delay(100)
    state.update { it.copy(count = it.count + 1, label = "실행 중") }   // 복사본으로 교체
    delay(100)
    state.update { it.copy(count = it.count + 1) }                      // label은 그대로 복사된다
    delay(100)
    state.update { it.copy(count = 2) }       // 값이 이전과 완전히 같으면 알리지 않는다 (출력 없음)
    delay(100)

    println("지금 값만 보기: ${state.value}")   // .value 로 현재 값을 바로 읽을 수도 있다
    screen.cancel()                             // collect는 끝나지 않으므로 직접 취소
}
  </script>
  <script type="text/plain" class="code" data-lang="output" data-for="d4_ex2">
화면 갱신: CounterState(count=0, label=대기)
화면 갱신: CounterState(count=1, label=실행 중)
화면 갱신: CounterState(count=2, label=실행 중)
지금 값만 보기: CounterState(count=2, label=실행 중)
  </script>

  <h3>예제 3. 시각 기록 방식 스톱워치 — 오늘 과제의 핵심 로직</h3>
  <script type="text/plain" class="code" data-lang="kotlin" data-title="Ex3.kt" data-run="d4_ex3">
// now: "지금 시각(밀리초)을 알려 주는 함수". 실제 앱에서는 System.currentTimeMillis()를 넣는다.
// 함수를 재료로 받으면, 테스트할 때 가짜 시계를 넣어 시간을 마음대로 흘려보낼 수 있다
class Stopwatch(private val now: () -> Long) {
    private var startedAt = 0L          // 지금 구간을 시작한 시각. 멈춰 있으면 0
    private var accumulated = 0L        // 이전 구간들에서 쌓인 시간(ms)

    fun start() {
        if (startedAt == 0L) startedAt = now()      // 시각을 "적어 두기만" 한다
    }

    fun pause() {
        if (startedAt == 0L) return
        accumulated += now() - startedAt            // 이번 구간의 길이를 쌓아 두고
        startedAt = 0L                              // 멈춤 표시
    }

    // 경과 시간 = 쌓인 시간 + (지금 − 시작 시각)
    fun elapsedSeconds(): Long {
        val runningPart = if (startedAt == 0L) 0L else now() - startedAt
        return (accumulated + runningPart) / 1000
    }
}

fun main() {
    var fakeClock = 1_000_000L                      // 가짜 시계
    val watch = Stopwatch(now = { fakeClock })

    watch.start()
    fakeClock += 10_000                             // 10초가 흐름
    println("10초 뒤: ${watch.elapsedSeconds()}초")

    watch.pause()
    fakeClock += 60_000                             // 일시정지한 채로 60초
    println("쉬는 동안: ${watch.elapsedSeconds()}초")   // 늘지 않는다

    watch.start()                                   // 계속하기
    fakeClock += 30 * 60_000                        // 앱이 30분 동안 꺼져 있었다고 상상해 보자.
                                                    // 그동안 아무 코드도 실행되지 않았지만…
    println("30분 뒤: ${watch.elapsedSeconds()}초")     // 시계만 다시 읽으면 정확하다
}
  </script>
  <script type="text/plain" class="code" data-lang="output" data-for="d4_ex3">
10초 뒤: 10초
쉬는 동안: 10초
30분 뒤: 1810초
  </script>

  <h3>예제 4. ViewModel + StateFlow + Compose 연결</h3>
  <p>이 예제부터는 아래 "안드로이드 스튜디오 사용법 A"의 <b>라이브러리 2줄 추가</b>를 먼저 해야 빨간 줄이 사라집니다.</p>
  <script type="text/plain" class="code" data-lang="kotlin" data-title="practice/Day4ViewModel.kt" data-path="app/src/main/java/com/example/mungtimer/practice/Day4ViewModel.kt">
package com.example.mungtimer.practice

import androidx.compose.foundation.layout.Column
import androidx.compose.foundation.layout.padding
import androidx.compose.material3.Button
import androidx.compose.material3.Text
import androidx.compose.runtime.Composable
import androidx.compose.runtime.getValue
import androidx.compose.ui.Alignment
import androidx.compose.ui.Modifier
import androidx.compose.ui.unit.dp
import androidx.compose.ui.unit.sp
import androidx.lifecycle.ViewModel
import androidx.lifecycle.compose.collectAsStateWithLifecycle
import androidx.lifecycle.viewModelScope
import androidx.lifecycle.viewmodel.compose.viewModel
import kotlinx.coroutines.Job
import kotlinx.coroutines.delay
import kotlinx.coroutines.flow.MutableStateFlow
import kotlinx.coroutines.flow.StateFlow
import kotlinx.coroutines.flow.asStateFlow
import kotlinx.coroutines.flow.update
import kotlinx.coroutines.launch

// ① 화면에 필요한 값을 data class 하나로 모은다
data class BlinkUiState(
    val isAwake: Boolean = false,
    val blinkCount: Int = 0,
)

// ② ViewModel: 상태를 갖고, 바꾸는 방법(함수)을 제공한다
class BlinkViewModel : ViewModel() {

    private val _uiState = MutableStateFlow(BlinkUiState())          // 쓰기용 (private)
    val uiState: StateFlow<BlinkUiState> = _uiState.asStateFlow()    // 읽기용 (공개)

    private var blinkJob: Job? = null                                 // 코루틴 리모컨. 아직 없으면 null

    fun toggle() {
        if (_uiState.value.isAwake) {
            blinkJob?.cancel()                                        // 자고 있으면 깜빡임 멈춤
            _uiState.update { it.copy(isAwake = false) }
        } else {
            _uiState.update { it.copy(isAwake = true) }
            // viewModelScope: ViewModel이 사라지면 이 코루틴도 자동으로 취소된다
            blinkJob = viewModelScope.launch {
                while (true) {
                    delay(1000)
                    _uiState.update { it.copy(blinkCount = it.blinkCount + 1) }
                }
            }
        }
    }
}

// ③ 화면: 상태를 구독해 그리고, 눌리면 ViewModel 함수를 부른다
@Composable
fun BlinkScreen(
    modifier: Modifier = Modifier,
    viewModel: BlinkViewModel = viewModel(),     // 없으면 만들고, 있으면(회전 후) 같은 것을 돌려준다
) {
    // StateFlow → Compose 상태로 변환. 값이 바뀌면 재구성된다
    val uiState by viewModel.uiState.collectAsStateWithLifecycle()

    Column(
        modifier = modifier.padding(24.dp),
        horizontalAlignment = Alignment.CenterHorizontally,
    ) {
        Text(text = if (uiState.isAwake) "🌱" else "😴", fontSize = 64.sp)
        Text(text = "눈을 ${uiState.blinkCount}번 깜빡였어요")
        Button(onClick = { viewModel.toggle() }) {
            Text(if (uiState.isAwake) "재우기" else "깨우기")
        }
    }
}
  </script>
  <div class="note"><b>확인해 보기:</b> <code>MainActivity</code>의 <code>TimerScreen(…)</code>을 잠깐 <code>BlinkScreen(modifier = Modifier.padding(innerPadding))</code>으로 바꿔 실행하고, 깨운 뒤 화면을 <b>회전</b>해 보세요. 숫자가 0으로 돌아가지 않고 계속 올라갑니다. 어제의 <code>remember</code> 버전과 다른 점입니다. 확인 후에는 다시 <code>TimerScreen</code>으로 되돌립니다.</div>
</section>

<section class="sec" data-sec="studio">
  <h3>A. Gradle에 라이브러리 추가하기</h3>
  <p>ViewModel을 Compose에서 쓰기 위한 라이브러리 2개를 추가합니다. 앞으로 Day 5, 6, 7에도 같은 방법으로 추가합니다.</p>
  <ol class="steps">
    <li>왼쪽 Project 창에서 <span class="menu-path">Gradle Scripts → build.gradle.kts (Module :app)</span>을 엽니다. (<code>(Project: MungTimer)</code>가 아니라 <b>Module :app</b>입니다.)</li>
    <li>파일 맨 아래 <code>dependencies { … }</code> 블록의 <b>닫는 중괄호 바로 위</b>에 아래 두 줄을 추가합니다. 마법사가 써 준 기존 줄은 건드리지 않습니다.
      <script type="text/plain" class="code" data-lang="kts" data-title="app/build.gradle.kts — dependencies 블록에 추가" data-hl="4-6">
dependencies {
    // … 마법사가 만든 기존 줄들은 그대로 둔다 …

    // Day 4: ViewModel을 Compose에서 쓰기
    implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0")   // viewModel()
    implementation("androidx.lifecycle:lifecycle-runtime-compose:2.11.0")     // collectAsStateWithLifecycle()
}
      </script>
    </li>
    <li>편집기 위쪽에 나타나는 파란 띠의 <b>Sync Now</b>를 누릅니다. (놓쳤다면 툴바의 코끼리 아이콘 🐘 또는 <span class="menu-path">File → Sync Project with Gradle Files</span>)</li>
    <li>아래 Build 창에 오류 없이 끝나면 완료입니다. 이제 <code>viewModel()</code>과 <code>collectAsStateWithLifecycle()</code>을 import할 수 있습니다.</li>
  </ol>
  <div class="note"><b>노란 밑줄이 생겨도 괜찮습니다.</b> 기존 줄들은 <code>implementation(libs.androidx.core.ktx)</code>처럼 생겼는데, 이것은 버전 숫자를 <code>gradle/libs.versions.toml</code> 파일에 모아 두는 "버전 카탈로그" 방식입니다. 우리가 추가한 줄처럼 좌표를 직접 적는 방식도 똑같이 동작하며, 안드로이드 스튜디오가 "카탈로그로 옮기면 어때요?"라고 노란 줄로 제안할 뿐입니다. 숫자에 노란 줄이 있으면 더 새 버전이 나왔다는 뜻이고, 그대로 두어도 됩니다.</div>

  <h3>B. 타이머가 정말 유지되는지 시험하는 3가지 방법</h3>
  <div class="table-wrap"><table>
    <tr><th>시험</th><th>방법</th><th>기대 결과</th></tr>
    <tr><td>① 화면 회전</td><td>에뮬레이터 창 옆 도구 모음의 회전 버튼 (실제 폰은 자동 회전을 켜고 돌리기)</td><td>시간이 0으로 돌아가지 않는다 (ViewModel 덕분)</td></tr>

  <p>값이 예상과 다를 때, 코드를 원하는 줄에서 <b>멈추고</b> 변수 값을 들여다볼 수 있습니다.</p>

<section class="sec" data-sec="quiz">
  <div class="q" data-type="mc" data-answer="3">
    <p class="q-title">화면을 회전했을 때 일어나는 일로 알맞은 것은?</p>
    <ul class="q-options">
      <li><code>remember</code>의 값과 ViewModel의 값 모두 유지된다</li>
      <li><code>remember</code>의 값과 ViewModel의 값 모두 사라진다</li>
      <li><code>remember</code>의 값은 사라지고, ViewModel의 값은 유지된다</li>
      <li><code>remember</code>의 값은 유지되고, ViewModel의 값은 사라진다</li>
    </ul>
    <div class="q-explain"><p>회전하면 Activity와 그 안의 Compose 화면은 새로 만들어지지만, ViewModel은 같은 것이 다시 연결됩니다. 그래서 중요한 상태는 ViewModel에 둡니다.</p></div>
  </div>

  <div class="q" data-type="fill" data-answer="MutableStateFlow">
    <p class="q-title">ViewModel 안에서 값을 바꿀 수 있는 "쓰기용" 상태를 만들려고 합니다. 빈칸은?</p>
    <script type="text/plain" class="code" data-lang="kotlin">
private val _uiState = ____(TimerUiState())
val uiState: StateFlow<TimerUiState> = _uiState.asStateFlow()
    </script>
    <div class="q-explain"><p><code>MutableStateFlow(초기값)</code>입니다. 밖에는 읽기 전용인 <code>StateFlow</code> 타입으로만 공개합니다.</p></div>
  </div>

  <div class="q" data-type="mc" data-answer="2">
    <p class="q-title"><code>_uiState</code>는 <code>private</code>으로 숨기고 <code>uiState</code>만 공개하는 이유는?</p>
    <ul class="q-options">
      <li>변수를 두 개 만들면 앱이 빨라져서</li>
      <li>화면이 상태를 직접 고치지 못하게 하고, 변경은 ViewModel의 함수로만 일어나게 하려고</li>
      <li>밑줄로 시작하는 이름은 Compose에서 읽을 수 없어서</li>
      <li>StateFlow는 반드시 두 개씩 만들어야 해서</li>
    </ul>
    <div class="q-explain"><p>"상태를 바꾸는 곳"을 한 군데(ViewModel)로 모으면 버그를 찾기 쉽습니다. 단방향 데이터 흐름의 핵심입니다.</p></div>
  </div>

  <div class="q" data-type="fill" data-answer="launch">
    <p class="q-title">ViewModel에서 코루틴을 시작하려고 합니다. 빈칸은?</p>
    <script type="text/plain" class="code" data-lang="kotlin">
tickJob = viewModelScope.____ {

        delay(500)
    }
}
    </script>
    <div class="q-explain"><p><code>launch</code>는 코루틴을 시작하고 <code>Job</code>을 돌려줍니다. 그 Job을 변수에 담아 두었다가 <code>cancel()</code>로 멈춥니다.</p></div>

  <div class="q" data-type="mc" data-answer="1">
    <p class="q-title">메인 스레드에서 <code>Thread.sleep(1000)</code> 대신 코루틴의 <code>delay(1000)</code>을 써야 하는 이유는?</p>
    <ul class="q-options">
      <li><code>delay</code>는 기다리는 동안 스레드를 붙잡지 않아서, 화면 그리기와 터치 처리가 멈추지 않는다</li>
      <li><code>delay</code>가 정확히 1000밀리초를 보장해서</li>
      <li><code>Thread.sleep</code>은 코틀린에서 쓸 수 없어서</li>
      <li><code>delay</code>는 배터리를 전혀 쓰지 않아서</li>
    </ul>
    <div class="q-explain"><p>진동벨 비유를 떠올리세요. <code>delay</code>는 "최소 그만큼" 기다릴 뿐 정확한 시간을 보장하지는 않습니다. 그래서 타이머를 <code>delay</code> 횟수로 세면 안 됩니다.</p></div>
  </div>

  <div class="q" data-type="mc" data-answer="3">
    <p class="q-title">일시정지 전까지 쌓인 시간이 10분, 다시 시작한 시각이 10:00:00, 지금이 10:05:00입니다. 중간에 앱이 3분간 종료돼 있었다면 화면에 표시될 경과 시간은?</p>
    <ul class="q-options">
