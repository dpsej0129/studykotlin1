<section class="sec" data-sec="task">
  <h3>과제: 뭉타이머 완성하기</h3>
  <p>네 가지를 합니다. <b>① Navigation 3로 교체 ② 테마 · 이름 · 아이콘 ③ 버그 3개 수정 ④ 최종 점검과 APK.</b></p>

  <h4>요구사항 체크리스트</h4>
  <ul class="checklist">
    <li>Navigation 3 라이브러리 2줄을 추가하고 Sync했다</li>
    <li><code>AppNavigation.kt</code> — <code>enum class Screen</code>(label, icon), 백 스택을 가진 <code>NavViewModel</code>(<code>selectTab</code>, <code>goBack</code>), <code>MungTimerApp()</code> 컴포저블(<code>Scaffold</code> + <code>NavigationBar</code> + <code>NavDisplay</code>)을 만들었다</li>
    <li><code>MainActivity</code>가 <code>MungTimerTheme { MungTimerApp() }</code>만 부른다</li>
    <li>도감/그룹에서 뒤로 가기 → 타이머, 타이머에서 뒤로 가기 → 앱이 닫힌다. 회전해도 보던 탭이 유지된다</li>
    <li>예제 3의 <code>Color.kt</code> · <code>Theme.kt</code>를 적용했고, 앱 이름을 "뭉타이머"로, 아이콘을 내 것으로 바꿨다</li>
    <li>버그 ① 실수로 [종료]를 눌러도 바로 끝나지 않게 <b>확인 창</b>을 띄운다. 30분 미만이면 "지금 종료하면 뭉이 나오지 않아요"라고 알려 준다</li>
    <li>버그 ② 타이머를 켜 둔 채 잊어도 한 번에 <b>최대 6시간</b>까지만 기록된다</li>
    <li>버그 ③ 인터넷이 안 될 때 그룹 화면이 끝없이 로딩되지 않고, <b>15초 뒤 안내 문구</b>가 나온다</li>
    <li><code>MIN_SECONDS_FOR_MUNG</code>이 <code>30 * 60L</code>인지 확인했다 (테스트용 값이 남아 있지 않다)</li>
    <li>아래 "최종 점검표"를 모두 통과했다</li>
    <li>debug APK를 만들어 다른 기기에 설치했다</li>
  </ul>

  <details class="hint"><summary>힌트 1 — NavViewModel</summary>
    <p><code>class NavViewModel : ViewModel() { val backStack = mutableStateListOf(Screen.TIMER) … }</code>. <code>selectTab</code>과 <code>goBack</code>은 예제 1의 함수와 거의 같습니다(문자열 대신 <code>Screen</code>). 저장소가 필요 없으니 <code>AndroidViewModel</code>이 아니라 그냥 <code>ViewModel</code>이면 됩니다.</p>
  </details>
  <details class="hint"><summary>힌트 2 — enum 키와 entryProvider</summary>
    <p>키가 enum이면 <code>entryProvider = { key -&gt; when (key) { Screen.TIMER -&gt; NavEntry(key) { TimerScreen() } … } }</code>처럼 <code>when</code>으로 씁니다. enum의 모든 값을 다루므로 <code>else</code>가 필요 없습니다. 탭 막대는 <code>for (screen in Screen.entries)</code>로 돌며 <code>NavigationBarItem</code>을 만들고, 선택 여부는 <code>backStack.last() == screen</code>.</p>
  </details>
  <details class="hint"><summary>힌트 3 — 종료 확인 창</summary>
    <p><code>TimerScreen</code>에 <code>var showConfirm by rememberSaveable { mutableStateOf(false) }</code>를 두고, <code>onFinish = { showConfirm = true }</code>로 바꿉니다. <code>if (showConfirm) AlertDialog(…)</code>에서 확인을 누르면 <code>showConfirm = false</code> 후 <code>viewModel.finish()</code>. <code>AlertDialog</code>의 <code>dismissButton</code>에 "계속 공부하기"를 넣습니다. 문구는 <code>minutesUntilMung(elapsedSeconds)</code>가 null인지로 나눕니다.</p>
  </details>
  <details class="hint"><summary>힌트 4 — 시간 제한 걸기</summary>
    <p><code>withTimeoutOrNull(15_000) { task() }</code>는 15초 안에 끝나면 결과(<code>Unit</code>)를, 못 끝나면 작업을 취소하고 <code>null</code>을 돌려줍니다. 뒤에 <code>?: error("…")</code>를 붙이면 시간 초과가 평범한 예외가 되어 기존 <code>catch</code>가 문구를 보여 줍니다.</p>
  </details>

  <details class="answer"><summary>모범 답안 보기</summary>
    <h4>① Navigation 3로 교체</h4>
    <script type="text/plain" class="code" data-lang="kotlin" data-title="AppNavigation.kt (새 파일, MainActivity.kt와 같은 패키지)" data-path="app/src/main/java/com/example/mungtimer/AppNavigation.kt">
package com.example.mungtimer

import androidx.compose.foundation.layout.fillMaxSize
import androidx.compose.foundation.layout.padding
import androidx.compose.material3.NavigationBar
import androidx.compose.material3.NavigationBarItem
import androidx.compose.material3.Scaffold
import androidx.compose.material3.Text
import androidx.compose.runtime.Composable
import androidx.compose.runtime.mutableStateListOf
import androidx.compose.ui.Modifier
import androidx.lifecycle.ViewModel
import androidx.lifecycle.viewmodel.compose.viewModel
import androidx.navigation3.runtime.NavEntry
import androidx.navigation3.ui.NavDisplay
import com.example.mungtimer.collection.CollectionScreen
import com.example.mungtimer.group.GroupScreen
import com.example.mungtimer.timer.TimerScreen

// 키: 앱의 화면 3개. 탭에 보여 줄 글자와 아이콘도 함께 가진다
enum class Screen(val label: String, val icon: String) {
    TIMER("타이머", "⏱️"),
    COLLECTION("도감", "📖"),
    GROUP("그룹", "👥"),
}

// 백 스택의 주인. ViewModel이라서 화면을 회전해도 보던 탭이 유지된다
class NavViewModel : ViewModel() {

    // 백 스택: 항상 [타이머] 또는 [타이머, 다른 탭]
    val backStack = mutableStateListOf(Screen.TIMER)

    // 하단 탭을 눌렀을 때
    fun selectTab(screen: Screen) {
        while (backStack.size > 1) backStack.removeLastOrNull()   // 타이머만 남기고 내린다
        if (screen != Screen.TIMER) backStack.add(screen)         // 고른 탭을 올린다
    }

    // 뒤로 가기
    fun goBack() {
        if (backStack.size > 1) backStack.removeLastOrNull()
    }
}

// 앱 전체의 틀: 아래에 탭 막대, 그 위에 지금 화면
@Composable
fun MungTimerApp(navViewModel: NavViewModel = viewModel()) {
    val backStack = navViewModel.backStack
    val currentScreen = backStack.last()            // 맨 위 = 지금 보이는 화면

    Scaffold(
        modifier = Modifier.fillMaxSize(),
        bottomBar = {
            NavigationBar {
                // enum의 모든 값을 돌며 탭을 만든다. 화면이 늘어나도 이 코드는 그대로
                for (screen in Screen.entries) {
                    NavigationBarItem(
                        selected = currentScreen == screen,
                        onClick = { navViewModel.selectTab(screen) },
                        icon = { Text(screen.icon) },
                        label = { Text(screen.label) },
                    )
                }
            }
        },
    ) { innerPadding ->
        // NavDisplay: 백 스택의 맨 위 키에 해당하는 화면을 보여 준다
        NavDisplay(
            backStack = backStack,
            onBack = { navViewModel.goBack() },     // 폰의 뒤로 가기 버튼/제스처
            modifier = Modifier.padding(innerPadding),
            entryProvider = { key ->
                when (key) {
                    Screen.TIMER -> NavEntry(key) { TimerScreen() }
                    Screen.COLLECTION -> NavEntry(key) { CollectionScreen() }
                    Screen.GROUP -> NavEntry(key) { GroupScreen() }
                }
            },
        )
    }
}
    </script>

    <script type="text/plain" class="code" data-lang="kotlin" data-title="timer/TimerScreen.kt (최종 버전 — 파일 전체 교체)" data-path="app/src/main/java/com/example/mungtimer/timer/TimerScreen.kt" data-hl="19-21,40-41,48,52-61,69-93">

import androidx.compose.foundation.background

@Composable
fun TimerScreen(
    modifier: Modifier = Modifier,
    viewModel: TimerViewModel = viewModel(),
) {
    val uiState by viewModel.uiState.collectAsStateWithLifecycle()

    // "정말 종료할까요?" 창이 떠 있는가. 화면 안에서만 쓰는 값이라 여기에 둔다
    var showConfirm by rememberSaveable { mutableStateOf(false) }

    TimerContent(
        status = uiState.status,
        elapsedSeconds = uiState.elapsedSeconds,
        onStart = { viewModel.start() },
        onPause = { viewModel.pause() },
        onFinish = { showConfirm = true },          // 바로 끝내지 않고 먼저 물어본다
        modifier = modifier,
    )

    if (showConfirm) {
        ConfirmFinishDialog(
            elapsedSeconds = uiState.elapsedSeconds,
            onConfirm = {
                showConfirm = false
                viewModel.finish()
            },
            onDismiss = { showConfirm = false },
        )
    }

    val result = uiState.result
    if (result != null) {
        ResultDialog(result = result, onDismiss = { viewModel.dismissResult() })
    }
}

// 종료 확인 창: 30분이 안 됐으면 뭉이 나오지 않는다는 것을 미리 알려 준다
@Composable
fun ConfirmFinishDialog(elapsedSeconds: Long, onConfirm: () -> Unit, onDismiss: () -> Unit) {
    val remainingMinutes = minutesUntilMung(elapsedSeconds)

    AlertDialog(
        onDismissRequest = onDismiss,
        title = { Text("공부를 끝낼까요?") },
        text = {
            Text(
                if (remainingMinutes == null) {

    var re = /(\/\/[^\n]*)|(\/\*[\s\S]*?\*\/)|("""[\s\S]*?""")|("(?:\\.|[^"\\\n])*")|('(?:\\.|[^'\\\n])+')|(@[A-Za-z_][\w]*)|(\b0[xX][0-9a-fA-F_]+[uUL]*\b|\b\d[\d_]*(?:\.\d[\d_]*)?(?:[eE][+-]?\d+)?[fFuUL]*\b)|([A-Za-z_][A-Za-z0-9_]*)/g;
    var out = '', last = 0, match, prevWord = '';
    while ((match = re.exec(src))) {
      out += esc(src.slice(last, match.index));
      var text = match[0];
      if (match[1] || match[2]) out += tok('c', text);
      else if (match[3] || match[4]) out += highlightString(text);
      else if (match[5]) out += tok('s', text);
      else if (match[6]) out += tok('a', text);
      else if (match[7]) out += tok('n', text);
      else {
        if (KOTLIN_KEYWORDS[text] === true) out += tok('k', text);
        else if (/^[A-Z]/.test(text)) out += tok('t', text);
        else if (prevWord === 'fun' || src.charAt(re.lastIndex) === '(') out += tok('f', text);
        else out += esc(text);
        prevWord = text;
      }
      last = re.lastIndex;
    }
    return out + esc(src.slice(last));
  }

  function highlightXml(src) {
    var re = /(<!--[\s\S]*?-->)|(<\?xml|\?>|<\/?[\w:.\-]+|\/?>)|("[^"]*")|([\w:.\-]+)(?==)/g;
    var out = '', last = 0, match;
    while ((match = re.exec(src))) {
      out += esc(src.slice(last, match.index));
      if (match[1]) out += tok('c', match[0]);
      else if (match[2]) out += tok('g', match[0]);
      else if (match[3]) out += tok('s', match[0]);
      else out += tok('b', match[0]);
      last = re.lastIndex;
    }
    return out + esc(src.slice(last));
  }

  /* TOML · properties · 셸 명령처럼 '#' 주석을 쓰는 설정 파일 */
  function highlightConf(src) {
    var re = /(#[^\n]*)|("(?:\\.|[^"\\\n])*")|(^[ \t]*\[[^\]\n]+\])|(^[ \t]*[\w.\-]+)(?=[ \t]*=)/gm;
    var out = '', last = 0, match;
    while ((match = re.exec(src))) {
      out += esc(src.slice(last, match.index));
      if (match[1]) out += tok('c', match[0]);
      else if (match[2]) out += tok('s', match[0]);
      else if (match[3]) out += tok('k', match[0]);
      else out += tok('b', match[0]);
      last = re.lastIndex;
    }
    return out + esc(src.slice(last));
  }

  /* Firestore 보안 규칙 · JSON */
  var RULES_KEYWORDS = {};
  ('service match allow if function return let true false null read write get list create update delete ' +
   'rules_version in is').split(' ').forEach(function (word) { RULES_KEYWORDS[word] = true; });

  function highlightRules(src) {
    var re = /(\/\/[^\n]*)|(\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)/g;
    var out = '', last = 0, match;
    while ((match = re.exec(src))) {
      out += esc(src.slice(last, match.index));
      var text = match[0];
      if (match[1] || match[2]) out += tok('c', text);
      else if (match[3]) out += tok('s', text);
      else if (match[4]) out += tok('n', text);
      else if (RULES_KEYWORDS[text] === true) out += tok('k', text);
      else if (src.charAt(re.lastIndex) === '(') out += tok('f', text);
      else out += esc(text);
      last = re.lastIndex;
    }
    return out + esc(src.slice(last));
  }

  var LANG_LABEL = { kotlin: 'Kotlin', kts: 'Gradle (Kotlin)', xml: 'XML', toml: 'TOML', conf: '설정', rules: 'Firestore Rules', json: 'JSON', shell: '터미널', text: '', output: '실행 결과' };

  function highlight(src, lang) {
    if (lang === 'kotlin' || lang === 'kts') return highlightKotlin(src);
    if (lang === 'xml') return highlightXml(src);
    if (lang === 'toml' || lang === 'conf' || lang === 'shell') return highlightConf(src);
    if (lang === 'rules' || lang === 'json') return highlightRules(src);
    return esc(src);
  }

  /* "3,5-7" → {3:true,5:true,6:true,7:true} */
  function parseLineSet(spec) {
    var set = {};
    if (!spec) return set;
    spec.split(',').forEach(function (part) {
      var range = part.trim().split('-');
      var from = parseInt(range[0], 10), to = parseInt(range[range.length - 1], 10);
      if (isNaN(from) || isNaN(to)) return;
      for (var n = from; n <= to; n++) set[n] = true;
    });
    return set;
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    /* file:// 로 열었거나 오래된 브라우저 → 임시 textarea로 복사 */
    return new Promise(function (resolve, reject) {
      var area = document.createElement('textarea');
      area.value = text;
      area.setAttribute('readonly', '');
      area.style.position = 'fixed';
      area.style.top = '-1000px';
      document.body.appendChild(area);
      area.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(area);
      if (ok) resolve(); else reject(new Error('copy failed'));
    });
  }

  function buildCodeBlock(source) {
    var lang = source.getAttribute('data-lang') || 'kotlin';
    var title = source.getAttribute('data-title') || '';
    var raw = source.textContent.replace(/^\n/, '').replace(/\s+$/, '');
    var marked = parseLineSet(source.getAttribute('data-hl'));

    var figure = el('figure', 'code-block' + (lang === 'output' ? ' is-output' : ''));
    var bar = el('figcaption', 'code-bar');
    bar.appendChild(el('span', 'code-dots', '<i></i><i></i><i></i>'));
    var titleNode = el('span', 'code-title');
    titleNode.textContent = title || (lang === 'output' ? '실행 결과' : '');
    bar.appendChild(titleNode);
    var langNode = el('span', 'code-lang');
    langNode.textContent = title && LANG_LABEL[lang] !== undefined ? LANG_LABEL[lang] : (lang === 'output' ? '' : (LANG_LABEL[lang] || lang));
    bar.appendChild(langNode);
    var button = el('button', 'copy-btn');
    button.type = 'button';
    button.textContent = '복사';
    button.setAttribute('aria-label', '코드 복사');
    button.addEventListener('click', function () {
      copyText(raw).then(function () {
        button.textContent = '복사됨!';
        button.classList.add('is-ok');
        setTimeout(function () { button.textContent = '복사'; button.classList.remove('is-ok'); }, 1500);
      }).catch(function () {
        toast('복사하지 못했어요. 직접 드래그해서 복사해 주세요.');
      });
    });
    bar.appendChild(button);
    figure.appendChild(bar);

    var lines = highlight(raw, lang).split('\n').map(function (line, index) {
      return '<span class="ln' + (marked[index + 1] ? ' hl' : '') + '">' + (line || ' ') + '</span>';
    });
    var pre = el('pre');
    pre.setAttribute('tabindex', '0');
    pre.appendChild(el('code', '', lines.join('')));
    figure.appendChild(pre);
    return figure;
  }

  function renderCodeBlocks(root) {
    $all('script.code', root).forEach(function (source) {
      source.parentNode.replaceChild(buildCodeBlock(source), source);
    });
  }

  /* ------------------------------------------------------------------
   * 5. 퀴즈
   * ------------------------------------------------------------------ */
  function quizCount(pageId) {
    var template = templateOf(pageId);
    return template ? template.content.querySelectorAll('.q').length : 0;
  }
  function quizScore(pageId) {
    var answers = state.quiz[pageId] || {}, score = 0;
    Object.keys(answers).forEach(function (key) { if (answers[key] && answers[key].ok) score++; });
    return score;
  }
  function normalizeAnswer(text) {
    return String(text).replace(/\s+/g, ' ').trim();
  }

  function renderQuiz(root, pageId) {
    var section = $('.sec[data-sec="quiz"]', root);
    if (!section) return;
    var questions = $all('.q', section);
    if (!questions.length) return;

    var top = el('div', 'quiz-top');
    var scoreNode = el('div', 'quiz-score');
    var resetButton = el('button', 'ghost-btn');
    resetButton.type = 'button';
    resetButton.textContent = '↺ 퀴즈 다시 풀기';
    top.appendChild(scoreNode);
    top.appendChild(resetButton);
    questions[0].parentNode.insertBefore(top, questions[0]);

    function updateScore() {
      var answered = Object.keys(state.quiz[pageId] || {}).length;
      scoreNode.innerHTML = '점수 <span>' + quizScore(pageId) + ' / ' + questions.length + '</span>' +
        (answered === questions.length ? ' · 모두 풀었어요 🎉' : '');
      renderNav();
    }

    resetButton.addEventListener('click', function () {
      delete state.quiz[pageId];
      saveState();
      showPage(pageId, 'quiz');
    });

    questions.forEach(function (question, index) {
      var type = question.getAttribute('data-type') || 'mc';
      var answerSpec = question.getAttribute('data-answer') || '';
      var titleNode = $('.q-title', question);
      var explainNode = $('.q-explain', question);

      var head = el('div', 'q-head');
      head.appendChild(el('span', 'q-no', 'Q' + (index + 1)));
      head.appendChild(el('span', 'q-type', type === 'fill' ? '빈칸 채우기' : '객관식'));
      question.insertBefore(head, question.firstChild);

      var result = el('div', 'q-result');
      result.setAttribute('role', 'status');
      var verdict = el('b', 'verdict');
      result.appendChild(verdict);
      if (explainNode) result.appendChild(explainNode);
      question.appendChild(result);

      function record(ok, pick) {
        if (!state.quiz[pageId]) state.quiz[pageId] = {};
        state.quiz[pageId][index] = { ok: ok, pick: pick };
        saveState();
        updateScore();
      }

      if (type === 'fill') {
        var accepted = answerSpec.split('||').map(normalizeAnswer);
        var form = el('form', 'q-fill');
        var input = el('input');
        input.type = 'text';
        input.setAttribute('autocomplete', 'off');
        input.setAttribute('autocapitalize', 'off');
        input.setAttribute('spellcheck', 'false');
        input.placeholder = '빈칸에 들어갈 코드를 입력';
        input.setAttribute('aria-label', titleNode ? titleNode.textContent : '빈칸 답 입력');
        var submit = el('button', 'btn');
        submit.type = 'submit';
        submit.textContent = '확인';
        form.appendChild(input);
        form.appendChild(submit);
        question.insertBefore(form, result);

        var showFill = function (ok, value) {
          input.value = value;
          input.disabled = true;
          submit.disabled = true;
          input.classList.add(ok ? 'is-correct' : 'is-wrong');
          verdict.textContent = ok ? '정답이에요! 🎉' : '아쉬워요 😢  정답: ' + accepted[0];
          result.className = 'q-result show ' + (ok ? 'ok' : 'bad');
        };
        form.addEventListener('submit', function (event) {
          event.preventDefault();
          var value = normalizeAnswer(input.value);
          if (!value) { input.focus(); return; }
          var ok = accepted.indexOf(value) !== -1;
          showFill(ok, value);
          record(ok, value);
        });
        var savedFill = state.quiz[pageId] && state.quiz[pageId][index];
        if (savedFill) showFill(savedFill.ok, savedFill.pick);
      } else {
        var correctIndex = parseInt(answerSpec, 10) - 1;
        var list = $('.q-options', question);
        var buttons = $all('li', list).map(function (item, optionIndex) {
          var button = el('button', 'q-opt');
          button.type = 'button';
          var mark = el('span', 'mark');
          mark.textContent = String(optionIndex + 1);
          var label = el('span');
          while (item.firstChild) label.appendChild(item.firstChild);
          button.appendChild(mark);
          button.appendChild(label);
          item.appendChild(button);
          return button;
        });
        var showChoice = function (pick) {
          buttons.forEach(function (button, optionIndex) {
            button.disabled = true;
            if (optionIndex === correctIndex) {
              button.classList.add('is-correct');
              $('.mark', button).textContent = '✓';
            } else if (optionIndex === pick) {
              button.classList.add('is-wrong');
              $('.mark', button).textContent = '✕';
            }
          });
          var ok = pick === correctIndex;
          verdict.textContent = ok ? '정답이에요! 🎉' : '아쉬워요 😢  정답은 ' + (correctIndex + 1) + '번';
          result.className = 'q-result show ' + (ok ? 'ok' : 'bad');
        };
        buttons.forEach(function (button, optionIndex) {
          button.addEventListener('click', function () {
            showChoice(optionIndex);
            record(optionIndex === correctIndex, optionIndex);
          });
        });
        var savedChoice = state.quiz[pageId] && state.quiz[pageId][index];
        if (savedChoice) showChoice(savedChoice.pick);
      }
    });

    updateScore();
  }

  function renderChecklists(root, pageId) {

  /* ------------------------------------------------------------------
   * 7. 뭉 뽑기 시뮬레이터 (Day 5 개념 설명용)
   *    앱의 확률표와 똑같은 숫자를 사용합니다.
   * ------------------------------------------------------------------ */
  var GACHA_TABLE = [
    { from: 180, label: '180분 이상', rates: [25, 40, 25, 10] },
    { from: 120, label: '120~179분', rates: [40, 37, 17, 6] },
    { from: 60, label: '60~119분', rates: [55, 32, 10, 3] },
    { from: 30, label: '30~59분', rates: [70, 25, 4, 1] }
  ];
  var GRADE_NAMES = ['일반', '희귀', '영웅', '전설'];
  var GRADE_CLASS = ['', 'rare', 'epic', 'legend'];

  function gachaRow(minutes) {
    for (var i = 0; i < GACHA_TABLE.length; i++) if (minutes >= GACHA_TABLE[i].from) return GACHA_TABLE[i];
    return null;
  }
  function gachaDraw(rates) {
    var roll = Math.floor(Math.random() * 100), sum = 0;
    for (var i = 0; i < rates.length; i++) { sum += rates[i]; if (roll < sum) return i; }
    return 0;
  }

  function renderGachaSim(root) {
    $all('[data-widget="gacha"]', root).forEach(function (box) {
      box.innerHTML =
        '<div class="sim-row"><label for="simMin"><b>공부 시간</b></label>' +
        '<input id="simMin" type="range" min="0" max="240" step="5" value="45">' +
        '<b id="simMinText"></b></div>' +
        '<div class="sim-row"><button class="btn" type="button" id="simOne">뭉 1번 뽑기</button>' +
        '<button class="btn alt" type="button" id="simMany">1,000번 뽑아 비율 보기</button></div>' +
        '<div class="sim-result" id="simResult" aria-live="polite"></div>' +
        '<div class="sim-out" id="simOut"></div>';
      var range = $('#simMin', box), text = $('#simMinText', box), out = $('#simOut', box), result = $('#simResult', box);

      function showRates(counts, total) {
        var row = gachaRow(parseInt(range.value, 10));
        out.innerHTML = '';
        if (!row) return;
        row.rates.forEach(function (rate, index) {
          var actual = counts ? ' → 실제 ' + (counts[index] / total * 100).toFixed(1) + '%' : '';
          out.appendChild(el('div', 'sim-cell',
            '<span class="grade ' + GRADE_CLASS[index] + '">' + GRADE_NAMES[index] + '</span><b>' + rate + '%</b><small>' + actual + '</small>'));
        });
      }
      function refresh() {
        var minutes = parseInt(range.value, 10), row = gachaRow(minutes);
        text.textContent = minutes + '분' + (row ? ' (' + row.label + ' 구간)' : ' (30분 미만)');
        result.textContent = row ? '' : '30분 미만이라 뭉이 나오지 않아요. 조금만 더 힘내요! 💪';
        $('#simOne', box).disabled = !row;
        $('#simMany', box).disabled = !row;
        showRates(null, 0);
      }
      range.addEventListener('input', refresh);
      $('#simOne', box).addEventListener('click', function () {
        var row = gachaRow(parseInt(range.value, 10));
        if (!row) return;
        var grade = gachaDraw(row.rates);
        result.innerHTML = '🎉 <span class="grade ' + GRADE_CLASS[grade] + '">' + GRADE_NAMES[grade] + '</span> 등급 뭉이 나왔어요!';
      });
      $('#simMany', box).addEventListener('click', function () {
        var row = gachaRow(parseInt(range.value, 10));
        if (!row) return;
        var counts = [0, 0, 0, 0], total = 1000;
        for (var i = 0; i < total; i++) counts[gachaDraw(row.rates)]++;
        result.textContent = '1,000번 뽑은 결과예요. 설계한 확률과 비슷하게 나오는지 보세요.';
        showRates(counts, total);
      });
      refresh();
    });
  }

  function buildDoneBox(page) {

    function refresh() {
      var done = !!state.done[page.id];
      text.innerHTML = done
        ? '<b>Day ' + page.day + ' 완료!</b> 뭉이 박수를 치고 있어요 👏'
        : '퀴즈와 과제를 끝냈다면 완료로 표시해 주세요.';
      button.textContent = done ? '완료 취소' : '✓ Day ' + page.day + ' 완료로 표시';
      button.className = done ? 'btn alt' : 'btn';
    }
    button.addEventListener('click', function () {
      if (state.done[page.id]) delete state.done[page.id]; else state.done[page.id] = true;
      saveState();
      refresh();
      renderNav();
      var chip = $('.hero-chips .chip');
      if (chip) {
        chip.className = 'chip' + (state.done[page.id] ? ' is-on' : '');
        chip.textContent = state.done[page.id] ? '✓ 완료한 일차' : '아직 진행 중';
      }
      if (state.done[page.id]) toast('Day ' + page.day + ' 완료! 수고했어요 🎉');
    });
    refresh();
    box.appendChild(text);
    box.appendChild(button);
    return box;
  }

  function buildPager(page) {
    var index = PAGES.indexOf(page);
    var pager = el('nav', 'pager');
    pager.setAttribute('aria-label', '이전/다음 페이지');
    var prev = PAGES[index - 1], next = PAGES[index + 1];
    function label(target) { return (target.day ? 'Day ' + target.day + ' · ' : '') + target.title; }
    var prevLink = el('a', 'prev');
    if (prev) { prevLink.href = '#' + prev.id; prevLink.innerHTML = '<small>← 이전</small>' + esc(label(prev)); } else prevLink.hidden = true;
    var nextLink = el('a', 'next');
    if (next) { nextLink.href = '#' + next.id; nextLink.innerHTML = '<small>다음 →</small>' + esc(label(next)); } else nextLink.hidden = true;
    pager.appendChild(prevLink);
    pager.appendChild(nextLink);
    return pager;
  }

  function showPage(id, sectionKey) {
    var page = pageById(id) || PAGES[0];
    var template = templateOf(page.id);
    var container = $('#page');
    currentId = page.id;
    container.innerHTML = '';

    var content = document.createDocumentFragment();
    if (template) content.appendChild(template.content.cloneNode(true));
    var holder = el('div');
    holder.appendChild(content);

    wrapDetails(holder);
    var sectionNav = decorateSections(holder, page);
    renderCodeBlocks(holder);
    renderChecklists(holder, page.id);

    container.appendChild(buildHero(page));
    container.appendChild(sectionNav);
    while (holder.firstChild) container.appendChild(holder.firstChild);
    renderQuiz(container, page.id);
    renderGachaSim(container);
    if (page.day) container.appendChild(buildDoneBox(page));
    container.appendChild(buildPager(page));

    state.last = page.id;
    saveState();
    renderNav();
    document.title = (page.day ? 'Day ' + page.day + ' ' : '') + page.title + ' · 뭉타이머 7일 완성';

    /* 페이지를 바꿀 때는 부드러운 스크롤 없이 바로 이동한다 (이전 페이지의 스크롤 위치에서 미끄러지지 않게) */
    var target = sectionKey ? document.getElementById(page.id + '-' + sectionKey) : null;
    if (target) target.scrollIntoView({ block: 'start', behavior: 'instant' });
    else window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
  }

  /* 주소의 #day3 또는 #day3/quiz 형태를 읽어 페이지를 고릅니다 */
  function route() {
    var hash = decodeURIComponent(window.location.hash.replace(/^#/, ''));
    var parts = hash.split('/');
    var id = pageById(parts[0]) ? parts[0] : (pageById(state.last) ? state.last : 'prep');
    if (id === currentId && !parts[1]) { window.scrollTo({ top: 0, left: 0, behavior: 'instant' }); return; }
    showPage(id, parts[1]);
  }

  /* ------------------------------------------------------------------
   * 10. 테마 전환 · 초기화 버튼
   * ------------------------------------------------------------------ */
  function applyTheme() {
    if (state.theme === 'light' || state.theme === 'dark') {
      document.documentElement.setAttribute('data-theme', state.theme);
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
  }

  document.addEventListener('click', function (event) {
    var trigger = event.target.closest ? event.target.closest('[data-action]') : null;
    if (!trigger) return;
    var action = trigger.getAttribute('data-action');
    if (action === 'theme') {
      var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var now = state.theme || (systemDark ? 'dark' : 'light');
      state.theme = now === 'dark' ? 'light' : 'dark';
      saveState();
      applyTheme();
    } else if (action === 'reset') {
      if (window.confirm('완료 표시, 퀴즈 점수, 과제 체크를 모두 지울까요?')) {
        var theme = state.theme;
        state = defaultState();
        state.theme = theme;
        state.last = currentId || 'prep';
        saveState();
        showPage(state.last);
        toast('진행률을 초기화했어요.');
      }
    }
  });

  applyTheme();
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
