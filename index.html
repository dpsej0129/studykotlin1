      <li>15분</li>
      <li>18분</li>
    </ul>
    <div class="q-explain"><p>경과 시간 = accumulated(10분) + (지금 − startedAt)(5분) = 15분. 앱이 종료돼 있었는지는 계산에 영향을 주지 않습니다. 시작 시각이 저장돼 있기 때문입니다.</p></div>
  </div>

  <div class="q" data-type="fill" data-answer="copy">
    <p class="q-title">지금 상태에서 <code>elapsedSeconds</code>만 바꾼 새 상태로 교체하려고 합니다. 빈칸은?</p>
    <script type="text/plain" class="code" data-lang="kotlin">
_uiState.update { it.____(elapsedSeconds = 10) }
    </script>
    <div class="q-explain"><p>Day 2에서 배운 data class의 <code>copy</code>입니다. 상태 객체를 직접 고치지 않고 <b>새 객체로 교체</b>해야 StateFlow가 "바뀌었다"는 것을 알아챕니다.</p></div>
  </div>

  <div class="q" data-type="mc" data-answer="4">
    <p class="q-title"><code>viewModelScope</code>에서 시작한 코루틴은 언제 자동으로 취소될까요?</p>
    <ul class="q-options">
      <li>화면을 회전할 때마다</li>
      <li>앱이 백그라운드로 갈 때마다</li>
      <li><code>delay</code>가 끝날 때마다</li>
      <li>ViewModel이 완전히 필요 없어져 제거될 때 (예: 화면을 완전히 닫음)</li>
    </ul>
    <div class="q-explain"><p>회전이나 백그라운드 전환으로는 ViewModel이 사라지지 않으므로 코루틴도 계속 살아 있습니다. ViewModel이 제거될 때 함께 정리되기 때문에 "끄는 것을 깜빡한 타이머"가 남지 않습니다.</p></div>
  </div>
</section>

<section class="sec" data-sec="task">
  <h3>과제: 진짜로 동작하는 타이머 완성하기</h3>
  <p><code>TimerViewModel</code>을 만들고 어제의 화면에 연결합니다. <code>TimerContent.kt</code>는 고치지 않습니다. 종료하면 공부한 시간을 알려 주는 결과 창을 띄웁니다(뭉 뽑기는 내일 이 자리에 넣습니다).</p>

  <h4>요구사항 체크리스트</h4>
  <ul class="checklist">
    <li><code>app/build.gradle.kts</code>에 lifecycle 라이브러리 2줄을 추가하고 Sync했다</li>
    <li><code>timer/TimerViewModel.kt</code>에 <code>data class TimerUiState(status, elapsedSeconds, finishedSeconds: Long?)</code>를 만들었다</li>
    <li><code>TimerViewModel</code>이 <code>_uiState</code>(private) / <code>uiState</code>(공개) 쌍을 가진다</li>
    <li><code>start()</code> · <code>pause()</code> · <code>finish()</code> · <code>dismissResult()</code>를 구현했다. 경과 시간은 <b>accumulated + (지금 − startedAt)</b>으로 계산한다</li>
    <li>실행 중에는 <code>viewModelScope.launch</code>로 0.5초마다 시계를 읽어 <code>elapsedSeconds</code>를 갱신하고, 일시정지/종료 때 그 코루틴을 취소한다</li>
    <li><code>SharedPreferences</code>에 <code>status</code>, <code>startedAt</code>, <code>accumulated</code>를 저장하고, ViewModel이 만들어질 때 복원한다</li>
    <li><code>TimerScreen</code>이 <code>viewModel()</code>과 <code>collectAsStateWithLifecycle()</code>을 사용한다</li>
    <li>종료하면 <code>AlertDialog</code>로 <code>resultMessage()</code>를 보여 주고, 확인을 누르면 닫힌다</li>
    <li>시험 통과: ① 회전 ② 홈으로 나갔다 1분 뒤 복귀 ③ 앱 종료 후 1분 뒤 재실행 — 모두 시간이 정확히 이어진다</li>
  </ul>

  <details class="hint"><summary>힌트 1 — ViewModel에서 저장소 쓰기</summary>
    <p><code>SharedPreferences</code>를 얻으려면 <code>Context</code>가 필요합니다. <code>class TimerViewModel(application: Application) : AndroidViewModel(application)</code>으로 만들면 <code>application.getSharedPreferences("timer", Context.MODE_PRIVATE)</code>를 쓸 수 있고, 화면에서는 그대로 <code>viewModel()</code>로 얻을 수 있습니다.</p>
  </details>
  <details class="hint"><summary>힌트 2 — 세 함수가 할 일</summary>
    <p><b>start</b>: <code>startedAt = 지금</code> → 저장 → 틱 코루틴 시작.<br>
    <b>pause</b>: 틱 취소 → <code>accumulated = 현재 경과 시간</code>, <code>startedAt = 0</code> → 저장 → 상태를 PAUSED로.<br>
    <b>finish</b>: 틱 취소 → 총 시간을 계산해 두고 → 두 값을 0으로 → 저장 → 상태를 <code>TimerUiState(finishedSeconds = 총시간)</code>으로 교체.</p>
  </details>
  <details class="hint"><summary>힌트 3 — 저장과 복원</summary>
    <p>저장: <code>prefs.edit { putString("status", status.name); putLong("startedAt", startedAt); … }</code> (<code>androidx.core.content.edit</code>를 import). 복원: <code>init { restore() }</code>에서 읽고, 저장된 상태가 RUNNING이면 <b>틱 코루틴만 다시 시작</b>하면 됩니다. 시작 시각이 그대로 있으니 경과 시간은 저절로 맞습니다. 문자열을 enum으로 되돌릴 때는 <code>TimerStatus.valueOf(문자열)</code>.</p>
  </details>
  <details class="hint"><summary>힌트 4 — 결과 창</summary>
    <p><code>val finished = uiState.finishedSeconds</code> 다음 <code>if (finished != null) { AlertDialog(onDismissRequest = …, title = { Text("…") }, text = { Text(resultMessage(finished)) }, confirmButton = { TextButton(onClick = …) { Text("확인") } }) }</code>. 닫을 때 <code>viewModel.dismissResult()</code>를 불러 <code>finishedSeconds</code>를 null로 되돌립니다.</p>
  </details>

  <details class="answer"><summary>모범 답안 보기</summary>
    <script type="text/plain" class="code" data-lang="kotlin" data-title="timer/TimerViewModel.kt (Day 4 버전)" data-path="app/src/main/java/com/example/mungtimer/timer/TimerViewModel.kt">
package com.example.mungtimer.timer

import android.app.Application
import android.content.Context
import androidx.core.content.edit
import androidx.lifecycle.AndroidViewModel
import androidx.lifecycle.viewModelScope
import kotlinx.coroutines.Job
import kotlinx.coroutines.delay
import kotlinx.coroutines.flow.MutableStateFlow
import kotlinx.coroutines.flow.StateFlow
import kotlinx.coroutines.flow.asStateFlow
import kotlinx.coroutines.flow.update
import kotlinx.coroutines.isActive
import kotlinx.coroutines.launch

// 저장할 때 쓰는 이름표들
private const val KEY_STATUS = "status"
private const val KEY_STARTED_AT = "startedAt"
private const val KEY_ACCUMULATED = "accumulated"

// 타이머 화면에 필요한 모든 값
data class TimerUiState(
    val status: TimerStatus = TimerStatus.IDLE,
    val elapsedSeconds: Long = 0,
    val finishedSeconds: Long? = null,      // 방금 종료한 공부 시간(초). null이면 결과 창을 띄우지 않는다
)

// AndroidViewModel: 저장소를 쓰기 위해 Application(앱 전체를 대표하는 객체)을 받는 ViewModel
class TimerViewModel(application: Application) : AndroidViewModel(application) {

    // 값 몇 개를 기기에 저장하는 작은 메모장
    private val prefs = application.getSharedPreferences("timer", Context.MODE_PRIVATE)

    private val _uiState = MutableStateFlow(TimerUiState())
    val uiState: StateFlow<TimerUiState> = _uiState.asStateFlow()

    private var startedAt = 0L          // 지금 구간을 시작한 시각(ms). 멈춰 있으면 0
    private var accumulated = 0L        // 이전 구간들에서 쌓인 시간(ms)
    private var tickJob: Job? = null    // 화면 갱신 코루틴의 리모컨

    init {
        restore()                       // ViewModel이 만들어질 때 저장된 타이머를 이어 간다
    }

    fun start() {
        if (_uiState.value.status == TimerStatus.RUNNING) return
        startedAt = System.currentTimeMillis()      // 시각을 적어 둔다
        save(TimerStatus.RUNNING)
        startTicking()
    }

    fun pause() {
        if (_uiState.value.status != TimerStatus.RUNNING) return
        tickJob?.cancel()
        accumulated = elapsedMillis()               // 지금까지의 시간을 쌓아 두고
        startedAt = 0L                              // 멈춤 표시
        save(TimerStatus.PAUSED)
        _uiState.update { it.copy(status = TimerStatus.PAUSED, elapsedSeconds = accumulated / 1000) }
    }

    fun finish() {
        if (_uiState.value.status == TimerStatus.IDLE) return
        tickJob?.cancel()
        val totalSeconds = elapsedMillis() / 1000   // 초기화하기 전에 총 시간을 먼저 구한다
        startedAt = 0L
        accumulated = 0L
        save(TimerStatus.IDLE)
        _uiState.update { TimerUiState(finishedSeconds = totalSeconds) }   // 처음 상태 + 결과
    }

    // 결과 창을 닫는다
    fun dismissResult() {
        _uiState.update { it.copy(finishedSeconds = null) }
    }

    // 경과 시간(ms) = 쌓인 시간 + (지금 − 시작 시각)
    private fun elapsedMillis(): Long {
        if (startedAt == 0L) return accumulated
        val runningPart = System.currentTimeMillis() - startedAt
        return accumulated + runningPart.coerceAtLeast(0L)   // 기기 시계가 뒤로 바뀌어도 음수는 되지 않게
    }

    // 0.5초마다 시계를 다시 읽어 화면 상태를 갱신한다. "세는" 것이 아니라 "읽는" 것!
    private fun startTicking() {
        tickJob?.cancel()
        tickJob = viewModelScope.launch {
            while (isActive) {
                _uiState.update {
                    it.copy(status = TimerStatus.RUNNING, elapsedSeconds = elapsedMillis() / 1000)
                }
                delay(500)
            }
        }
    }

    private fun save(status: TimerStatus) {
        prefs.edit {
            putString(KEY_STATUS, status.name)      // enum → "RUNNING" 같은 문자열
            putLong(KEY_STARTED_AT, startedAt)
            putLong(KEY_ACCUMULATED, accumulated)
        }
    }

    private fun restore() {
        val savedStatus = prefs.getString(KEY_STATUS, null) ?: return   // 저장된 적이 없으면 그대로 시작
        startedAt = prefs.getLong(KEY_STARTED_AT, 0L)
        accumulated = prefs.getLong(KEY_ACCUMULATED, 0L)

        when (TimerStatus.valueOf(savedStatus)) {   // 문자열 → enum
            TimerStatus.RUNNING -> startTicking()   // 시작 시각이 그대로라 경과 시간은 저절로 맞는다
            TimerStatus.PAUSED -> _uiState.update {
                it.copy(status = TimerStatus.PAUSED, elapsedSeconds = accumulated / 1000)
            }
            TimerStatus.IDLE -> Unit                // 할 일 없음
        }
    }
}
    </script>

  <h3>6. 쓰기는 <code>suspend</code>, 읽기는 <code>Flow</code></h3>
  <ul>
    <li><b>쓰기</b>(<code>insert</code>)는 디스크에 기록하느라 시간이 걸리므로 <code>suspend</code> 함수입니다. 어제 배운 대로 코루틴(<code>viewModelScope.launch</code>) 안에서 부릅니다.</li>
    <li><b>읽기</b>를 <code>Flow&lt;List&lt;OwnedMung&gt;&gt;</code>로 받으면, 표가 바뀔 때마다 <b>새 목록이 자동으로 흘러나옵니다</b>. 뭉을 저장하는 코드와 도감 화면이 서로를 몰라도, 저장하는 순간 도감이 갱신됩니다.</li>
  </ul>
  <div class="note analogy"><b>비유 — 수도관.</b> <code>Flow</code>는 값이 계속 흘러나오는 수도관입니다. 어제의 <code>StateFlow</code>(전광판)는 "항상 최신 값 하나를 들고 있는" 특별한 Flow입니다. Room이 주는 수도관을 <code>stateIn(…)</code>으로 전광판에 연결하면 화면이 구독할 수 있습니다.</div>

  <div class="note warn"><b>Room 2와 Room 3.</b> 이 사이트는 최신 안정 버전인 <b>Room 3</b>(<code>androidx.room3</code>)을 씁니다. 인터넷의 많은 글은 Room 2(<code>androidx.room</code>) 기준인데, 개념(Entity/Dao/Database)은 같고 달라진 점은 세 가지입니다: ① import가 <code>androidx.room3.…</code> ② DB를 만들 때 <code>.setDriver(AndroidSQLiteDriver())</code> 한 줄이 필요 ③ DAO 함수는 반드시 <code>suspend</code>이거나 <code>Flow</code>를 돌려줘야 함.</div>

  <h3>예제 1. 누적 확률로 등급 뽑기 + 시뮬레이션으로 검증</h3>
  <script type="text/plain" class="code" data-lang="kotlin" data-title="Ex1.kt" data-run="d5_ex1">
import kotlin.random.Random

enum class Grade { COMMON, RARE, EPIC, LEGENDARY }

// 30~59분 구간의 확률표: 등급 → 확률(%)
val rates = mapOf(
    Grade.COMMON to 70,
    Grade.RARE to 25,
    Grade.EPIC to 4,
    Grade.LEGENDARY to 1,
)

fun drawGrade(): Grade {
    val roll = Random.nextInt(100)          // 0 이상 100 미만의 정수 (룰렛의 칸 번호)
    var cumulative = 0                      // 누적 확률
    for (grade in Grade.entries) {          // COMMON → RARE → EPIC → LEGENDARY 순서로
        cumulative += rates[grade] ?: 0     // 70 → 95 → 99 → 100
        if (roll < cumulative) return grade // 처음으로 roll보다 커지는 구간이 당첨
    }
    return Grade.COMMON                     // 합계가 100이면 여기까지 오지 않는다 (안전장치)
}

fun main() {
    println("확률 합계: ${rates.values.sum()}")     // 100이 아니면 표를 잘못 만든 것

    // 한 번 뽑기
    println("이번에 나온 등급: ${drawGrade()}")

    // 10만 번 뽑아서 실제 비율이 설계한 확률과 비슷한지 확인 (확률 코드를 검증하는 방법)
    val total = 100_000
    val counts = mutableMapOf<Grade, Int>()
    repeat(total) {                                 // repeat(n) { } : n번 반복
        val grade = drawGrade()
        counts[grade] = (counts[grade] ?: 0) + 1
    }
    for (grade in Grade.entries) {
        val percent = (counts[grade] ?: 0) * 100.0 / total
        println("$grade: 설계 ${rates[grade]}% → 실제 $percent%")
    }
}
  </script>

  <h3>예제 2. <code>Flow</code> — 데이터가 바뀌면 화면이 알아서 따라온다</h3>
  <script type="text/plain" class="code" data-lang="kotlin" data-title="Ex2.kt" data-run="d5_ex2">
import kotlinx.coroutines.delay
import kotlinx.coroutines.flow.Flow
import kotlinx.coroutines.flow.MutableStateFlow
import kotlinx.coroutines.flow.map
import kotlinx.coroutines.flow.update
import kotlinx.coroutines.launch
import kotlinx.coroutines.runBlocking

fun main() = runBlocking {
    // DB의 표 역할을 하는 가짜 저장소: 내가 얻은 뭉의 id 목록
    val table = MutableStateFlow(listOf<Int>())

    // map: 흘러나오는 값 하나하나를 다른 모양으로 바꾼 새 Flow (목록의 map과 같은 생각)
    val summary: Flow<String> = table.map { ids ->
        "뭉 ${ids.size}마리 (${ids.distinct().size}종)"
    }

    // 도감 화면 역할: summary를 구독하고 있다
    val screen = launch {
        summary.collect { text -> println("도감 화면: $text") }
    }

    // 타이머 쪽에서 뭉을 저장한다. 도감 화면을 전혀 모르지만, 화면은 알아서 갱신된다
    delay(100)
    table.update { it + 1 }         // 1번 뭉 획득 (목록 + 값 = 값이 추가된 새 목록)
    delay(100)
    table.update { it + 6 }         // 6번 뭉 획득
    delay(100)
    table.update { it + 1 }         // 1번 뭉을 또 획득
    delay(100)

    screen.cancel()
}
  </script>

도감 화면: 뭉 3마리 (2종)
  </script>

  <h3>예제 4. DAO — 부탁할 수 있는 일의 목록</h3>
  <script type="text/plain" class="code" data-lang="kotlin" data-title="data/MungDao.kt" data-path="app/src/main/java/com/example/mungtimer/data/MungDao.kt">
package com.example.mungtimer.data

import androidx.room3.Dao
import androidx.room3.Insert
import androidx.room3.Query
import kotlinx.coroutines.flow.Flow

// interface: "이런 함수들이 있다"는 목록만 적는다. 실제 구현은 Room(KSP)이 만들어 준다
@Dao
interface MungDao {

    // 한 줄 넣기. 디스크에 쓰는 일이라 suspend (코루틴 안에서 호출)
    @Insert
    suspend fun insert(mung: OwnedMung)

    // 얻은 뭉 전체를 최근 것부터. Flow라서 표가 바뀔 때마다 새 목록이 흘러나온다
    @Query("SELECT * FROM owned_mung ORDER BY obtainedAt DESC")
    fun observeAll(): Flow<List<OwnedMung>>

    // 지금 몇 마리인지 한 번만 물어보기 (내일 그룹에 올릴 때 사용)
    @Query("SELECT COUNT(*) FROM owned_mung")
    suspend fun count(): Int
}
  </script>
  <script type="text/plain" class="code" data-lang="kotlin" data-title="data/StudyDao.kt" data-path="app/src/main/java/com/example/mungtimer/data/StudyDao.kt">
package com.example.mungtimer.data

import androidx.room3.Dao
import androidx.room3.Insert
import androidx.room3.Query

// 질문의 결과를 담는 그릇. SELECT가 돌려주는 칸 이름(dateKey, seconds)과 프로퍼티 이름이 같아야 한다
data class DailyTotal(
    val dateKey: String,
    val seconds: Long,
)

@Dao
interface StudyDao {

    @Insert
    suspend fun insert(session: StudySession)

    // fromDateKey 이후의 기록을 날짜별로 묶어 합계를 구한다 (내일 그룹 랭킹에 올릴 데이터)
    @Query(
        "SELECT dateKey, SUM(seconds) AS seconds FROM study_session " +
            "WHERE dateKey >= :fromDateKey GROUP BY dateKey"
    )
    suspend fun dailyTotalsSince(fromDateKey: String): List<DailyTotal>
}

  <h3>예제 5. Database — 전부 연결하기</h3>
  <script type="text/plain" class="code" data-lang="kotlin" data-title="data/AppDatabase.kt" data-path="app/src/main/java/com/example/mungtimer/data/AppDatabase.kt">
package com.example.mungtimer.data

import android.content.Context
import androidx.room3.Database
import androidx.room3.Room
import androidx.room3.RoomDatabase
import androidx.sqlite.driver.AndroidSQLiteDriver

// entities: 이 DB에 들어갈 표들.  version: 표의 모양을 바꿀 때마다 올리는 번호
@Database(
    entities = [OwnedMung::class, StudySession::class],
    version = 1,
    exportSchema = false,
)
abstract class AppDatabase : RoomDatabase() {

    // DAO를 꺼내는 함수. 구현은 Room이 만든다
    abstract fun mungDao(): MungDao
    abstract fun studyDao(): StudyDao

    // companion object: 객체를 만들지 않고 AppDatabase.getInstance(…) 처럼 클래스 이름으로 부르는 곳
    companion object {
        private var instance: AppDatabase? = null

        // DB는 만드는 비용이 커서 앱 전체에서 하나만 만들어 함께 쓴다.
        // (ViewModel은 모두 메인 스레드에서 만들어지므로 이 정도의 단순한 구현으로 충분하다)
        fun getInstance(context: Context): AppDatabase {
            val existing = instance
            if (existing != null) return existing

            val created = Room.databaseBuilder<AppDatabase>(context.applicationContext, "mung.db")
                .setDriver(AndroidSQLiteDriver())   // 안드로이드에 내장된 SQLite를 사용 (Room 3에서 필수)
                .build()
            instance = created
            return created
        }
    }
}
  </script>

<section class="sec" data-sec="studio">
  <h3>A. KSP 플러그인과 Room 추가하기</h3>
  <p>Room은 빌드할 때 코드를 만들어 주는 도구(KSP)가 필요해서, 파일 <b>두 개</b>를 고칩니다.</p>
  <ol class="steps">
    <li><span class="menu-path">Gradle Scripts → build.gradle.kts (Project: MungTimer)</span>를 열고 <code>plugins { }</code> 블록에 한 줄을 추가합니다.
      <script type="text/plain" class="code" data-lang="kts" data-title="build.gradle.kts (Project: MungTimer) — plugins 블록에 추가" data-hl="4-5">
plugins {
    // … 마법사가 만든 기존 줄들은 그대로 둔다 …

    // Day 5: Room이 쓰는 코드 생성 도구
    id("com.google.devtools.ksp") version "2.3.13" apply false
}
      </script>
    </li>
    <li><span class="menu-path">build.gradle.kts (Module :app)</span>을 열고 맨 위 <code>plugins { }</code> 블록에 한 줄, 맨 아래 <code>dependencies { }</code> 블록에 두 줄을 추가합니다.
      <script type="text/plain" class="code" data-lang="kts" data-title="app/build.gradle.kts — 두 군데에 추가" data-hl="4-5,13-15">
plugins {
    // … 기존 줄들 …

    // Day 5
    id("com.google.devtools.ksp")
}

// … android { } 블록은 그대로 …

dependencies {
    // … 기존 줄들과 Day 4에 추가한 줄들 …

    // Day 5: Room (기기 안 데이터베이스)
    implementation("androidx.room3:room3-runtime:3.0.3")
    ksp("androidx.room3:room3-compiler:3.0.3")          // implementation이 아니라 ksp !
}
      </script>
    </li>
    <li><b>Sync Now</b>를 누르고 오류 없이 끝나는지 확인합니다. KSP 버전 숫자(<code>2.3.13</code>)에 관한 오류가 나면, 숫자 위의 노란 밑줄에서 <kbd>Alt</kbd>+<kbd>Enter</kbd>로 제안되는 최신 버전으로 올린 뒤 다시 Sync하세요.</li>
  </ol>
  <div class="note warn"><b>자주 하는 실수</b> — ① 두 번째 줄을 <code>implementation(…room3-compiler…)</code>로 적으면 Room이 코드를 만들어 주지 않아, 실행하자마자 <code>Cannot find implementation for …AppDatabase. AppDatabase_Impl does not exist</code> 오류로 죽습니다. 반드시 <code>ksp(…)</code>입니다. ② 인터넷 글을 따라 <code>org.jetbrains.kotlin.android</code>나 <code>kotlin-kapt</code> 플러그인을 추가하지 마세요. 최신 안드로이드 스튜디오 프로젝트에서는 필요 없고, 넣으면 오류가 납니다.</div>

  <h3>B. Database Inspector로 저장된 데이터 보기</h3>
  <ol class="steps">
    <li>앱을 기기에서 <b>실행한 상태</b>로 둡니다. (API 26 이상 기기에서 동작합니다.)</li>
    <li>아래쪽 도구 창에서 <b>App Inspection</b>을 엽니다. 안 보이면 <kbd>Shift</kbd> 두 번 → "App Inspection".</li>
    <li><b>Database Inspector</b> 탭에서 <code>mung.db</code> → <code>owned_mung</code>을 더블클릭하면 표가 그대로 보입니다. DB는 앱이 처음 사용할 때 만들어지므로, 목록이 비어 있으면 도감 화면을 한 번 열어 주세요.</li>
    <li><b>Live updates</b>를 체크하면, 앱에서 뭉을 뽑는 순간 줄이 추가되는 것을 볼 수 있습니다.</li>
    <li>표 위의 <b>쿼리 창</b> 아이콘을 눌러 <code>SELECT COUNT(*) FROM owned_mung</code> 같은 SQL을 직접 실행해 볼 수도 있습니다.</li>
  </ol>

  <h3>C. 뽑기를 빨리 시험하는 법</h3>
  <ol class="steps">
    <li><code>timer/TimeUtils.kt</code>의 <code>MIN_SECONDS_FOR_MUNG = 30 * 60L</code>을 <code>10L</code>로 바꾸고 실행합니다. 10초만 지나면 뭉이 나옵니다(확률은 30분 구간이 적용됩니다).</li>
    <li>여러 번 뽑아 도감이 채워지는 것, 앱을 껐다 켜도 남아 있는 것을 확인합니다.</li>
    <li><b>시험이 끝나면 반드시 <code>30 * 60L</code>로 되돌립니다.</b></li>
  </ol>

  <h3>D. 표의 모양(Entity)을 바꿨더니 앱이 죽을 때</h3>
  <p>Entity에 프로퍼티를 추가하거나 이름을 바꾸면, 기기에 이미 만들어진 예전 모양의 DB와 맞지 않아 앱이 시작하자마자 죽습니다(Logcat에 <code>Room cannot verify the data integrity</code>).</p>
  <ul>
    <li><b>개발 중 해결법</b>: 기기에서 앱을 <b>삭제</b>(또는 설정 → 앱 → 저장공간 → 데이터 삭제)하고 다시 실행합니다. 새 모양으로 DB가 다시 만들어집니다.</li>
    <li>실제 서비스에서는 <code>version</code>을 올리고 "마이그레이션"을 작성해 사용자 데이터를 보존합니다. 이 과정은 7일 범위 밖이니, <b>Entity는 오늘 정한 모양을 끝까지 유지</b>합시다.</li>
  </ul>

package com.example.mungtimer.model

import kotlin.random.Random

// 확률표의 한 줄: "공부 시간이 minMinutes분 이상이면 이 확률을 쓴다"
data class GachaRow(
    val minMinutes: Int,
    val rates: Map<MungGrade, Int>,     // 등급 → 확률(%). 합계는 반드시 100
)

object MungGacha {

    // 시간대별 확률표. 긴 시간부터 적는다 (위에서부터 처음 맞는 줄을 쓰기 때문)
    val table: List<GachaRow> = listOf(
        GachaRow(
            minMinutes = 180,
            rates = mapOf(
                MungGrade.COMMON to 25, MungGrade.RARE to 40,
                MungGrade.EPIC to 25, MungGrade.LEGENDARY to 10,
            ),
        ),
        GachaRow(
            minMinutes = 120,
            rates = mapOf(
                MungGrade.COMMON to 40, MungGrade.RARE to 37,
                MungGrade.EPIC to 17, MungGrade.LEGENDARY to 6,
            ),
        ),
        GachaRow(
            minMinutes = 60,
            rates = mapOf(
                MungGrade.COMMON to 55, MungGrade.RARE to 32,
                MungGrade.EPIC to 10, MungGrade.LEGENDARY to 3,
            ),
        ),
        GachaRow(
            minMinutes = 30,
            rates = mapOf(
                MungGrade.COMMON to 70, MungGrade.RARE to 25,
                MungGrade.EPIC to 4, MungGrade.LEGENDARY to 1,
            ),
        ),
    )

    // 공부 시간(분)에 맞는 확률표 줄. 가장 낮은 구간에도 못 미치면 마지막(30분) 줄을 쓴다.
    // "30분 미만이면 뽑지 않는다"는 판단은 부르는 쪽(canGetMung)이 한다
    fun rowFor(studyMinutes: Long): GachaRow =
        table.firstOrNull { studyMinutes >= it.minMinutes } ?: table.last()

    // 등급 뽑기: 0~99 주사위를 굴려, 누적 확률 구간에 따라 등급을 정한다
    fun drawGrade(row: GachaRow, random: Random = Random.Default): MungGrade {
        val roll = random.nextInt(100)
        var cumulative = 0
        for (grade in MungGrade.entries) {
            cumulative += row.rates[grade] ?: 0
            if (roll < cumulative) return grade
        }
        return MungGrade.COMMON             // 합계가 100이면 여기까지 오지 않는다 (안전장치)
    }

    // 뭉 뽑기: ① 등급을 확률로 정하고 ② 그 등급에서 한 마리를 고르게 뽑는다
    fun draw(studyMinutes: Long, random: Random = Random.Default): Mung {
        val grade = drawGrade(rowFor(studyMinutes), random)
        return MungCatalog.byGrade(grade).random(random)
    }
}

    <script type="text/plain" class="code" data-lang="kotlin" data-title="timer/TimerViewModel.kt (Day 5 버전 — 파일 전체 교체)" data-path="app/src/main/java/com/example/mungtimer/timer/TimerViewModel.kt" data-hl="8-13,28-32,38,47-50,86-107,112">
package com.example.mungtimer.timer

import android.app.Application
import android.content.Context
import androidx.core.content.edit
import androidx.lifecycle.AndroidViewModel
import androidx.lifecycle.viewModelScope
import com.example.mungtimer.data.AppDatabase
import com.example.mungtimer.data.OwnedMung
import com.example.mungtimer.data.StudySession
import com.example.mungtimer.data.todayKey
import com.example.mungtimer.model.Mung
import com.example.mungtimer.model.MungGacha
import kotlinx.coroutines.Job
import kotlinx.coroutines.delay
import kotlinx.coroutines.flow.MutableStateFlow
import kotlinx.coroutines.flow.StateFlow
import kotlinx.coroutines.flow.asStateFlow
import kotlinx.coroutines.flow.update
import kotlinx.coroutines.isActive
import kotlinx.coroutines.launch

// 저장할 때 쓰는 이름표들
private const val KEY_STATUS = "status"
private const val KEY_STARTED_AT = "startedAt"
private const val KEY_ACCUMULATED = "accumulated"

// 종료 결과: 공부한 시간과, 나온 뭉 (30분 미만이면 null)
data class FinishResult(
    val studySeconds: Long,
    val mung: Mung?,
)

// 타이머 화면에 필요한 모든 값
data class TimerUiState(
    val status: TimerStatus = TimerStatus.IDLE,
    val elapsedSeconds: Long = 0,
    val result: FinishResult? = null,       // 방금 종료한 결과. null이면 결과 창을 띄우지 않는다
)

// AndroidViewModel: 저장소를 쓰기 위해 Application(앱 전체를 대표하는 객체)을 받는 ViewModel
class TimerViewModel(application: Application) : AndroidViewModel(application) {

    // 값 몇 개를 기기에 저장하는 작은 메모장
    private val prefs = application.getSharedPreferences("timer", Context.MODE_PRIVATE)

    // 데이터베이스의 사서(DAO) 두 명
    private val database = AppDatabase.getInstance(application)
    private val mungDao = database.mungDao()
    private val studyDao = database.studyDao()

    private val _uiState = MutableStateFlow(TimerUiState())
    val uiState: StateFlow<TimerUiState> = _uiState.asStateFlow()

    private var startedAt = 0L          // 지금 구간을 시작한 시각(ms). 멈춰 있으면 0
    private var accumulated = 0L        // 이전 구간들에서 쌓인 시간(ms)
    private var tickJob: Job? = null    // 화면 갱신 코루틴의 리모컨

    init {
        restore()                       // ViewModel이 만들어질 때 저장된 타이머를 이어 간다
    }

    fun start() {
        if (_uiState.value.status == TimerStatus.RUNNING) return
        startedAt = System.currentTimeMillis()      // 시각을 적어 둔다
        save(TimerStatus.RUNNING)
        startTicking()
    }

    fun pause() {
        if (_uiState.value.status != TimerStatus.RUNNING) return
        tickJob?.cancel()
        accumulated = elapsedMillis()               // 지금까지의 시간을 쌓아 두고
        startedAt = 0L                              // 멈춤 표시
        save(TimerStatus.PAUSED)
        _uiState.update { it.copy(status = TimerStatus.PAUSED, elapsedSeconds = accumulated / 1000) }
    }

    fun finish() {
        if (_uiState.value.status == TimerStatus.IDLE) return
        tickJob?.cancel()
        val totalSeconds = elapsedMillis() / 1000   // 초기화하기 전에 총 시간을 먼저 구한다
        startedAt = 0L
        accumulated = 0L
        save(TimerStatus.IDLE)
        _uiState.update { TimerUiState() }          // 화면은 바로 처음 상태로

        // DB 저장은 suspend 함수 → 코루틴 안에서
        viewModelScope.launch {
            val now = System.currentTimeMillis()

            // ① 공부 기록 저장 (내일 그룹 랭킹의 재료)
            if (totalSeconds > 0) {
                studyDao.insert(StudySession(dateKey = todayKey(), seconds = totalSeconds, endedAt = now))
            }

            // ② 30분 이상이면 뭉을 뽑아 도감에 저장
            val mung = if (canGetMung(totalSeconds)) MungGacha.draw(totalSeconds / 60) else null
            if (mung != null) {
                mungDao.insert(
                    OwnedMung(mungId = mung.id, obtainedAt = now, studyMinutes = (totalSeconds / 60).toInt())
                )
            }

            // ③ 결과 창 띄우기
            _uiState.update { it.copy(result = FinishResult(totalSeconds, mung)) }
        }
    }

    // 결과 창을 닫는다
    fun dismissResult() {
        _uiState.update { it.copy(result = null) }
    }

    // 경과 시간(ms) = 쌓인 시간 + (지금 − 시작 시각)
    private fun elapsedMillis(): Long {
        if (startedAt == 0L) return accumulated
        val runningPart = System.currentTimeMillis() - startedAt
        return accumulated + runningPart.coerceAtLeast(0L)   // 기기 시계가 뒤로 바뀌어도 음수는 되지 않게
    }

    // 0.5초마다 시계를 다시 읽어 화면 상태를 갱신한다. "세는" 것이 아니라 "읽는" 것!
    private fun startTicking() {
        tickJob?.cancel()
        tickJob = viewModelScope.launch {
            while (isActive) {
                _uiState.update {
                    it.copy(status = TimerStatus.RUNNING, elapsedSeconds = elapsedMillis() / 1000)
                }
                delay(500)
            }
        }
    }

    private fun save(status: TimerStatus) {
        prefs.edit {
            putString(KEY_STATUS, status.name)      // enum → "RUNNING" 같은 문자열
            putLong(KEY_STARTED_AT, startedAt)
            putLong(KEY_ACCUMULATED, accumulated)
        }
    }

    private fun restore() {
        val savedStatus = prefs.getString(KEY_STATUS, null) ?: return   // 저장된 적이 없으면 그대로 시작
        startedAt = prefs.getLong(KEY_STARTED_AT, 0L)
        accumulated = prefs.getLong(KEY_ACCUMULATED, 0L)

        when (TimerStatus.valueOf(savedStatus)) {   // 문자열 → enum
            TimerStatus.RUNNING -> startTicking()   // 시작 시각이 그대로라 경과 시간은 저절로 맞는다
            TimerStatus.PAUSED -> _uiState.update {
                it.copy(status = TimerStatus.PAUSED, elapsedSeconds = accumulated / 1000)
            }
            TimerStatus.IDLE -> Unit                // 할 일 없음
        }
    }
}
    </script>

package com.example.mungtimer.collection

import android.app.Application
import androidx.lifecycle.AndroidViewModel
import androidx.lifecycle.viewModelScope
import com.example.mungtimer.data.AppDatabase
import com.example.mungtimer.data.OwnedMung
import com.example.mungtimer.model.Mung
import com.example.mungtimer.model.MungCatalog
import kotlinx.coroutines.flow.SharingStarted
import kotlinx.coroutines.flow.StateFlow
import kotlinx.coroutines.flow.map
import kotlinx.coroutines.flow.stateIn

// 도감의 한 칸: 어떤 뭉을 몇 마리 가졌는지 (0이면 아직 못 얻음)
data class CollectionItem(
    val mung: Mung,
    val count: Int,
)

data class CollectionUiState(
    val items: List<CollectionItem> = emptyList(),
    val ownedKinds: Int = 0,        // 모은 종류 수
    val totalCount: Int = 0,        // 모은 마리 수
)

class CollectionViewModel(application: Application) : AndroidViewModel(application) {

    private val mungDao = AppDatabase.getInstance(application).mungDao()

    // DB의 Flow(수도관) → 도감용 상태로 변환(map) → StateFlow(전광판)로 연결(stateIn)
    val uiState: StateFlow<CollectionUiState> = mungDao.observeAll()
        .map { owned -> buildUiState(owned) }
        .stateIn(
            scope = viewModelScope,
            started = SharingStarted.WhileSubscribed(5_000),    // 화면이 보고 있을 때만 DB를 관찰 (5초 여유)
            initialValue = CollectionUiState(),                 // DB에서 첫 값이 오기 전에 보여 줄 값
        )

    // "얻은 뭉 목록" → "전체 12종 각각을 몇 마리 가졌는지"
    private fun buildUiState(owned: List<OwnedMung>): CollectionUiState {
        val items = MungCatalog.all.map { mung ->
            CollectionItem(mung = mung, count = owned.count { it.mungId == mung.id })
        }
        return CollectionUiState(
            items = items,
            ownedKinds = items.count { it.count > 0 },
            totalCount = owned.size,
        )
    }
}
    </script>

 └─ {내 uid} (문서) ··············· 내 프로필. 나만 읽고 쓴다
      ├─ nickname:  "지우"
      └─ groupCode: "K7M2QX"        ← 내가 속한 그룹

groups (컬렉션)
 └─ K7M2QX (문서) ················· 그룹. 문서 ID = 초대 코드
      ├─ name:      "새벽공부방"
      ├─ ownerUid:  "abc123…"
      └─ members (하위 컬렉션)
           ├─ {지우의 uid} (문서) ·· 멤버. 본인만 쓸 수 있고, 그룹 멤버만 읽는다
           │    ├─ nickname:       "지우"
           │    ├─ mungCount:      7
           │    ├─ featuredMungId: 10              ← 대표 뭉
           │    └─ daily: { "2026-11-09": 5400,    ← 날짜별 공부한 초
           │                "2026-11-10": 11400 }
           └─ {민서의 uid} (문서) ·· …
  </script>
  <ul>
    <li><b>초대 코드를 문서 ID로</b> 썼습니다. "코드로 그룹 찾기"가 검색 없이 <code>groups/K7M2QX</code> 문서 하나를 읽는 일이 됩니다.</li>
    <li><b>랭킹은 서버가 아니라 앱에서 계산</b>합니다. 멤버 문서들을 실시간으로 구독하고, <code>daily</code>에서 오늘(또는 이번 주 7일)의 값을 더해 정렬합니다. Day 2의 <code>sumOf</code>와 <code>sortedByDescending</code>입니다.</li>
    <li><b>내 기기의 Room이 원본, 서버는 사본</b>입니다. 타이머를 종료할 때와 그룹 화면을 열 때, Room에서 이번 주 날짜별 합계를 구해 내 멤버 문서에 <b>덮어씁니다</b>. "더하기"가 아니라 "덮어쓰기"라서 몇 번을 올려도 값이 틀어지지 않습니다.</li>
  </ul>

  <h3>4. 서버와 이야기하는 코드: <code>await()</code>와 <code>try / catch</code></h3>
  <p>서버에 요청하면 답이 오기까지 시간이 걸립니다. Firebase의 요청 뒤에 <code>.await()</code>를 붙이면 "답이 올 때까지 코루틴을 잠깐 멈췄다가, 결과를 받아 다음 줄로" 갑니다. Day 4의 <code>delay</code>, Day 5의 DB 저장과 같은 suspend 함수입니다.</p>
  <p>또 하나, 네트워크는 <b>실패할 수 있습니다</b>(인터넷 끊김, 권한 없음). 실패하면 <b>예외(Exception)</b>가 "던져지고", 아무도 받지 않으면 앱이 죽습니다. <code>try { } catch { }</code>로 받아서 사용자에게 알려 줍니다.</p>
  <script type="text/plain" class="code" data-lang="kotlin" data-title="예외 처리의 모양">
try {
    // 실패할 수 있는 일
    repository.joinGroup(code, nickname)
} catch (e: Exception) {
    // 실패했을 때: e.message 에 이유가 들어 있다
    showError(e.message)
} finally {
    // 성공하든 실패하든 마지막에 꼭 하는 일 (예: 로딩 표시 끄기)
    hideLoading()
}
  </script>

  <h3>5. 실시간 구독</h3>
  <p>Firestore는 "지금 값을 한 번 읽기"(<code>get()</code>)뿐 아니라 "<b>바뀔 때마다 알려 줘</b>"(<code>snapshots()</code>)를 지원합니다. <code>snapshots()</code>는 어제 배운 <code>Flow</code>를 돌려줍니다. 친구가 공부를 끝내면 내 화면의 랭킹이 저절로 바뀝니다. Room의 <code>Flow</code>와 쓰는 법이 같습니다.</p>

  <h3>6. 보안 규칙: 서버 쪽 문지기</h3>
  <p>Firestore는 앱에서 직접 접근하므로, 규칙이 없으면 <b>누구나 모든 데이터를 고칠 수 있습니다</b>. Firebase 콘솔에 적는 <b>보안 규칙</b>이 요청마다 "이 사람이 이 문서에 이 일을 해도 되는가"를 검사합니다. 오늘 쓰는 규칙의 뜻은 이렇습니다.</p>
  <div class="table-wrap"><table>
    <tr><th>대상</th><th>규칙</th></tr>
    <tr><td><code>users/{uid}</code></td><td>로그인한 본인만 읽고 쓸 수 있다</td></tr>
    <tr><td><code>groups/{code}</code></td><td>로그인한 사용자는 코드를 알면 그 문서 하나를 읽을 수 있다(목록 조회는 불가). 새로 만들 수만 있고 수정·삭제는 불가</td></tr>
    <tr><td><code>groups/{code}/members/{uid}</code></td><td>그 그룹의 멤버만 읽을 수 있다. 쓰기는 본인 문서만</td></tr>
  </table></div>
  <div class="note honest">이 규칙은 "남의 기록을 고치는 것"은 막지만, <b>자기 공부 시간을 부풀려 올리는 것</b>은 막지 못합니다. 그것까지 막으려면 서버 코드(Cloud Functions)가 필요합니다. 친구끼리 쓰는 앱의 범위로 받아들였습니다.</div>
</section>

  <script type="text/plain" class="code" data-lang="kotlin" data-title="Ex1.kt" data-run="d6_ex1">
import kotlinx.coroutines.delay
import kotlinx.coroutines.runBlocking

// 서버에 다녀오는 척하는 suspend 함수. 없는 코드면 예외를 "던진다"
suspend fun findGroupName(code: String): String {
    delay(300)                                        // 네트워크 왕복 시간 흉내
    if (code != "K7M2QX") {
        error("초대 코드에 해당하는 그룹이 없어요")    // error(…) = 예외를 던지는 함수
    }
    return "새벽공부방"
}

suspend fun tryJoin(code: String) {
    println("[$code] 참여 시도… (로딩 표시 켜기)")
    try {
        val name = findGroupName(code)                // 여기서 예외가 나면 아래 줄은 건너뛰고 catch로 간다
        println("'$name' 그룹에 참여했어요!")
    } catch (e: Exception) {
        println("실패: ${e.message}")                 // 앱이 죽지 않고, 이유를 보여 줄 수 있다
    } finally {
        println("(로딩 표시 끄기)")                   // 성공/실패와 상관없이 항상 실행
    }
}

fun main() = runBlocking {
    tryJoin("K7M2QX")
    tryJoin("ABCDEF")
}

  <script type="text/plain" class="code" data-lang="kotlin" data-title="group/GroupRanking.kt" data-path="app/src/main/java/com/example/mungtimer/group/GroupRanking.kt">
package com.example.mungtimer.group

import java.time.DayOfWeek
import java.time.LocalDate
import java.time.temporal.TemporalAdjusters

// 랭킹 기간. label은 화면의 버튼 글자
enum class RankPeriod(val label: String) {
    TODAY("오늘"),
    WEEK("이번 주"),
}

// 랭킹의 한 줄
data class RankRow(
    val rank: Int,
    val member: GroupMember,
    val seconds: Long,
)

// date가 속한 주(월~일)의 날짜 키 7개. 예: ["2026-11-09", …, "2026-11-15"]
fun weekKeysOf(date: LocalDate): List<String> {
    val monday = date.with(TemporalAdjusters.previousOrSame(DayOfWeek.MONDAY))   // 그 주의 월요일
    return (0L..6L).map { monday.plusDays(it).toString() }
}

// 멤버 목록 → 랭킹. 공부 시간이 많은 순서
fun buildRanking(
    members: List<GroupMember>,
    period: RankPeriod,
    today: LocalDate = LocalDate.now(),
): List<RankRow> {
    // 더해야 할 날짜들: 오늘 하루, 또는 이번 주 7일
    val keys = when (period) {
        RankPeriod.TODAY -> listOf(today.toString())
        RankPeriod.WEEK -> weekKeysOf(today)
    }
    val sorted = members
        .map { member ->
            val seconds = keys.sumOf { key -> member.daily[key] ?: 0L }   // 기록이 없는 날은 0
            RankRow(rank = 0, member = member, seconds = seconds)
        }
        .sortedByDescending { it.seconds }
    // 정렬된 순서대로 1위, 2위, … 를 매긴다. mapIndexed는 위치(index)도 함께 주는 map
    return sorted.mapIndexed { index, row -> row.copy(rank = index + 1) }
}

// 초 → "3시간 10분" / "45분"
fun formatDuration(seconds: Long): String {
    val hours = seconds / 3600
    val minutes = (seconds % 3600) / 60
    return if (hours > 0) "${hours}시간 ${minutes}분" else "${minutes}분"
}

  <h3>예제 4. Repository — Firebase와 이야기하는 코드를 한 곳에</h3>
  <p>ViewModel이 Firebase를 직접 다루면 금방 복잡해집니다. "서버와 주고받는 일"만 모아 둔 클래스를 <b>Repository(저장소)</b>라고 부릅니다. 오늘 가장 중요한 파일이니 주석을 따라 천천히 읽어 보세요.</p>
  <script type="text/plain" class="code" data-lang="kotlin" data-title="group/GroupRepository.kt" data-path="app/src/main/java/com/example/mungtimer/group/GroupRepository.kt">
package com.example.mungtimer.group

import android.content.Context
import android.util.Log
import com.example.mungtimer.data.AppDatabase
import com.example.mungtimer.data.LocalPrefs
import com.google.firebase.Firebase
import com.google.firebase.auth.auth
import com.google.firebase.firestore.DocumentReference
import com.google.firebase.firestore.DocumentSnapshot
import com.google.firebase.firestore.FieldValue
import com.google.firebase.firestore.SetOptions
import com.google.firebase.firestore.WriteBatch
import com.google.firebase.firestore.firestore
import com.google.firebase.firestore.snapshots
import kotlinx.coroutines.CancellationException
import kotlinx.coroutines.flow.Flow
import kotlinx.coroutines.flow.map
import kotlinx.coroutines.tasks.await
import java.time.LocalDate

class GroupRepository(context: Context) {

    private val auth = Firebase.auth                    // 로그인 담당
    private val firestore = Firebase.firestore          // 데이터베이스 담당
    private val database = AppDatabase.getInstance(context)
    private val localPrefs = LocalPrefs(context)

    // ── 문서의 "주소" 만들기 ──────────────────────────────────────────────
    private fun userRef(uid: String): DocumentReference =
        firestore.collection("users").document(uid)                 // users/{uid}

    private fun groupRef(code: String): DocumentReference =
        firestore.collection("groups").document(code)               // groups/{code}

    private fun memberRef(code: String, uid: String): DocumentReference =
        groupRef(code).collection("members").document(uid)          // groups/{code}/members/{uid}

    // ── 로그인 ──────────────────────────────────────────────────────────
    // 이미 로그인돼 있으면 그 uid를, 아니면 익명으로 로그인한 뒤 uid를 돌려준다
    suspend fun ensureSignedIn(): String {
        val current = auth.currentUser
        if (current != null) return current.uid

        val result = auth.signInAnonymously().await()   // await: 서버의 답이 올 때까지 기다린다
        return result.user?.uid ?: error("로그인에 실패했어요")
    }

    // ── 읽기 ────────────────────────────────────────────────────────────
    // 내가 속한 그룹의 코드. 아직 없으면 null
    suspend fun myGroupCode(): String? {
        val uid = ensureSignedIn()
        val snapshot = userRef(uid).get().await()       // 문서 한 장을 한 번 읽기
        return snapshot.getString("groupCode")          // 문서나 필드가 없으면 null
    }

    // 코드로 그룹 찾기. 없으면 null
    suspend fun findGroup(code: String): StudyGroup? {
        val snapshot = groupRef(code).get().await()
        if (!snapshot.exists()) return null
        return StudyGroup(code = code, name = snapshot.getString("name") ?: "")
    }

    // 그룹의 멤버 목록을 실시간으로 구독. 누군가의 문서가 바뀔 때마다 새 목록이 흘러나온다
    fun observeMembers(code: String): Flow<List<GroupMember>> =
        groupRef(code).collection("members")
            .snapshots()
            .map { querySnapshot -> querySnapshot.documents.map { memberFrom(it) } }

    // Firestore 문서 한 장 → GroupMember. 필드가 비어 있어도 죽지 않도록 기본값을 준다
    private fun memberFrom(snapshot: DocumentSnapshot): GroupMember {
        // daily는 { "2026-11-10": 3600, … } 모양의 Map. 숫자는 Long으로 꺼낸다
        val rawDaily = snapshot.get("daily") as? Map<*, *> ?: emptyMap<Any, Any>()
        val daily = rawDaily.entries.associate { entry ->
            entry.key.toString() to ((entry.value as? Number)?.toLong() ?: 0L)
        }
        return GroupMember(
            uid = snapshot.id,                                          // 문서 ID = uid
            nickname = snapshot.getString("nickname") ?: "이름 없는 뭉",
            featuredMungId = (snapshot.getLong("featuredMungId") ?: -1L).toInt(),
            mungCount = (snapshot.getLong("mungCount") ?: 0L).toInt(),
            daily = daily,
        )
    }

    // ── 쓰기 ────────────────────────────────────────────────────────────
    // 새 그룹을 만들고 초대 코드를 돌려준다
    suspend fun createGroup(groupName: String, nickname: String): String {
        val uid = ensureSignedIn()

        // 아직 아무도 쓰지 않는 코드가 나올 때까지 뽑는다
        var code = newInviteCode()
        while (groupRef(code).get().await().exists()) {
            code = newInviteCode()
        }

        // "그룹 문서 만들기"와 "내가 멤버로 들어가기"를 한 묶음(batch)으로 보낸다.
        // 묶음 안의 쓰기는 전부 성공하거나 전부 실패하므로, 절반만 저장되는 일이 없다
        val batch = firestore.batch()
        batch.set(
            groupRef(code),
            mapOf(                                              // mapOf("필드 이름" to 값, …)
                "name" to groupName,
                "ownerUid" to uid,
                "createdAt" to FieldValue.serverTimestamp(),    // 서버의 현재 시각
            ),
        )
        addMembership(batch, uid, code, nickname)
        batch.commit().await()                          // 묶음을 서버로 보내고 기다린다

        syncMyStats()                                   // 지금까지의 기록을 바로 올린다
        return code
    }

    // 초대 코드로 그룹에 참여한다
    suspend fun joinGroup(code: String, nickname: String) {
        val uid = ensureSignedIn()
        if (findGroup(code) == null) error("초대 코드에 해당하는 그룹이 없어요")

        val batch = firestore.batch()
        addMembership(batch, uid, code, nickname)
        batch.commit().await()

        syncMyStats()
    }

    // 묶음에 "멤버 문서 쓰기 + 내 프로필 쓰기"를 담는다 (만들기와 참여의 공통 부분)
    private fun addMembership(batch: WriteBatch, uid: String, code: String, nickname: String) {
        // SetOptions.merge(): 문서 전체를 갈아 끼우지 않고, 적은 필드만 덮어쓴다
        batch.set(memberRef(code, uid), mapOf("nickname" to nickname), SetOptions.merge())
        batch.set(userRef(uid), mapOf("groupCode" to code, "nickname" to nickname))
    }

    // 내 기기(Room)의 기록을 그룹의 내 문서에 올린다
    suspend fun syncMyStats() {
        val uid = auth.currentUser?.uid ?: return       // 로그인한 적이 없으면(그룹 화면을 연 적이 없으면) 할 일이 없다
        val code = myGroupCode() ?: return              // 그룹이 없어도 할 일이 없다

        // 이번 주 월요일부터의 날짜별 합계 → Map<날짜, 초>
        val monday = weekKeysOf(LocalDate.now()).first()
        val daily = database.studyDao().dailyTotalsSince(monday)
            .associate { total -> total.dateKey to total.seconds }

        memberRef(code, uid).set(
            mapOf(
                "daily" to daily,
                "mungCount" to database.mungDao().count(),
                "featuredMungId" to localPrefs.featuredMungId(),
            ),
            SetOptions.merge(),     // daily 안의 다른 날짜, nickname 등 나머지 필드는 그대로 둔다
        ).await()
    }

    // 실패해도 예외를 던지지 않는 버전. "되면 좋고, 안 되면 다음 기회에" 올릴 때 쓴다
    suspend fun syncMyStatsQuietly() {
        try {
            syncMyStats()
        } catch (e: CancellationException) {
            throw e                                     // 코루틴 취소는 오류가 아니므로 그대로 전달한다
        } catch (e: Exception) {
            Log.w("MungTimer", "그룹 동기화 실패: ${e.message}")
        }
    }

    // 그룹에서 나간다
    suspend fun leaveGroup() {
        val uid = ensureSignedIn()
        val code = myGroupCode() ?: return

        // 멤버 문서와 내 프로필을 한 묶음으로 지운다
        val batch = firestore.batch()
        batch.delete(memberRef(code, uid))
        batch.delete(userRef(uid))
        batch.commit().await()
    }

    // 6글자 초대 코드. 헷갈리는 글자(0과 O, 1과 I)는 뺐다
    private fun newInviteCode(): String {
        val letters = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"
        return (1..6).map { letters.random() }.joinToString("")
    }
}
  </script>
  <div class="note"><b>읽는 요령.</b> 모든 함수가 같은 리듬입니다. ① <code>ensureSignedIn()</code>으로 내 uid를 얻고 ② 문서의 주소(<code>…Ref</code>)를 만들고 ③ <code>get()</code> / <code>set()</code> 뒤에 <code>.await()</code>. 문서 여러 장을 함께 바꿔야 할 때는 <code>batch</code>(묶음)에 담아 <code>commit()</code> 한 번으로 보냅니다. 중간에 실패해 "그룹에는 들어갔는데 내 프로필에는 기록이 없는" 어긋난 상태가 생기지 않습니다. <code>as? Map&lt;*, *&gt;</code>는 "Map이면 Map으로, 아니면 null"이라는 안전한 형 변환입니다.</div>
</section>

<section class="sec" data-sec="studio">
  <p>코드보다 <b>설정이 먼저</b>입니다. A → E 순서대로 진행하세요. Firebase 콘솔은 메뉴 배치가 자주 바뀝니다. 이름이 조금 달라도 같은 뜻의 메뉴를 고르면 되고, 못 찾겠으면 콘솔 위쪽의 검색을 쓰세요.</p>

    <li>"Gemini in Firebase"와 <b>Google 애널리틱스</b>는 오늘 필요 없으니 <b>사용 안 함</b>으로 두고 <b>프로젝트 만들기</b>.</li>
  </ol>

  <h3>B. 안드로이드 앱 등록하고 <code>google-services.json</code> 넣기</h3>

    <li><b>google-services.json 다운로드</b>를 누릅니다.</li>
    <li>안드로이드 스튜디오의 Project 창 위쪽 드롭다운을 <b>Android → Project</b>로 바꾸고, 내려받은 파일을 <b><code>MungTimer/app/</code> 폴더</b>(<code>build.gradle.kts</code>와 <code>src</code>가 보이는 곳)에 끌어다 놓습니다. 확인 후 드롭다운을 다시 <b>Android</b>로 돌려놓습니다.</li>
    <li>콘솔의 나머지 단계(SDK 추가 안내)는 <b>다음</b>을 눌러 넘어갑니다. 아래 C에서 직접 합니다.</li>
  </ol>
  <div class="note warn">파일 이름이 정확히 <code>google-services.json</code>이어야 합니다. 여러 번 받아서 <code>google-services (1).json</code>이 되었다면 이름을 고치세요. 이 파일에는 비밀번호 같은 비밀 값은 없지만, 내 Firebase 프로젝트의 주소가 들어 있습니다.</div>

  <h3>C. Gradle에 Firebase 추가하기</h3>
  <ol class="steps">
    <li><span class="menu-path">build.gradle.kts (Project: MungTimer)</span>의 <code>plugins { }</code>에 한 줄 추가:
      <script type="text/plain" class="code" data-lang="kts" data-title="build.gradle.kts (Project: MungTimer)" data-hl="5-6">

// … android { } 블록은 그대로 …

    // Day 6: Firebase
    implementation(platform("com.google.firebase:firebase-bom:35.1.0"))   // 버전 묶음표: 아래 두 줄의 버전을 알아서 맞춰 준다
    implementation("com.google.firebase:firebase-auth")                   // 로그인

  </ol>

  <h3>D. 익명 로그인 켜기</h3>
  <ol class="steps">
    <li>Firebase 콘솔 왼쪽 메뉴에서 <b>Authentication</b>을 엽니다(메뉴 묶음 이름은 <b>Security</b> 또는 <b>빌드</b>). <b>시작하기</b>를 누릅니다.</li>
    <li><b>로그인 방법</b>(Sign-in method) 탭 → <b>익명</b>(Anonymous) → <b>사용 설정</b> 스위치를 켜고 <b>저장</b>.</li>
  </ol>

  <h3>E. Firestore 만들고 보안 규칙 넣기</h3>
  <ol class="steps">
    <li>왼쪽 메뉴에서 <b>Firestore</b>(묶음 이름은 <b>Databases &amp; Storage</b> 또는 <b>빌드</b>)를 열고 <b>데이터베이스 만들기</b>.</li>
    <li>위치는 <b>asia-northeast3 (Seoul)</b>을 고릅니다. 나중에 바꿀 수 없습니다.</li>
    <li>보안 규칙은 <b>프로덕션 모드</b>로 시작을 고르고 <b>만들기</b>. (테스트 모드는 30일 동안 누구나 읽고 쓸 수 있는 규칙이라 권하지 않습니다.)</li>
    <li>만들어지면 위쪽 <b>규칙</b>(Rules) 탭을 열고, 내용을 모두 지운 뒤 아래 규칙을 붙여 넣고 <b>게시</b>(Publish).</li>
  </ol>
  <script type="text/plain" class="code" data-lang="rules" data-title="Firestore 보안 규칙">
rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

    // 내 프로필: 로그인한 본인만 읽고 쓸 수 있다
    match /users/{uid} {
      allow read, write: if request.auth != null && request.auth.uid == uid;
    }

    match /groups/{code} {
      // 로그인한 사용자는 코드를 알면 그 그룹 문서 하나를 읽을 수 있다 (전체 목록 조회는 불가)
      allow get: if request.auth != null;
      // 새 그룹 만들기만 허용한다. 수정과 삭제는 불가
      allow create: if request.auth != null;

      match /members/{uid} {
        // 멤버 목록은 그 그룹의 멤버만 읽을 수 있다
        allow read: if request.auth != null
          && exists(/databases/$(database)/documents/groups/$(code)/members/$(request.auth.uid));
        // 멤버 문서는 본인 것만 만들고, 고치고, 지울 수 있다
        allow write: if request.auth != null && request.auth.uid == uid;
      }
    }
  }
}
  </script>

  <h3>F. 기기가 한 대뿐일 때: 콘솔에서 가짜 멤버 넣기</h3>
  <ol class="steps">
    <li>앱에서 그룹을 만든 뒤, 콘솔의 Firestore <b>데이터</b> 탭에서 <span class="menu-path">groups → (내 초대 코드) → members</span>를 엽니다. 내 문서가 보입니다.</li>
    <li><b>문서 추가</b> → 문서 ID에 <code>fake-minseo</code> → 필드 추가: <code>nickname</code>(string) = <code>민서</code>, <code>mungCount</code>(number) = <code>3</code>, <code>featuredMungId</code>(number) = <code>6</code>, <code>daily</code>(map) 안에 오늘 날짜(예: <code>2026-11-10</code>, number) = <code>5400</code>.</li>
    <li>저장하는 순간 앱의 랭킹에 "민서 · 1시간 30분"이 나타납니다. 실시간 구독이 동작하는 것입니다. (콘솔은 관리자 권한이라 보안 규칙을 건너뜁니다.)</li>
  </ol>

  <h3>자주 만나는 오류</h3>
  <div class="table-wrap"><table>
    <tr><th>오류 메시지 (Build 창 / Logcat / 앱 화면)</th><th>원인과 해결</th></tr>
    <tr><td><code>File google-services.json is missing</code></td><td>파일 위치가 틀렸습니다. <code>app/</code> 폴더 바로 아래에 있어야 합니다(B-4).</td></tr>
    <tr><td><code>No matching client found for package name</code></td><td>콘솔에 등록한 패키지 이름과 <code>applicationId</code>가 다릅니다. 콘솔의 프로젝트 설정에서 맞는 이름으로 앱을 다시 추가하고 json을 새로 받으세요.</td></tr>
    <tr><td><code>PERMISSION_DENIED: Missing or insufficient permissions</code></td><td>보안 규칙에 막혔습니다. 규칙을 그대로 붙여 넣고 <b>게시</b>했는지(E-4), 익명 로그인을 켰는지(D) 확인하세요.</td></tr>
    <tr><td>로그인 실패, <code>ADMIN_ONLY_OPERATION</code> 또는 <code>sign-in provider is disabled</code></td><td>익명 로그인이 꺼져 있습니다(D).</td></tr>
    <tr><td>로딩 표시가 끝없이 돈다</td><td>기기가 인터넷에 연결되지 않았습니다. Firestore의 쓰기는 연결될 때까지 기다립니다. 에뮬레이터의 Wi-Fi를 확인하세요.</td></tr>
    <tr><td>에뮬레이터에서만 로그인이 안 된다</td><td>Google Play 서비스가 없는 시스템 이미지입니다. Day 3의 안내대로 <b>Play Store 아이콘이 있는 기기</b>로 새로 만드세요.</td></tr>
  </table></div>
  <div class="note">Logcat 검색 칸에 <code>package:mine level:warn</code>을 넣으면 Firebase가 남기는 경고와 우리가 <code>Log.w("MungTimer", …)</code>로 남긴 기록을 함께 볼 수 있습니다.</div>

<section class="sec" data-sec="quiz">
  <div class="q" data-type="mc" data-answer="3">
    <p class="q-title">Firestore의 구조에 대한 설명으로 알맞은 것은?</p>
    <ul class="q-options">
      <li>표(table)와 줄(row)로 이루어져 있고 SQL로 질문한다</li>
      <li>문서 안에 컬렉션이 있고, 컬렉션 안에 필드가 있다</li>
      <li>컬렉션 안에 문서가 있고, 문서 안에 필드가 있다. 문서는 하위 컬렉션을 가질 수 있다</li>
      <li>파일 하나에 모든 데이터를 JSON으로 저장한다</li>
    </ul>
    <div class="q-explain"><p>서랍(컬렉션) → 서류(문서) → 항목(필드)입니다. <code>groups/K7M2QX/members/{uid}</code>는 "groups 서랍의 K7M2QX 서류에 붙은 members 서랍의 {uid} 서류"입니다.</p></div>
  </div>

  <div class="q" data-type="fill" data-answer="await">
    <p class="q-title">서버의 답이 올 때까지 코루틴을 멈췄다가 결과를 받으려고 합니다. 빈칸은?</p>
    <script type="text/plain" class="code" data-lang="kotlin">
val result = auth.signInAnonymously().____()
val uid = result.user?.uid
    </script>
    <div class="q-explain"><p><code>await()</code>입니다. Firebase의 요청(Task)을 suspend 방식으로 기다리게 해 주며, <code>kotlinx-coroutines-play-services</code> 라이브러리가 제공합니다. 실패하면 예외를 던집니다.</p></div>
  </div>

  <div class="q" data-type="mc" data-answer="2">
    <p class="q-title">익명 로그인에 대한 설명으로 <b>틀린</b> 것은?</p>
    <ul class="q-options">
      <li>가입 화면 없이 사용자마다 고유한 uid를 받을 수 있다</li>
      <li>앱을 삭제했다 다시 설치해도 항상 같은 uid를 받는다</li>
      <li>보안 규칙에서 <code>request.auth.uid</code>로 본인인지 확인할 수 있다</li>
      <li>Firebase 콘솔에서 익명 로그인을 켜 두어야 동작한다</li>
    </ul>
    <div class="q-explain"><p>앱을 삭제하면 기기에 저장된 로그인 정보가 사라져, 다시 설치하면 <b>새 uid</b>를 받습니다. 그룹 소속도 새로 시작됩니다. 이를 막으려면 익명 계정을 이메일/구글 계정에 "연결"해야 합니다.</p></div>
  </div>

  <div class="q" data-type="mc" data-answer="4">
    <p class="q-title"><code>google-services.json</code> 파일을 넣어야 하는 위치는?</p>
    <ul class="q-options">
      <li>프로젝트 최상위 폴더 (<code>MungTimer/</code>)</li>
      <li><code>app/src/main/java/</code></li>
      <li><code>app/src/main/res/</code></li>
      <li>앱 모듈 폴더 (<code>MungTimer/app/</code>)</li>
    </ul>
    <div class="q-explain"><p><code>app/build.gradle.kts</code>와 같은 폴더입니다. 다른 곳에 두면 빌드할 때 "google-services.json is missing" 오류가 납니다.</p></div>
  </div>

  <div class="q" data-type="fill" data-answer="merge">
    <p class="q-title">문서의 다른 필드는 그대로 두고 <code>mungCount</code>만 덮어쓰려고 합니다. 빈칸은?</p>
    <script type="text/plain" class="code" data-lang="kotlin">
memberRef(code, uid)
    .set(mapOf("mungCount" to 8), SetOptions.____())
    .await()
    </script>
    <div class="q-explain"><p><code>SetOptions.merge()</code>가 없으면 문서 전체가 <code>{ mungCount: 8 }</code>로 교체되어 닉네임과 공부 기록이 사라집니다. <code>merge()</code>를 주면 적은 필드만 합쳐집니다.</p></div>
  </div>

  <div class="q" data-type="mc" data-answer="1">
    <p class="q-title">보안 규칙 <code>allow write: if request.auth != null &amp;&amp; request.auth.uid == uid;</code>의 뜻은?</p>
    <ul class="q-options">
      <li>로그인했고, 문서 ID(uid)가 요청한 사람의 uid와 같을 때만 쓸 수 있다</li>
      <li>로그인한 사람이면 누구의 문서든 쓸 수 있다</li>
      <li>아무도 쓸 수 없다</li>
      <li>앱에서 이 조건을 직접 검사해야 한다</li>
    </ul>
    <div class="q-explain"><p>규칙은 <b>서버에서</b> 검사됩니다. 앱 코드를 고쳐서 남의 문서에 쓰려고 해도 서버가 <code>PERMISSION_DENIED</code>로 거절합니다.</p></div>

  <details class="hint"><summary>힌트 1 — 공통 처리 함수</summary>
    <p><code>private fun runTask(task: suspend () -&gt; Unit)</code>을 만들어 <code>viewModelScope.launch { 로딩 켜기; try { task() } catch (e: Exception) { 오류 문구 저장 } finally { 로딩 끄기 } }</code>로 감쌉니다. <code>suspend () -&gt; Unit</code>은 "suspend 함수를 부를 수 있는 람다" 타입입니다. 그러면 <code>fun joinGroup(…) { runTask { repository.joinGroup(…); loadMyGroup() } }</code>처럼 짧게 쓸 수 있습니다.</p>

  <details class="hint"><summary>힌트 2 — 내 그룹 불러오기와 구독</summary>

  </details>
  <details class="hint"><summary>힌트 3 — 입력 칸</summary>

  <details class="hint"><summary>힌트 4 — 공유 창 띄우기</summary>

package com.example.mungtimer.group

import android.app.Application
import androidx.lifecycle.AndroidViewModel
import androidx.lifecycle.viewModelScope
import kotlinx.coroutines.CancellationException
import kotlinx.coroutines.Job
import kotlinx.coroutines.flow.MutableStateFlow
import kotlinx.coroutines.flow.StateFlow
import kotlinx.coroutines.flow.asStateFlow
import kotlinx.coroutines.flow.catch
import kotlinx.coroutines.flow.update
import kotlinx.coroutines.launch

data class GroupUiState(
    val isFirstLoad: Boolean = true,                // 앱을 켜고 처음 불러오는 중인가
    val isLoading: Boolean = true,                  // 서버 작업 중인가
    val myUid: String = "",
    val group: StudyGroup? = null,                  // null이면 아직 그룹이 없다
    val members: List<GroupMember> = emptyList(),
    val period: RankPeriod = RankPeriod.TODAY,
    val errorMessage: String? = null,
)

class GroupViewModel(application: Application) : AndroidViewModel(application) {

    private val repository = GroupRepository(application)

    private val _uiState = MutableStateFlow(GroupUiState())
    val uiState: StateFlow<GroupUiState> = _uiState.asStateFlow()

    private var membersJob: Job? = null             // 멤버 실시간 구독의 리모컨

    init {
        refresh()
    }

    // 로그인하고 내 그룹을 불러온다
    fun refresh() {
        runTask { loadMyGroup() }
    }

    fun createGroup(groupName: String, nickname: String) {
        runTask {
            if (groupName.isBlank() || nickname.isBlank()) error("닉네임과 그룹 이름을 입력해 주세요")
            repository.createGroup(groupName.trim(), nickname.trim())
            loadMyGroup()
        }
    }

    fun joinGroup(code: String, nickname: String) {
        runTask {
            if (code.isBlank() || nickname.isBlank()) error("닉네임과 초대 코드를 입력해 주세요")
            repository.joinGroup(code.trim().uppercase(), nickname.trim())
            loadMyGroup()
        }
    }

    fun leaveGroup() {
        runTask {
            membersJob?.cancel()                    // 나가기 전에 구독부터 끊는다 (나간 뒤에는 읽을 권한이 없다)
            repository.leaveGroup()
            loadMyGroup()
        }
    }

    fun selectPeriod(period: RankPeriod) {
        _uiState.update { it.copy(period = period) }
    }

    private suspend fun loadMyGroup() {
        val uid = repository.ensureSignedIn()
        val code = repository.myGroupCode()
        val group = if (code == null) null else repository.findGroup(code)
        _uiState.update {
            it.copy(myUid = uid, group = group, members = if (group == null) emptyList() else it.members)
        }

        membersJob?.cancel()                        // 구독이 겹치지 않게 이전 것은 끊는다
        if (group != null) {
            membersJob = viewModelScope.launch {
                repository.observeMembers(group.code)
                    .catch { e -> _uiState.update { it.copy(errorMessage = e.message) } }   // 구독 중 오류
                    .collect { members -> _uiState.update { it.copy(members = members) } }
            }
            // 내 최신 기록 올리기. 결과를 기다리지 않도록 따로 launch
            viewModelScope.launch { repository.syncMyStatsQuietly() }
        }
    }

    // 서버 작업의 공통 처리: 로딩 켜기 → 작업 → 실패하면 오류 문구 → 로딩 끄기
    // task: suspend () -> Unit  =  "suspend 함수를 부를 수 있는 람다"
    private fun runTask(task: suspend () -> Unit) {
        viewModelScope.launch {
            _uiState.update { it.copy(isLoading = true, errorMessage = null) }
            try {
                task()
            } catch (e: CancellationException) {
                throw e                             // 코루틴 취소는 오류가 아니므로 그대로 전달한다
            } catch (e: Exception) {
                _uiState.update { it.copy(errorMessage = e.message ?: "알 수 없는 오류가 발생했어요") }
            } finally {
                _uiState.update { it.copy(isLoading = false, isFirstLoad = false) }
            }
        }
    }
}
    </script>

        ) {
            Text("참여하기")
        }
    }
}

// 그룹이 있을 때: 그룹 정보 + 기간 선택 + 랭킹
@Composable
fun GroupBoard(
    group: StudyGroup,
    ranking: List<RankRow>,
    myUid: String,
    period: RankPeriod,
    onSelectPeriod: (RankPeriod) -> Unit,
    onLeave: () -> Unit,
    modifier: Modifier = Modifier,
) {
    val context = LocalContext.current                      // 다른 앱(공유 창)을 띄울 때 필요

    Column(modifier = modifier.fillMaxSize()) {
        Text(text = group.name, style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.Bold)
        Row(verticalAlignment = Alignment.CenterVertically) {
            Text(text = "초대 코드 ${group.code}")
            TextButton(onClick = {
                // 공유 창 띄우기: 카카오톡, 메시지 등으로 코드를 보낼 수 있다
                val intent = Intent(Intent.ACTION_SEND)
                intent.type = "text/plain"
                intent.putExtra(
                    Intent.EXTRA_TEXT,
                    "뭉타이머 그룹 '${group.name}'에서 같이 공부해요! 초대 코드: ${group.code}",
                )
                context.startActivity(Intent.createChooser(intent, "초대 코드 보내기"))
            }) {
                Text("초대하기")
            }
        }

        // 오늘 / 이번 주 선택. entries로 enum의 모든 값을 돌며 칩을 만든다
        Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
            for (option in RankPeriod.entries) {
                FilterChip(
                    selected = period == option,
                    onClick = { onSelectPeriod(option) },
                    label = { Text(option.label) },
                )
            }
        }
        Spacer(modifier = Modifier.height(8.dp))

        // LazyColumn: 화면에 보이는 줄만 그리는 세로 목록. weight(1f) = 남는 높이를 모두 차지
        LazyColumn(
            modifier = Modifier.weight(1f),
            verticalArrangement = Arrangement.spacedBy(8.dp),
        ) {
            items(items = ranking, key = { it.member.uid }) { row ->
                RankItem(row = row, isMe = row.member.uid == myUid)
            }
        }

        TextButton(onClick = onLeave, modifier = Modifier.align(Alignment.CenterHorizontally)) {
            Text("그룹 나가기")
        }
    }
}

@Composable
fun RankItem(row: RankRow, isMe: Boolean, modifier: Modifier = Modifier) {
    val member = row.member
    val featured = MungCatalog.findById(member.featuredMungId)     // 대표 뭉. 정하지 않았으면 null

        2 -> "🥈"
        3 -> "🥉"

        "뭉 ${member.mungCount}마리"

    Row(

            .fillMaxWidth()
            .clip(RoundedCornerShape(16.dp))
            .background(

        verticalAlignment = Alignment.CenterVertically,
    ) {
        Text(text = medal, fontSize = 22.sp, textAlign = TextAlign.Center, modifier = Modifier.width(36.dp))

        // 대표 뭉 (자랑!) — 없으면 알 모양
        Box(
            modifier = Modifier
                .size(44.dp)
                .clip(CircleShape)
                .background(
                    if (featured != null) Color(featured.grade.colorHex) else MaterialTheme.colorScheme.outlineVariant

        Column(modifier = Modifier.weight(1f)) {            // weight(1f): 남는 가로 공간을 모두 차지

                fontWeight = FontWeight.Bold,
                maxLines = 1,
            )
            Text(text = subtitle, style = MaterialTheme.typography.labelMedium)
        }

        Text(text = formatDuration(row.seconds), fontWeight = FontWeight.Bold)
    }

package com.example.mungtimer.collection

import android.app.Application
import androidx.lifecycle.AndroidViewModel
import androidx.lifecycle.viewModelScope
import com.example.mungtimer.data.AppDatabase
import com.example.mungtimer.data.LocalPrefs
import com.example.mungtimer.data.NO_FEATURED_MUNG
import com.example.mungtimer.data.OwnedMung
import com.example.mungtimer.group.GroupRepository
import com.example.mungtimer.model.Mung
import com.example.mungtimer.model.MungCatalog
import kotlinx.coroutines.flow.MutableStateFlow
import kotlinx.coroutines.flow.SharingStarted
import kotlinx.coroutines.flow.StateFlow
import kotlinx.coroutines.flow.combine
import kotlinx.coroutines.flow.stateIn
import kotlinx.coroutines.launch

// 도감의 한 칸: 어떤 뭉을 몇 마리 가졌는지 (0이면 아직 못 얻음)
data class CollectionItem(
    val mung: Mung,
    val count: Int,
)

data class CollectionUiState(
    val items: List<CollectionItem> = emptyList(),
    val ownedKinds: Int = 0,        // 모은 종류 수
    val totalCount: Int = 0,        // 모은 마리 수
    val featuredMungId: Int = NO_FEATURED_MUNG,     // 내 대표 뭉
)

class CollectionViewModel(application: Application) : AndroidViewModel(application) {

    private val mungDao = AppDatabase.getInstance(application).mungDao()
    private val localPrefs = LocalPrefs(application)
    private val groupRepository = GroupRepository(application)

    // 대표 뭉 id도 "바뀌면 알려 주는 값"이 되도록 StateFlow에 담아 둔다
    private val featuredMungId = MutableStateFlow(localPrefs.featuredMungId())

    // combine: 두 Flow 중 하나라도 바뀌면, 둘의 최신 값으로 다시 계산한다
    val uiState: StateFlow<CollectionUiState> =
        combine(mungDao.observeAll(), featuredMungId) { owned, featuredId ->
            buildUiState(owned, featuredId)
        }.stateIn(
            scope = viewModelScope,
            started = SharingStarted.WhileSubscribed(5_000),    // 화면이 보고 있을 때만 DB를 관찰 (5초 여유)
            initialValue = CollectionUiState(),                 // DB에서 첫 값이 오기 전에 보여 줄 값
        )

    // 대표 뭉 정하기: 기기에 저장 → 화면 갱신 → 그룹에 올리기
    fun setFeatured(mungId: Int) {
        localPrefs.setFeaturedMungId(mungId)
        featuredMungId.value = mungId
        viewModelScope.launch { groupRepository.syncMyStatsQuietly() }
    }

    // "얻은 뭉 목록" → "전체 12종 각각을 몇 마리 가졌는지"
    private fun buildUiState(owned: List<OwnedMung>, featuredId: Int): CollectionUiState {
        val items = MungCatalog.all.map { mung ->
            CollectionItem(mung = mung, count = owned.count { it.mungId == mung.id })
        }
        return CollectionUiState(
            items = items,
            ownedKinds = items.count { it.count > 0 },
            totalCount = owned.size,
            featuredMungId = featuredId,
        )
    }
}

package com.example.mungtimer.timer

import android.app.Application
import android.content.Context
import androidx.core.content.edit
import androidx.lifecycle.AndroidViewModel
import androidx.lifecycle.viewModelScope
import com.example.mungtimer.data.AppDatabase
import com.example.mungtimer.data.OwnedMung
import com.example.mungtimer.data.StudySession
import com.example.mungtimer.data.todayKey
import com.example.mungtimer.group.GroupRepository
import com.example.mungtimer.model.Mung
import com.example.mungtimer.model.MungGacha
import kotlinx.coroutines.Job
import kotlinx.coroutines.delay
import kotlinx.coroutines.flow.MutableStateFlow
import kotlinx.coroutines.flow.StateFlow
import kotlinx.coroutines.flow.asStateFlow
import kotlinx.coroutines.flow.update
import kotlinx.coroutines.isActive
import kotlinx.coroutines.launch

// 저장할 때 쓰는 이름표들
private const val KEY_STATUS = "status"
private const val KEY_STARTED_AT = "startedAt"
private const val KEY_ACCUMULATED = "accumulated"

// 종료 결과: 공부한 시간과, 나온 뭉 (30분 미만이면 null)
data class FinishResult(
    val studySeconds: Long,
    val mung: Mung?,
)

// 타이머 화면에 필요한 모든 값
data class TimerUiState(
    val status: TimerStatus = TimerStatus.IDLE,
    val elapsedSeconds: Long = 0,
    val result: FinishResult? = null,       // 방금 종료한 결과. null이면 결과 창을 띄우지 않는다
)

// AndroidViewModel: 저장소를 쓰기 위해 Application(앱 전체를 대표하는 객체)을 받는 ViewModel
class TimerViewModel(application: Application) : AndroidViewModel(application) {

    // 값 몇 개를 기기에 저장하는 작은 메모장
    private val prefs = application.getSharedPreferences("timer", Context.MODE_PRIVATE)

    // 데이터베이스의 사서(DAO) 두 명
    private val database = AppDatabase.getInstance(application)
    private val mungDao = database.mungDao()
    private val studyDao = database.studyDao()

    // 그룹(Firebase)에 내 기록을 올려 주는 저장소
    private val groupRepository = GroupRepository(application)

    private val _uiState = MutableStateFlow(TimerUiState())
    val uiState: StateFlow<TimerUiState> = _uiState.asStateFlow()

    private var startedAt = 0L          // 지금 구간을 시작한 시각(ms). 멈춰 있으면 0
    private var accumulated = 0L        // 이전 구간들에서 쌓인 시간(ms)
    private var tickJob: Job? = null    // 화면 갱신 코루틴의 리모컨

    init {
        restore()                       // ViewModel이 만들어질 때 저장된 타이머를 이어 간다
    }

    fun start() {
        if (_uiState.value.status == TimerStatus.RUNNING) return
        startedAt = System.currentTimeMillis()      // 시각을 적어 둔다
        save(TimerStatus.RUNNING)
        startTicking()
    }

    fun pause() {
        if (_uiState.value.status != TimerStatus.RUNNING) return
        tickJob?.cancel()
        accumulated = elapsedMillis()               // 지금까지의 시간을 쌓아 두고
        startedAt = 0L                              // 멈춤 표시
        save(TimerStatus.PAUSED)
        _uiState.update { it.copy(status = TimerStatus.PAUSED, elapsedSeconds = accumulated / 1000) }
    }

    fun finish() {
        if (_uiState.value.status == TimerStatus.IDLE) return
        tickJob?.cancel()
        val totalSeconds = elapsedMillis() / 1000   // 초기화하기 전에 총 시간을 먼저 구한다
        startedAt = 0L
        accumulated = 0L
        save(TimerStatus.IDLE)
        _uiState.update { TimerUiState() }          // 화면은 바로 처음 상태로

        // DB 저장은 suspend 함수 → 코루틴 안에서
        viewModelScope.launch {
            val now = System.currentTimeMillis()

            // ① 공부 기록 저장 (내일 그룹 랭킹의 재료)
            if (totalSeconds > 0) {
                studyDao.insert(StudySession(dateKey = todayKey(), seconds = totalSeconds, endedAt = now))
            }

            // ② 30분 이상이면 뭉을 뽑아 도감에 저장
            val mung = if (canGetMung(totalSeconds)) MungGacha.draw(totalSeconds / 60) else null
            if (mung != null) {
                mungDao.insert(
                    OwnedMung(mungId = mung.id, obtainedAt = now, studyMinutes = (totalSeconds / 60).toInt())
                )
            }

            // ③ 결과 창 띄우기
            _uiState.update { it.copy(result = FinishResult(totalSeconds, mung)) }

            // ④ 그룹에 내 기록 올리기. 결과 창을 먼저 띄운 뒤에 한다 (인터넷이 느려도 기다리지 않게)
            groupRepository.syncMyStatsQuietly()
        }
    }

    // 결과 창을 닫는다
    fun dismissResult() {
        _uiState.update { it.copy(result = null) }
    }

    // 경과 시간(ms) = 쌓인 시간 + (지금 − 시작 시각)
    private fun elapsedMillis(): Long {
        if (startedAt == 0L) return accumulated
        val runningPart = System.currentTimeMillis() - startedAt
        return accumulated + runningPart.coerceAtLeast(0L)   // 기기 시계가 뒤로 바뀌어도 음수는 되지 않게
    }

    // 0.5초마다 시계를 다시 읽어 화면 상태를 갱신한다. "세는" 것이 아니라 "읽는" 것!
    private fun startTicking() {
        tickJob?.cancel()
        tickJob = viewModelScope.launch {
            while (isActive) {
                _uiState.update {
                    it.copy(status = TimerStatus.RUNNING, elapsedSeconds = elapsedMillis() / 1000)
                }
                delay(500)
            }
        }
    }

    private fun save(status: TimerStatus) {
        prefs.edit {
            putString(KEY_STATUS, status.name)      // enum → "RUNNING" 같은 문자열
            putLong(KEY_STARTED_AT, startedAt)
            putLong(KEY_ACCUMULATED, accumulated)
        }
    }

    private fun restore() {
        val savedStatus = prefs.getString(KEY_STATUS, null) ?: return   // 저장된 적이 없으면 그대로 시작
        startedAt = prefs.getLong(KEY_STARTED_AT, 0L)
        accumulated = prefs.getLong(KEY_ACCUMULATED, 0L)

        when (TimerStatus.valueOf(savedStatus)) {   // 문자열 → enum
            TimerStatus.RUNNING -> startTicking()   // 시작 시각이 그대로라 경과 시간은 저절로 맞는다
            TimerStatus.PAUSED -> _uiState.update {
                it.copy(status = TimerStatus.PAUSED, elapsedSeconds = accumulated / 1000)
            }
            TimerStatus.IDLE -> Unit                // 할 일 없음
        }
    }
}
    </script>

package com.example.mungtimer.group

<section class="sec" data-sec="concept">
  <h3>1. 임시 탭 전환의 문제</h3>
  <p>지금 앱에서 <b>도감 탭을 연 뒤 폰의 뒤로 가기</b>를 해 보세요. 타이머로 돌아가지 않고 <b>앱이 닫힙니다</b>. Day 5의 방식은 "지금 몇 번 탭인가"라는 숫자 하나만 기억할 뿐, "어디를 거쳐 왔는가"를 모르기 때문입니다. 안드로이드 사용자는 뒤로 가기가 <b>직전 화면</b>으로 데려다주기를 기대합니다.</p>

  <h3>2. 백 스택: 화면을 쌓아 둔 목록</h3>
  <div class="note analogy"><b>비유 — 접시 쌓기.</b> 새 화면으로 가면 접시를 한 장 <b>위에 올리고</b>, 뒤로 가면 맨 위 접시를 <b>내립니다</b>. 지금 보이는 화면은 항상 맨 위 접시입니다. 접시가 한 장 남았을 때 뒤로 가면 앱이 닫힙니다. 이 더미를 <b>백 스택(back stack)</b>이라고 합니다.</div>

  <h3>3. Navigation 3: "백 스택은 내가 가진 목록이다"</h3>
  <p>Navigation 3는 Compose를 위해 새로 만들어진 화면 이동 라이브러리입니다. 핵심 생각은 아주 단순합니다. <b>백 스택은 그냥 목록(List)이고, 그 목록의 주인은 나</b>입니다. 목록에 넣으면 앞으로 가고, 빼면 뒤로 갑니다. Day 2의 <code>MutableList</code>와 Day 3의 "상태가 바뀌면 화면이 바뀐다"가 합쳐진 것입니다.</p>
  <div class="table-wrap"><table>
    <tr><th>요소</th><th>역할</th><th>뭉타이머에서</th></tr>
    <tr><td><b>키(key)</b></td><td>화면을 가리키는 이름표. 어떤 타입이든 될 수 있다</td><td><code>enum class Screen { TIMER, COLLECTION, GROUP }</code></td></tr>
    <tr><td><b>백 스택</b></td><td>키를 쌓아 둔, Compose가 지켜보는 목록</td><td><code>mutableStateListOf(Screen.TIMER)</code></td></tr>
    <tr><td><code>NavDisplay</code></td><td>백 스택의 <b>맨 위 키</b>에 해당하는 화면을 보여 주고, 뒤로 가기 제스처를 받아 준다</td><td><code>Scaffold</code> 안쪽에 배치</td></tr>
    <tr><td><code>entryProvider</code></td><td>"이 키면 이 화면"을 알려 주는 함수</td><td><code>when (key) { Screen.TIMER -&gt; … }</code></td></tr>
  </table></div>
  <div class="note"><b>인터넷에서 <code>NavHost</code>, <code>NavController</code>, <code>route</code>가 나오는 글을 봤다면</b> — 그것은 이전 세대인 Navigation 2(Navigation Compose)입니다. 지금은 새 기능이 추가되지 않는 유지보수 단계이고, Compose 앱에는 Navigation 3가 권장됩니다. 개념은 그대로 대응됩니다: <code>NavController</code> ↔ 백 스택 목록, <code>NavHost</code> ↔ <code>NavDisplay</code>, <code>route</code> ↔ 키.</div>

  <h3>4. 하단 탭의 백 스택 규칙</h3>
  <p>탭이 3개인 뭉타이머는 규칙을 하나만 정하면 됩니다. <b>백 스택은 항상 <code>[타이머]</code> 또는 <code>[타이머, 다른 탭]</code></b>.</p>
  <div class="table-wrap"><table>
    <tr><th>사용자 행동</th><th>백 스택</th><th>보이는 화면</th></tr>
    <tr><td>앱 실행</td><td><code>[타이머]</code></td><td>타이머</td></tr>
    <tr><td>도감 탭 누름</td><td><code>[타이머, 도감]</code></td><td>도감</td></tr>
    <tr><td>그룹 탭 누름</td><td><code>[타이머, 그룹]</code> <small>(도감을 내리고 그룹을 올림)</small></td><td>그룹</td></tr>
    <tr><td>뒤로 가기</td><td><code>[타이머]</code></td><td>타이머</td></tr>
    <tr><td>뒤로 가기</td><td>더 내릴 것이 없음</td><td>앱이 닫힘</td></tr>
  </table></div>
  <p>탭을 이리저리 눌러도 접시가 끝없이 쌓이지 않고, 어디서든 뒤로 가기 한 번이면 타이머로, 한 번 더 누르면 앱이 닫힙니다.</p>

  <h3>5. 백 스택은 어디에 둘까</h3>
  <p>Day 4의 복습입니다. 백 스택을 <code>remember</code>로 만들면 화면을 회전할 때 사라져서 타이머 탭으로 돌아가 버립니다. 회전해도 살아남아야 하는 상태는 <b>ViewModel</b>에 둡니다. 그래서 <code>NavViewModel</code>을 만들어 백 스택과 "탭 선택 / 뒤로 가기" 규칙을 맡깁니다.</p>
  <div class="note honest">ViewModel도 앱(프로세스)이 종료되면 사라지므로, 앱이 완전히 꺼졌다 켜지면 타이머 탭에서 시작합니다. 탭 3개짜리 앱에서는 자연스러운 동작입니다. 종료 후에도 보던 화면을 복원하려면 Navigation 3의 <code>rememberNavBackStack()</code>과 kotlinx.serialization 플러그인을 써야 하는데, 설정이 늘어나 7일 범위에서는 뺐습니다.</div>

  <h3>6. 테마: 색에 "역할"을 주기</h3>
  <p>지금까지 <code>MaterialTheme.colorScheme.primaryContainer</code>처럼 색을 <b>역할 이름</b>으로 써 왔습니다. <code>Color(0xFF…)</code>를 화면마다 직접 적지 않은 덕분에, 오늘 <code>Theme.kt</code>에서 역할에 연결된 색만 바꾸면 <b>모든 화면이 한꺼번에</b> 뭉 색감으로 바뀌고 다크 모드도 자동으로 대응됩니다.</p>
  <div class="table-wrap"><table>
    <tr><th>역할</th><th>쓰이는 곳</th></tr>
    <tr><td><code>primary</code> / <code>onPrimary</code></td><td>주요 버튼의 배경 / 그 위의 글자</td></tr>
    <tr><td><code>primaryContainer</code></td><td>뭉 얼굴의 동그란 배경, 랭킹의 내 줄</td></tr>
    <tr><td><code>secondaryContainer</code></td><td>하단 탭에서 선택된 탭의 표시</td></tr>
    <tr><td><code>background</code> / <code>surface</code></td><td>화면 바탕</td></tr>
    <tr><td><code>surfaceVariant</code></td><td>도감 칸, 랭킹 줄의 배경</td></tr>
  </table></div>
  <p>마법사가 만든 테마는 <b>다이내믹 컬러</b>(Android 12 이상에서 배경화면 색을 따라가는 기능)가 켜져 있어 폰마다 색이 다르게 보입니다. 뭉타이머만의 색을 쓰기 위해 이 기능을 끕니다.</p>

  <h3>7. 버그를 잡는 순서</h3>
  <ol class="steps">

<section class="sec" data-sec="example">
  <h3>예제 1. 백 스택을 목록으로 흉내 내기 <small>(Kotlin Playground)</small></h3>
  <script type="text/plain" class="code" data-lang="kotlin" data-title="Ex1.kt" data-run="d7_ex1">
// 백 스택 = 화면 이름을 쌓아 둔 목록. 맨 뒤(last)가 지금 보이는 화면
val backStack = mutableListOf("타이머")

fun show() {
    println("백 스택 $backStack → 보이는 화면: ${backStack.last()}")
}

// 하단 탭을 눌렀을 때의 규칙: 항상 [타이머] 또는 [타이머, 다른 탭]
fun selectTab(tab: String) {
    while (backStack.size > 1) backStack.removeLastOrNull()   // 타이머만 남기고 내린다
    if (tab != "타이머") backStack.add(tab)                    // 고른 탭을 올린다
    show()
}

// 뒤로 가기: 내릴 접시가 있으면 내리고, 없으면 앱이 닫힌다
fun goBack() {
    if (backStack.size > 1) {
        backStack.removeLastOrNull()
        show()
    } else {
        println("더 돌아갈 곳이 없어요 → 앱이 닫힌다")
    }
}

fun main() {
    show()
    selectTab("도감")
    selectTab("그룹")       // 도감을 내리고 그룹을 올린다
    selectTab("그룹")       // 같은 탭을 또 눌러도 쌓이지 않는다
    goBack()
    goBack()
}
  </script>

백 스택 [타이머] → 보이는 화면: 타이머
백 스택 [타이머, 도감] → 보이는 화면: 도감
백 스택 [타이머, 그룹] → 보이는 화면: 그룹
백 스택 [타이머, 그룹] → 보이는 화면: 그룹
백 스택 [타이머] → 보이는 화면: 타이머

  <div class="note"><code>removeLast()</code>가 아니라 <code>removeLastOrNull()</code>을 쓰는 이유: 이름이 비슷한 <code>removeLast()</code>는 최신 자바의 기능과 이름이 겹쳐서, 안드로이드 14 이하 기기에서 실행 중 오류(<code>NoSuchMethodError</code>)를 일으킬 수 있습니다. <code>removeLastOrNull()</code>은 코틀린이 제공하는 함수라 모든 기기에서 안전하고, 목록이 비어 있어도 죽지 않습니다.</div>

  <h3>예제 2. Navigation 3 — 목록에서 상세 화면으로, 데이터와 함께 이동</h3>
  <p>아래 "안드로이드 스튜디오 사용법 A"의 라이브러리 2줄을 먼저 추가하세요. 키가 <code>data class</code>이면 <b>화면에 전달할 값</b>(어떤 뭉을 눌렀는지)을 함께 실어 보낼 수 있습니다.</p>
  <script type="text/plain" class="code" data-lang="kotlin" data-title="practice/Day7Navigation.kt" data-path="app/src/main/java/com/example/mungtimer/practice/Day7Navigation.kt">
package com.example.mungtimer.practice

import androidx.compose.foundation.clickable
import androidx.compose.foundation.layout.Column
import androidx.compose.foundation.layout.fillMaxWidth
import androidx.compose.foundation.layout.padding
import androidx.compose.material3.Button
import androidx.compose.material3.Text
import androidx.compose.runtime.Composable
import androidx.compose.runtime.mutableStateListOf
import androidx.compose.runtime.remember
import androidx.compose.ui.Modifier
import androidx.compose.ui.unit.dp
import androidx.compose.ui.unit.sp
import androidx.navigation3.runtime.entryProvider
import androidx.navigation3.ui.NavDisplay
import com.example.mungtimer.model.MungCatalog

// ① 키: 화면을 가리키는 이름표
data object MungListKey                         // 값이 필요 없는 화면은 data object
data class MungDetailKey(val mungId: Int)       // 값을 실어 보낼 화면은 data class

@Composable
fun MungBrowser(modifier: Modifier = Modifier) {
    // ② 백 스택: Compose가 지켜보는 목록. 처음에는 목록 화면 하나
    //    (연습용이라 remember에 둔다. 회전하면 처음으로 돌아간다)
    val backStack = remember { mutableStateListOf<Any>(MungListKey) }

    // ③ NavDisplay: 백 스택의 맨 위 키에 해당하는 화면을 보여 준다
    NavDisplay(
        backStack = backStack,
        onBack = { backStack.removeLastOrNull() },      // 폰의 뒤로 가기 → 맨 위를 내린다
        modifier = modifier,
        // ④ entryProvider: "이 키면 이 화면". entry<키 타입> { 화면 }
        entryProvider = entryProvider {
            entry<MungListKey> {
                Column(modifier = Modifier.padding(16.dp)) {
                    for (mung in MungCatalog.all) {
                        Text(
                            text = "${mung.emoji} ${mung.name}",
                            fontSize = 20.sp,
                            modifier = Modifier
                                .fillMaxWidth()
                                // 누르면 그 뭉의 id를 실은 키를 올린다 = 상세 화면으로 이동
                                .clickable { backStack.add(MungDetailKey(mung.id)) }
                                .padding(12.dp),
                        )
                    }
                }
            }
            entry<MungDetailKey> { key ->               // key로 실려 온 값을 꺼낸다
                val mung = MungCatalog.findById(key.mungId)
                Column(modifier = Modifier.padding(16.dp)) {
                    Text(text = mung?.emoji ?: "?", fontSize = 64.sp)
                    Text(text = mung?.name ?: "없는 뭉", fontSize = 24.sp)
                    Text(text = mung?.description ?: "")
                    Button(onClick = { backStack.removeLastOrNull() }) {    // 화면 안의 버튼으로도 뒤로
                        Text("목록으로")
                    }
                }
            }
        },
    )
}
  </script>
  <div class="note"><b>확인해 보기:</b> <code>MainActivity</code>에서 잠깐 <code>MungBrowser(modifier = Modifier.padding(innerPadding))</code>을 보여 주게 바꿔 실행하세요. 뭉을 누르면 상세 화면이 미끄러지듯 나타나고, 폰의 뒤로 가기로 목록에 돌아옵니다. 화면 전환 애니메이션은 <code>NavDisplay</code>가 기본으로 넣어 줍니다.</div>

    MaterialTheme(

        typography = Typography,

  <h3>B. 앱 이름 바꾸기</h3>
  <ol class="steps">

  <h3>C. 앱 아이콘 만들기 (Image Asset Studio)</h3>
  <ol class="steps">
    <li>Project 창에서 <code>res</code> 폴더를 오른쪽 클릭 → <span class="menu-path">New → Image Asset</span></li>
    <li><b>Icon Type</b>은 <b>Launcher Icons (Adaptive and Legacy)</b> 그대로 둡니다.</li>
    <li><b>Foreground Layer</b> 탭 → Asset Type에서 <b>Text</b>를 고르고 <code>뭉</code>을 입력합니다. (그려 둔 그림이 있으면 <b>Image</b>로 불러옵니다.) 아래 <b>Resize</b> 슬라이더로 미리보기의 안전 영역(원) 안에 들어오게 줄입니다.</li>
    <li><b>Background Layer</b> 탭 → Asset Type <b>Color</b> → 색을 <code>FF8FA3</code>(뭉 분홍)으로 지정합니다.</li>
    <li><b>Next → Finish</b>. 기존 아이콘 파일을 덮어쓴다는 경고는 그대로 진행합니다.</li>
    <li>앱을 다시 실행해 홈 화면에서 아이콘과 이름을 확인합니다.</li>
  </ol>

  <h3>D. 다크 모드와 큰 글자로 점검하기</h3>
  <ul>
    <li><b>다크 모드</b>: 기기의 빠른 설정에서 "다크 모드"를 켜고 세 화면을 모두 봅니다. 글자가 배경에 묻히는 곳이 없는지 확인합니다.</li>
    <li><b>큰 글자</b>: <span class="menu-path">설정 → 디스플레이 → 글자 크기</span>를 최대로 키워 글자가 잘리지 않는지 봅니다.</li>
    <li><b>회전</b>: 세 화면 각각에서 회전해 입력하던 글자와 보던 탭이 유지되는지 봅니다.</li>
  </ul>

  <h3>E. debug APK 만들어 친구 폰에 설치하기</h3>
  <ol class="steps">
    <li>메뉴 <b>Build</b>에서 APK를 만드는 항목을 고릅니다. 버전에 따라 이름이 <span class="menu-path">Generate App Bundles or APKs → Generate APKs</span> 또는 <span class="menu-path">Build Bundle(s) / APK(s) → Build APK(s)</span>입니다. 못 찾겠으면 <kbd>Shift</kbd> 두 번 → "APK" 검색.</li>
    <li>오른쪽 아래에 완료 알림이 뜨면 <b>locate</b>를 눌러 폴더를 엽니다. 파일 위치는 <code>MungTimer/app/build/outputs/apk/debug/app-debug.apk</code>입니다.</li>
    <li>파일을 친구에게 보냅니다(구글 드라이브 링크, 메신저의 파일 전송, USB 복사 등).</li>
    <li>친구 폰에서 파일을 열면 "출처를 알 수 없는 앱"을 설치할지 묻습니다. 파일을 연 앱(예: 드라이브, 파일 앱)에 <b>이 출처 허용</b>을 켜고 <b>설치</b>합니다. Play 프로텍트가 경고하면 <b>세부정보 → 무시하고 설치</b>를 고릅니다.</li>
    <li>친구가 닉네임을 정하고 내 <b>초대 코드</b>로 참여하면, 두 폰의 랭킹에 서로가 보입니다. 🎉</li>
  </ol>

  <div class="note warn"><b>APK를 다시 보낼 때 알아 둘 것</b> — ① debug APK는 <b>내 컴퓨터의 디버그 키</b>로 서명됩니다. 같은 컴퓨터에서 만든 새 APK는 친구 폰에 덮어 설치되고 데이터도 유지됩니다. ② 다른 컴퓨터에서 만들었거나 release APK로 바꾸면 서명이 달라 "앱이 설치되지 않았습니다"가 뜹니다. 이때는 기존 앱을 삭제해야 하는데, <b>삭제하면 도감과 익명 계정(그룹 소속)이 사라집니다.</b> ③ 새 버전을 보낼 때는 <code>app/build.gradle.kts</code>의 <code>versionCode</code>를 1씩 올리고 <code>versionName</code>도 바꿔 두면 구분하기 좋습니다.</div>

  <h3>F. (선택) 서명된 release APK</h3>
  <ol class="steps">
    <li><span class="menu-path">Build → Generate Signed Bundle/APK</span> (버전에 따라 "Generate Signed App Bundle or APK") → <b>APK</b> 선택 → Next.</li>
    <li>Key store path 아래의 <b>Create new</b>를 눌러 키스토어 파일(<code>.jks</code>)의 위치와 비밀번호, 키 이름(alias), 유효 기간(기본 25년), 이름을 입력합니다.</li>
    <li>Next → Build Variant에서 <b>release</b>를 고르고 <b>Create</b>(또는 Finish). 결과물은 <code>app/release/app-release.apk</code>에 생깁니다.</li>
  </ol>
  <div class="note warn"><b>키스토어 파일과 비밀번호를 잃어버리면 같은 앱으로 다시는 업데이트를 낼 수 없습니다.</b> 프로젝트 폴더 밖의 안전한 곳에 백업하고, 깃허브 같은 공개 저장소에는 절대 올리지 마세요.</div>
